function addTag(raw) {
  const tag = (raw || '').trim().replace(/,+$/, '').trim();
  if (!tag) return;
  // Case-insensitive, because "Workflow" and "workflow" filter as two chips and
  // that is exactly the drift the vocabulary exists to stop.
  if (tagDraft.some(t => t.toLowerCase() === tag.toLowerCase())) return;
  tagDraft.push(tag);
  renderTagDraft();
}

importTagRow.addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-tag-index]');
  if (!btn) return;
  tagDraft.splice(Number(btn.dataset.tagIndex), 1);
  renderTagDraft();
});
document.getElementById('importTagAdd').addEventListener('click', () => {
  addTag(importTagInput.value); importTagInput.value = ''; importTagInput.focus();
});
importTagInput.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ',') return;
  ev.preventDefault();
  addTag(importTagInput.value); importTagInput.value = '';
});
importTagCommon.addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-tag]');
  if (btn) addTag(btn.dataset.tag);
});

// Suggestions come from the tags already in the archive, most-used first. They
// are not read from topics.txt: the browser cannot see that file, and a third
// copy of the vocabulary would drift against the two that already exist. The
// preferred tags rise to the top here anyway, by being the ones actually used.
function fillTagSuggestions() {
  const counts = Array.from(topicCounts().values()).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));
  importTagOptions.innerHTML = counts.map(function (c) {
    return '<option value="' + escapeAttr(c.label) + '">' + c.n + ' note' + (c.n === 1 ? '' : 's') + '</option>';
  }).join('');
  importTagCommon.innerHTML = counts.slice(0, 12).map(function (c) {
    return '<button type="button" data-tag="' + escapeAttr(c.label) + '">' + escapeHtml(c.label) + '</button>';
  }).join('');
}

// Resolves once the user has accepted or corrected the tags. Never rejects —
// the note is already saved by this point, so a problem here must not read as
// the save having failed.
async function confirmTags(id) {
  // Do NOT depend on the note being in allThoughts. loadAll() refetches the
  // whole archive and swallows its own errors, so on a slow connection the
  // list can silently stay stale — and this step then did nothing at all, with
  // no way to tell that from "the extractor happened to get it right". The id
  // is enough on its own; ask the archive for just this note's metadata if the
  // list has not caught up. max_chars keeps that to a few hundred bytes rather
  // than pulling a whole article back.
  let topics = [];
  const note = allThoughts.find(t => t.id === id);
  if (note) {
    topics = (note.topics || []).slice();
  } else {
    try {
      const doc = JSON.parse(await callTool('fetch', { id: id, max_chars: 1 }));
      const t = doc && doc.metadata && doc.metadata.topics;
      topics = Array.isArray(t) ? t : [];
    } catch (_) {
      topics = [];   // still offer the step; better to tag by hand than not at all
    }
  }
  tagNoteId = id;
  tagOriginal = topics.slice();
  tagDraft = tagOriginal.slice();
  importTagsHead.textContent = tagOriginal.length
    ? 'Suggested tags — change them if they are wrong'
    : 'No tags were suggested — add one';
  setTagStatus('');
  fillTagSuggestions();
  renderTagDraft();
  tagPanel.hidden = false;
  importTagInput.value = '';
  importTagInput.focus();
  return new Promise(resolve => { tagResolve = resolve; });
}

function finishTags() {
  tagPanel.hidden = true;
  const done = tagResolve; tagResolve = null;
  if (done) done();
}

function setTagStatus(msg, isError) {
  tagStatus.textContent = msg || '';
  tagStatus.classList.toggle('error', Boolean(isError));
}

document.getElementById('importTagSkip').addEventListener('click', finishTags);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !tagPanel.hidden) { ev.preventDefault(); finishTags(); }
});
document.getElementById('importTagSave').addEventListener('click', async ev => {
  const btn = ev.currentTarget;
  const same = tagDraft.length === tagOriginal.length &&
               tagDraft.every((t, i) => t === tagOriginal[i]);
  if (same) { finishTags(); return; }
  btn.disabled = true;
  setTagStatus('Saving tags…');
  try {
    await callTool('update_thought', { id: tagNoteId, topics: tagDraft });
    await loadAll();
    setTagStatus('');
    btn.disabled = false;
    finishTags();
  } catch (err) {
    // Leave the panel open on failure, so the tags typed are not lost.
    setTagStatus('Tags not saved — ' + err.message, true);
    btn.disabled = false;
  }
});

importSaveNew.addEventListener('click', async () => {
  const content = importText.value.trim();
  if (!content) { setImportStatus('Nothing to save.', true); return; }
  importSaveNew.disabled = true;
  setImportStatus('Saving…');
  try {
    const body = content;
    const made = [];
    setImportStatus('Saving…');
    const res = await callTool('capture_thought', { content: body });
    const id = /id: ([0-9a-f-]{36})/.exec(res);
    if (id) {
      await applyDetectedMeta(id[1], null);
      await recordImportLinks(id[1]);
    }
    await loadAll();
    setImportStatus('');
    if (id) { tagNoteId = id[1]; await confirmTags(id[1]); }
    showImportSummary(made);
  } catch (err) {
    setImportStatus('Could not save — ' + err.message, true);
  } finally {
    importSaveNew.disabled = false;
  }
});

const importFillToggle = document.getElementById('importFillToggle');

// Whichever action you are actually taking should be the bright one. Leaving
// "Save as new note" highlighted while the picker is open is what produced a
// run of duplicate notes.
function setImportEmphasis(fillingExisting) {
  importFillToggle.classList.toggle('ghost', !fillingExisting);
  importSaveNew.classList.toggle('ghost', fillingExisting);
  importFillToggle.setAttribute('aria-expanded', fillingExisting ? 'true' : 'false');
}

importFillToggle.addEventListener('click', () => {
  const open = importPicker.classList.toggle('on');
  setImportEmphasis(open);
  if (open) {
    renderImportPicker('');
    importPickerInput.focus();
  }
});

function renderImportPicker(query) {
  const q = query.trim().toLowerCase();
  // Notes still holding only a preview are the usual target, so float them up.
  // Marker common to every preview note, and absent from ordinary notes that
  // merely mention them — otherwise the process notes offer themselves up
  // as something to overwrite.
  // A preview note carries both the marker and its own source footer. Testing
  // for both keeps notes that merely *write about* preview notes — the process
  // notes — from offering themselves up as something to overwrite.
  const stubs = allThoughts.filter(t => t.content.indexOf('Paste the full text here') !== -1
                                     && t.content.indexOf('_Source: http') !== -1);
  // Match on words, ignoring punctuation, so "4question" finds "4-Question"
  // and "codex claude" finds "Claude vs. Codex".
  const flatten = (str) => (str || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const terms = flatten(q).split(' ').filter(Boolean);
  const squashed = flatten(q).replace(/ /g, '');
  const pool = terms.length
    ? allThoughts.filter(t => {
        const hay = flatten((t.title || '') + ' ' + t.content.slice(0, 400));
        return terms.every(term => hay.indexOf(term) !== -1) ||
               hay.replace(/ /g, '').indexOf(squashed) !== -1;
      })
    : stubs.concat(allThoughts.filter(t => stubs.indexOf(t) === -1));
  const matches = pool.slice(0, 8);
  importPickerResults.innerHTML = matches.length
    ? matches.map(t => '<button class="link-picker-item" data-id="' + escapeAttr(t.id) +
        '" type="button">' + escapeHtml(t.title ||
          t.content.replace(/\s+/g, ' ').trim().slice(0, 70)) + '</button>').join('')
    : '<span class="field-value empty" style="padding:6px 8px;display:block;">No matches.</span>';

  importPickerResults.querySelectorAll('.link-picker-item').forEach(btn => {
    btn.addEventListener('click', async () => {
      const content = importText.value.trim();
      if (!content) { setImportStatus('Nothing to save.', true); return; }
      const id = btn.getAttribute('data-id');
      btn.disabled = true;
      setImportStatus('Replacing…');
      try {
        const body = content;
        const made = [];
        setImportStatus('Saving…');
        await callTool('update_thought', { id: id, content: body });
        await applyDetectedMeta(id, findThought(id));
        await recordImportLinks(id);
        await loadAll();
        setImportStatus('');
        importPicker.classList.remove('on');
        showImportSummary(made);
      } catch (err) {
        btn.disabled = false;
        setImportStatus('Could not replace — ' + err.message, true);
      }
    });
  });
}
importPickerInput.addEventListener('input', () => renderImportPicker(importPickerInput.value));

// ---------- the shape of the archive ----------
// Every figure here is computed from the notes already in memory, so opening
// this costs nothing and it can never disagree with what the drawer shows.
//
// Palette: the catalog's own accents are muted UI colours and fail as data
// series (moss and blue separate by only ΔE 9.4 — indistinguishable even with
// full colour vision). These four are validated for the dark surface: inside
// the lightness band, above the chroma floor, ΔE 13.9 deutan / 19.6 normal.
const SERIES = {
  reference:   '#C4802F',
  observation: '#4292C4',
  task:        '#67A84F',
  idea:        '#AE6FA6',
  unfiled:     '#766B54',
};
const TYPE_ORDER = ['reference', 'observation', 'task', 'idea', 'unfiled'];

const statsPanel = document.getElementById('statsPanel');
const statsBody = document.getElementById('statsBody');

function isPreview(t) {
  return t.content.indexOf('Paste the full text here') !== -1 &&
         t.content.indexOf('_Source: http') !== -1;
}

function archiveFigures() {
  const notes = allThoughts;
  const linkCount = notes.reduce(
    (n, t) => n + (t.content.match(/\]\(thought:/g) || []).length, 0);

  const degree = new Map();
  notes.forEach(t => {
    const ids = new Set([...(t.linked_thought_ids || [])]);
    (t.content.match(/\]\(thought:([0-9a-f-]{36})\)/g) || []).forEach(m => {
      const id = m.slice(9, -1);
      ids.add(id);
    });
    degree.set(t.id, (degree.get(t.id) || 0) + ids.size);
    ids.forEach(id => degree.set(id, (degree.get(id) || 0) + 1));
  });

  const byType = {};
  TYPE_ORDER.forEach(k => { byType[k] = 0; });
  notes.forEach(t => { byType[t.type && byType[t.type] !== undefined ? t.type : 'unfiled'] += 1; });

  const topics = new Map();
  notes.forEach(t => (t.topics || []).forEach(raw => {
    const k = raw.trim();
    if (k) topics.set(k, (topics.get(k) || 0) + 1);
  }));

  // Bucket by day while the archive is young — weekly buckets over three days
  // of capturing would draw a single bar and say nothing.
  const dates = notes.map(t => new Date(t.created_at)).filter(d => !isNaN(d));
  const spanDays = dates.length
    ? (Math.max(...dates) - Math.min(...dates)) / 86400000 : 0;
  const byDay = spanDays <= 60;
  const weeks = new Map();
  dates.forEach(d => {
    const bucket = new Date(d);
    if (!byDay) bucket.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const key = bucket.toISOString().slice(0, 10);
    weeks.set(key, (weeks.get(key) || 0) + 1);
  });
  weeks.byDay = byDay;

  const waiting = notes.filter(isPreview);
  return {
    notes, linkCount, degree, byType, topics, weeks, waiting,
    complete: notes.length - waiting.length,
    orphans: notes.filter(t => (degree.get(t.id) || 0) === 0),
    withAuthor: notes.filter(t => t.author).length,
    withSource: notes.filter(t => t.source_url).length,
  };
}

function svg(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
  return el;
}

// One tooltip, moved around, rather than a title on every mark.
let statsTip;
function showTip(html, x, y) {
  if (!statsTip) {
    statsTip = document.createElement('div');
    statsTip.className = 'stats-tip';
    document.body.appendChild(statsTip);
  }
  statsTip.innerHTML = html;
  statsTip.style.display = 'block';
  statsTip.style.left = Math.min(x + 12, innerWidth - 190) + 'px';
  statsTip.style.top = (y - 10) + 'px';
}
function hideTip() { if (statsTip) statsTip.style.display = 'none'; }

function tileRow(f) {
  const tiles = [
    ['notes', f.notes.length],
    ['complete', f.complete],
    ['awaiting text', f.waiting.length],
    ['links between notes', f.linkCount],
    ['unconnected', f.orphans.length],
  ];
  return '<div class="stats-tiles">' + tiles.map(t =>
    '<div><span class="n">' + t[1] + '</span><span class="k">' + t[0] + '</span></div>').join('') +
    '</div>';
}

// Progress is one number's job, so it gets a meter rather than a chart.
function completeness(f) {
  const pct = f.notes.length ? Math.round(f.complete / f.notes.length * 100) : 0;
  return '<div class="stats-card">' +
    '<h3>Completeness <span class="hint">' + f.complete + ' of ' + f.notes.length +
    ' notes hold their full text</span></h3>' +
    '<div class="meter"><div class="meter-fill" style="width:' + pct + '%"></div></div>' +
    '<p class="meter-label"><strong>' + pct + '%</strong> complete · ' +
    f.waiting.length + ' waiting on an import</p></div>';
}

function typeChart(f) {
  const total = TYPE_ORDER.reduce((n, k) => n + f.byType[k], 0) || 1;
  const present = TYPE_ORDER.filter(k => f.byType[k] > 0);
  let x = 0;
  const segs = present.map(k => {
    const w = f.byType[k] / total * 100;
    const seg = '<span class="seg" style="left:' + x + '%;width:' + w + '%;background:' +
      SERIES[k] + '" data-type="' + k + '" data-count="' + f.byType[k] + '"></span>';
    x += w;
    return seg;
  }).join('');
  const legend = present.map(k =>
    '<span class="key"><i style="background:' + SERIES[k] + '"></i>' + k +
    ' <b>' + f.byType[k] + '</b></span>').join('');
  return '<div class="stats-card"><h3>What kind of notes <span class="hint">by type</span></h3>' +
    '<div class="stack" id="typeStack">' + segs + '</div>' +
    '<div class="legend">' + legend + '</div></div>';
}

function weeksChart(f) {
  const keys = [...f.weeks.keys()].sort();
  if (!keys.length) return '';
  const max = Math.max(...keys.map(k => f.weeks.get(k)));
  const W = 640, H = 150, pad = 26;
  const slot = (W - pad * 2) / keys.length;
  // Cap the width so a handful of buckets do not draw slabs.
  const bw = Math.min(30, Math.max(6, slot - 6));
  let bars = '';
  keys.forEach((k, i) => {
    const v = f.weeks.get(k);
    const h = Math.max(2, (v / max) * (H - pad * 2));
    const x = pad + i * slot + (slot - bw) / 2;
    bars += '<rect class="bar" x="' + x + '" y="' + (H - pad - h) + '" width="' + bw +
      '" height="' + h + '" rx="3" data-week="' + k + '" data-count="' + v + '"></rect>';
  });
  const first = new Date(keys[0]).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  const last = new Date(keys[keys.length - 1]).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  return '<div class="stats-card"><h3>When it was captured ' +
    '<span class="hint">notes per ' + (f.weeks.byDay ? 'day' : 'week') + '</span></h3>' +
    '<svg class="chart" id="weeksChart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="Notes captured per week">' +
    '<line class="axis" x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) +
    '" y2="' + (H - pad) + '"></line>' + bars + '</svg>' +
    '<p class="axis-label"><span>' + first + '</span><span>' + last + '</span></p></div>';
}

function topicsChart(f) {
  // Tags used once are the extractor's noise, not what the archive is about.
  const rows = [...f.topics.entries()].filter(r => r[1] > 1)
    .sort((a, b) => b[1] - a[1]).slice(0, 12);
  if (!rows.length) return '';
  const max = rows[0][1];
  const bars = rows.map(r =>
    '<li><span class="t">' + escapeHtml(r[0]) + '</span>' +
    '<span class="track"><span class="fill" style="width:' + (r[1] / max * 100) + '%"></span></span>' +
    '<span class="v">' + r[1] + '</span></li>').join('');
  // How the tag vocabulary is distributed. Kept as text rather than bars: these
  // count *tags*, while the chart above counts *notes*, and one axis cannot
  // honestly carry both.
  const vals = [...f.topics.values()];
  const once = vals.filter(v => v === 1).length;
  const twice = vals.filter(v => v === 2).length;
  const more = vals.filter(v => v > 2).length;
  return '<div class="stats-card"><h3>What it is about ' +
    '<span class="hint">most used tags, of ' + f.topics.size + '</span></h3>' +
    '<ol class="bars">' + bars + '</ol>' +
    '<p class="note-line">Of ' + f.topics.size + ' tags: <strong>' + more +
    '</strong> used three or more times, <strong>' + twice + '</strong> twice, <strong>' +
    once + '</strong> once. The long tail is the extractor coining a fresh tag per note.</p></div>';
}

function hubsList(f) {
  const rows = [...f.degree.entries()]
    .map(([id, n]) => [allThoughts.find(t => t.id === id), n])
    .filter(r => r[0] && r[1] > 0)
    .sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (!rows.length) return '';
  return '<div class="stats-card"><h3>What the archive orbits ' +
    '<span class="hint">most connected notes</span></h3><ol class="hubs">' +
    rows.map(r => '<li><button data-open="' + escapeAttr(r[0].id) + '">' +
      escapeHtml(r[0].title || 'Untitled') + '</button><span>' + r[1] + '</span></li>').join('') +
    '</ol></div>';
}

// The graph is the one view that shows structure rather than counts: which
// notes cluster, and which sit alone.
function drawGraph(f) {
  const canvas = document.getElementById('graphCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 320;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const index = new Map(allThoughts.map((t, i) => [t.id, i]));
  const nodes = allThoughts.map((t, i) => ({
    id: t.id, t: t,
    x: w / 2 + Math.cos(i) * (40 + (i % 17) * 8),
    y: h / 2 + Math.sin(i) * (30 + (i % 13) * 6),
    vx: 0, vy: 0,
    deg: f.degree.get(t.id) || 0,
  }));
  const edges = [];
  allThoughts.forEach(t => {
    const seen = new Set();
    (t.content.match(/\]\(thought:([0-9a-f-]{36})\)/g) || []).forEach(m => seen.add(m.slice(9, -1)));
    (t.linked_thought_ids || []).forEach(id => seen.add(id));
    seen.forEach(id => {
      if (index.has(id) && id !== t.id) edges.push([index.get(t.id), index.get(id)]);
    });
  });

  // A few hundred iterations of repulsion + spring is enough at this size.
  for (let step = 0; step < 220; step++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const rep = 260 / d2;
        const d = Math.sqrt(d2);
        a.vx -= dx / d * rep; a.vy -= dy / d * rep;
        b.vx += dx / d * rep; b.vy += dy / d * rep;
      }
    }
    edges.forEach(([i, j]) => {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f2 = (d - 46) * 0.012;
      a.vx += dx / d * f2; a.vy += dy / d * f2;
      b.vx -= dx / d * f2; b.vy -= dy / d * f2;
    });
    nodes.forEach(n => {
      n.vx += (w / 2 - n.x) * 0.0016;
      n.vy += (h / 2 - n.y) * 0.0016;
      n.x += Math.max(-6, Math.min(6, n.vx));
      n.y += Math.max(-6, Math.min(6, n.vy));
      n.vx *= 0.82; n.vy *= 0.82;
      n.x = Math.max(10, Math.min(w - 10, n.x));
      n.y = Math.max(10, Math.min(h - 10, n.y));
    });
  }

  const paint = (hover) => {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(232,223,200,0.16)';
    ctx.lineWidth = 1;
    edges.forEach(([i, j]) => {
      ctx.beginPath();
      ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(nodes[j].x, nodes[j].y);
      ctx.stroke();
    });
    nodes.forEach(n => {
      const r = n.deg ? Math.min(9, 3 + n.deg * 0.7) : 2.5;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = n.deg ? (SERIES[n.t.type] || SERIES.unfiled) : 'rgba(118,107,84,0.75)';
      ctx.fill();
      if (hover === n) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#E9DFC7';
        ctx.stroke();
      }
    });
  };
  paint(null);

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let hit = null;
    for (const n of nodes) {
      const r = Math.max(6, n.deg ? 3 + n.deg * 0.7 : 3);
      if ((n.x - mx) ** 2 + (n.y - my) ** 2 < r * r + 24) { hit = n; break; }
    }
    paint(hit);
    if (hit) {
      showTip('<strong>' + escapeHtml(hit.t.title || 'Untitled') + '</strong>' +
              '<span>' + hit.deg + ' connection' + (hit.deg === 1 ? '' : 's') + '</span>',
              e.clientX, e.clientY);
      canvas.style.cursor = 'pointer';
    } else { hideTip(); canvas.style.cursor = 'default'; }
  };
  canvas.onmouseleave = () => { hideTip(); paint(null); };
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    for (const n of nodes) {
      const r = Math.max(6, n.deg ? 3 + n.deg * 0.7 : 3);
      if ((n.x - mx) ** 2 + (n.y - my) ** 2 < r * r + 24) {
        closeStats();
        selectThought(n.t);
        return;
      }
    }
  };
}

function graphCard(f) {
  return '<div class="stats-card wide"><h3>How it hangs together ' +
    '<span class="hint">' + f.linkCount + ' links · dots sized by connections · click to open</span></h3>' +
    '<canvas id="graphCanvas" height="320"></canvas>' +
    (f.orphans.length
      ? '<p class="note-line">' + f.orphans.length +
        ' note' + (f.orphans.length === 1 ? '' : 's') +
        ' connect to nothing yet — the dim, small dots.</p>'
      : '<p class="note-line">Every note is connected to at least one other.</p>') + '</div>';
}

function coverageCard(f) {
  const n = f.notes.length || 1;
  const rows = [
    ['has an author', f.withAuthor],
    ['has a source link', f.withSource],
    ['holds full text', f.complete],
  ];
  return '<div class="stats-card"><h3>How complete the records are ' +
    '<span class="hint">metadata coverage</span></h3><ol class="bars">' +
    rows.map(r => '<li><span class="t">' + r[0] + '</span>' +
      '<span class="track"><span class="fill" style="width:' + (r[1] / n * 100) + '%"></span></span>' +
      '<span class="v">' + Math.round(r[1] / n * 100) + '%</span></li>').join('') +
    '</ol></div>';
}

// ---------- quick add ----------
//
// Typing a task must stay one action, so the quick-add box understands a small,
// explicit syntax rather than guessing. Two markers, both optional:
//
//   #project      files it (the last one wins)
//   due:<when>    takes everything after the colon, so "due:1 sep" works
//
// <when> is today, tomorrow, a weekday name (the next one, never today), or any
// date parseDateInput already reads. Anything it cannot read is left in the
// title rather than silently dropped — a task that quietly loses its due date is
// worse than one that keeps a stray word.

const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

function parseWhen(text, today) {
  const s = (text || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if (!s) return null;

  const base = today ? new Date(today + 'T00:00:00Z') : new Date();
  const iso = d => d.toISOString().slice(0, 10);

  if (s === 'today') return iso(base);
  if (s === 'tomorrow') {
    const d = new Date(base.getTime());
    d.setUTCDate(d.getUTCDate() + 1);
    return iso(d);
  }
  // "friday" means the next Friday. Saying it on a Friday means a week today,
  // because a task you are writing down is not one you have already done.
  const wd = WEEKDAYS.findIndex(n => n === s || n.slice(0, 3) === s);
  if (wd >= 0) {
    const d = new Date(base.getTime());
    let delta = (wd - d.getUTCDay() + 7) % 7;
    if (delta === 0) delta = 7;
    d.setUTCDate(d.getUTCDate() + delta);
    return iso(d);
  }
  return parseDateInput(s) || null;
}

function parseQuickAdd(raw, today) {
  let text = (raw || '').trim();
  let due = null;
  let project = null;

  // due: runs to the end of the line, so multi-word dates need no quoting.
  const dueAt = text.search(/(^|\s)due:/i);
  if (dueAt >= 0) {
    const after = text.slice(dueAt).replace(/^\s*due:/i, '');
    const parsed = parseWhen(after, today);
    if (parsed) {
      due = parsed;
      text = text.slice(0, dueAt);
    }
  }

  text = text.replace(/(^|\s)#([^\s#]+)/g, (_m, lead, word) => {
    project = word;
    return lead;
  });

  return {
    title: text.replace(/\s+/g, ' ').trim(),
    due_date: due,
    project: project,
  };
}

/* ---------- tasks ----------
   The drawer shows either the archive or the list of what needs doing. They
   share the shell and the access key and nothing else: a note is found by
   meaning, a task by when it is due. */

let viewMode = 'notes';        // 'notes' | 'tasks'
let allTasks = [];
let selectedTaskId = null;
let taskFilter = 'open';       // 'open' | 'inbox' | 'next' | 'waiting' | 'done'

const TASK_STATUS_LABELS = {
  inbox: 'Inbox', next: 'Next', waiting: 'Waiting', done: 'Done', dropped: 'Dropped',
};

const RECUR_HINT = "daily · weekly · fortnightly · monthly · quarterly · yearly · " +
                   "weekdays · every 3 days · every 2 weeks · every tuesday";

function daysBetween(fromISO, toISO) {
  const a = Date.parse(fromISO + 'T00:00:00Z');
  const b = Date.parse(toISO + 'T00:00:00Z');
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}

// Group by when, not by status: what you want from a task list is what is late,
// what is today, and what can wait — status is a detail inside that.
function groupTasks(tasks, today) {
  const groups = [
    { key: 'overdue', label: 'Overdue', tasks: [] },
    { key: 'today', label: 'Today', tasks: [] },
    { key: 'week', label: 'This week', tasks: [] },
    { key: 'later', label: 'Later', tasks: [] },
    { key: 'someday', label: 'No date', tasks: [] },
  ];
  const by = {};
  groups.forEach(g => { by[g.key] = g; });

  tasks.forEach(t => {
    if (!t.due_date) { by.someday.tasks.push(t); return; }
    const d = daysBetween(today, t.due_date);
    if (d === null) by.someday.tasks.push(t);
    else if (d < 0) by.overdue.tasks.push(t);
    else if (d === 0) by.today.tasks.push(t);
    else if (d <= 7) by.week.tasks.push(t);
    else by.later.tasks.push(t);
  });

  // Oldest-due first inside a group; undated tasks by when they were captured,
  // so the inbox reads in the order things occurred to you.
  groups.forEach(g => {
    g.tasks.sort((a, b) => {
      if (a.due_date && b.due_date && a.due_date !== b.due_date) {
        return a.due_date < b.due_date ? -1 : 1;
      }
      return (a.created_at || '') < (b.created_at || '') ? -1 : 1;
    });
  });

  return groups.filter(g => g.tasks.length);
}

function dueLabel(iso, today) {
  const d = daysBetween(today, iso);
  if (d === null) return { text: iso, tone: '' };
  if (d < -1) return { text: Math.abs(d) + ' days late', tone: 'late' };
  if (d === -1) return { text: 'yesterday', tone: 'late' };
  if (d === 0) return { text: 'today', tone: 'soon' };
  if (d === 1) return { text: 'tomorrow', tone: 'soon' };
  if (d <= 7) {
    const day = new Date(iso + 'T00:00:00Z')
      .toLocaleDateString(undefined, { weekday: 'long', timeZone: 'UTC' });
    return { text: day, tone: 'soon' };
  }
  return { text: formatDate(iso + 'T00:00:00Z'), tone: '' };
}

// ---------- loading ----------

function normalizeTask(raw) {
  return {
    id: raw.id,
    title: raw.title || '',
    notes: raw.notes || '',
    status: raw.status || 'inbox',
    project: raw.project || '',
    due_date: raw.due_date || '',
    defer_until: raw.defer_until || '',
    recur: raw.recur || '',
    recur_from: raw.recur_from || 'completion',
    thought_id: raw.thought_id || null,
    created_at: raw.created_at || null,
    completed_at: raw.completed_at || null,
  };
}

async function loadTasks(keepSelection) {
  showStatus('Looking at what needs doing…', false);
  const args = { format: 'json', limit: 200 };
  if (taskFilter === 'done') args.status = ['done'];
  else if (taskFilter !== 'open') args.status = [taskFilter];
  // Deferred tasks come back only when you go looking for them: the point of
  // deferring something is not to see it.
  if (taskFilter !== 'open') args.include_deferred = true;

  try {
    const text = await callTool('list_tasks', args);
    let raw;
    try { raw = JSON.parse(text); } catch (_) { raw = []; }
    allTasks = (Array.isArray(raw) ? raw : []).map(normalizeTask);
    if (!keepSelection) selectedTaskId = null;
    renderTaskList();
    renderTaskCount();
  } catch (err) {
    showStatus('Could not reach the archive — ' + err.message, true, () => loadTasks(keepSelection));
  }
}

function renderTaskCount() {
  const el = document.getElementById('modeTasksN');
  if (!el) return;
  const today = todayISO();
  // The badge counts what is actually pressing, not the size of the list —
  // a number that only ever grows stops meaning anything.
  const pressing = allTasks.filter(t =>
    t.status !== 'done' && t.status !== 'dropped' &&
    t.due_date && daysBetween(today, t.due_date) <= 0).length;
  el.textContent = pressing ? String(pressing) : '';
}

// ---------- the list ----------

const TICK_SVG = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

function renderTaskList() {
  listScroll.innerHTML = '';

  if (!allTasks.length) {
    const status = document.createElement('div');
    status.className = 'list-status';
    status.textContent = taskFilter === 'done'
      ? 'Nothing finished yet.'
      : 'Nothing to do. Type above to add something.';
    listScroll.appendChild(status);
    return;
  }

  const today = todayISO();
  groupTasks(allTasks, today).forEach(group => {
    const head = document.createElement('div');
    head.className = 'task-group' + (group.key === 'overdue' ? ' overdue' : '');
    head.innerHTML = `<span>${group.label}</span><span>${group.tasks.length}</span>`;
    listScroll.appendChild(head);
    group.tasks.forEach(t => listScroll.appendChild(taskRow(t, today)));
  });
}

function taskRow(t, today) {
  const row = document.createElement('div');
  const done = t.status === 'done';
  row.className = 'task-row' + (selectedTaskId === t.id ? ' selected' : '') + (done ? ' is-done' : '');

  const bits = [];
  if (t.due_date) {
    const d = dueLabel(t.due_date, today);
    bits.push(`<span class="due ${d.tone}">${escapeHtml(d.text)}</span>`);
  }
  if (t.project) bits.push(`<span class="proj">${escapeHtml(t.project)}</span>`);
  if (t.recur) bits.push(`<span class="repeat">repeats ${escapeHtml(t.recur)}</span>`);
  if (t.defer_until && daysBetween(today, t.defer_until) > 0) {
    bits.push(`<span>hidden until ${escapeHtml(t.defer_until)}</span>`);
  }
  if (t.thought_id) bits.push('<span class="note-link">from a note</span>');
  if (t.status !== 'inbox' && t.status !== 'done') {
    bits.push(`<span class="task-status-tag">${escapeHtml(TASK_STATUS_LABELS[t.status] || t.status)}</span>`);
  }

  const tick = document.createElement('button');
  tick.className = 'task-tick' + (done ? ' done' : '');
  tick.type = 'button';
  tick.innerHTML = TICK_SVG;
  tick.title = done ? 'Already done' : 'Mark done';
  tick.setAttribute('aria-label', done ? 'Already done' : 'Mark done: ' + t.title);

  const open = document.createElement('button');
  open.className = 'task-open';
  open.type = 'button';
  open.innerHTML =
    `<div class="task-title">${escapeHtml(t.title)}</div>` +
    (bits.length ? `<div class="task-sub">${bits.join('')}</div>` : '');

  if (!done) tick.addEventListener('click', () => completeTask(t, row));
  open.addEventListener('click', () => selectTask(t));

  row.appendChild(tick);
  row.appendChild(open);
  return row;
}

async function completeTask(t, row) {
  // Fade it immediately. The round trip is short but not instant, and a tick
  // that does nothing for half a second feels broken.
  row.classList.add('settling');
  try {
    await callTool('complete_task', { id: t.id });
    await loadTasks(true);
    if (selectedTaskId === t.id) showTaskEmptyState();
  } catch (err) {
    row.classList.remove('settling');
    showToastStatus('Could not complete that — ' + err.message);
  }
}

// A failure here has nowhere else to go: the row is still in the list and the
// detail pane may be showing something else entirely.
function showToastStatus(msg) {
  const head = document.querySelector('.task-group') || listScroll.firstChild;
  const el = document.createElement('div');
  el.className = 'list-status';
  el.style.color = 'var(--rust)';
  el.textContent = msg;
  listScroll.prepend(el);
  setTimeout(() => el.remove(), 6000);
  if (head) { /* keep the list where it was */ }
}

// ---------- quick add ----------

async function quickAddTask(text) {
  const parsed = parseQuickAdd(text, todayISO());
  if (!parsed.title) return;
  const args = { title: parsed.title, source: 'catalog' };
  if (parsed.due_date) args.due_date = parsed.due_date;
  if (parsed.project) args.project = parsed.project;
  try {
    await callTool('create_task', args);
    await loadTasks(true);
  } catch (err) {
    showToastStatus('Could not add that — ' + err.message);
  }
}

// ---------- the detail pane ----------

function showTaskEmptyState() {
  selectedTaskId = null;
  renderTaskList();
  main.innerHTML = `
    <div class="empty-state">
      <div class="glyph">✓</div>
      <p>Pick a task to change it, or tick it off from the drawer.</p>
    </div>
  `;
  app.classList.remove('detail-open');
}

function taskFieldRow(label, id, value, placeholder, hint) {
  return `
    <div class="task-field">
      <label class="task-label" for="${id}">${label}</label>
      <input class="task-input" id="${id}" type="text" value="${escapeAttr(value || '')}"
             placeholder="${escapeAttr(placeholder || '')}" />
      ${hint ? `<div class="task-hint" id="${id}Hint">${hint}</div>` : ''}
    </div>`;
}

function selectTask(t) {
  selectedTaskId = t.id;
  renderTaskList();

  const statusOptions = Object.keys(TASK_STATUS_LABELS)
    .map(s => `<option value="${s}"${s === t.status ? ' selected' : ''}>${TASK_STATUS_LABELS[s]}</option>`)
    .join('');

  main.innerHTML = `
    <div class="task-detail">
      <div class="task-field">
        <label class="task-label" for="tdTitle">Task</label>
        <input class="task-input" id="tdTitle" type="text" value="${escapeAttr(t.title)}" />
      </div>

      <div class="task-field">
        <label class="task-label" for="tdNotes">Notes</label>
        <textarea class="task-textarea" id="tdNotes"
          placeholder="Context, a phone number, what done looks like…">${escapeHtml(t.notes)}</textarea>
      </div>

      <div class="task-row-fields">
        <div class="task-field">
          <label class="task-label" for="tdStatus">Status</label>
          <select class="task-select" id="tdStatus">${statusOptions}</select>
        </div>
        ${taskFieldRow('Project', 'tdProject', t.project, 'e.g. house')}
      </div>

      <div class="task-row-fields">
        ${taskFieldRow('Due', 'tdDue', formatDateInput(t.due_date), 'friday, 1 Sep, 2026-09-01')}
        ${taskFieldRow('Hide until', 'tdDefer', formatDateInput(t.defer_until), 'nothing to do before then')}
      </div>

      <div class="task-row-fields">
        ${taskFieldRow('Repeats', 'tdRecur', t.recur, 'weekly, every 2 weeks…', RECUR_HINT)}
        <div class="task-field">
          <label class="task-label" for="tdRecurFrom">Counting from</label>
          <select class="task-select" id="tdRecurFrom">
            <option value="completion"${t.recur_from === 'completion' ? ' selected' : ''}>When I finish it</option>
            <option value="due"${t.recur_from === 'due' ? ' selected' : ''}>Its due date</option>
          </select>
        </div>
      </div>

      ${t.thought_id ? `
      <div class="task-field">
        <label class="task-label">Came from</label>
        <button class="task-btn ghost" id="tdOpenNote" type="button">Open the note</button>
      </div>` : ''}

      <div class="task-actions">
        <button class="task-btn" id="tdSave" type="button">Save</button>
        ${t.status !== 'done'
          ? '<button class="task-btn ghost" id="tdDone" type="button">Mark done</button>'
          : '<button class="task-btn ghost" id="tdReopen" type="button">Reopen</button>'}
        <button class="task-btn danger" id="tdDelete" type="button">Delete</button>
        <span class="task-detail-status" id="tdStatusMsg"></span>
      </div>
    </div>
  `;

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back to the list';
  back.addEventListener('click', () => app.classList.remove('detail-open'));
  main.prepend(back);
  app.classList.add('detail-open');

  wireTaskDetail(t);
}

function wireTaskDetail(t) {
  const msg = document.getElementById('tdStatusMsg');
  const say = (text, tone) => {
    msg.textContent = text || '';
    msg.className = 'task-detail-status' + (tone ? ' ' + tone : '');
  };

  const saveBtn = document.getElementById('tdSave');

  saveBtn.addEventListener('click', async () => {
    const title = document.getElementById('tdTitle').value.trim();
    if (!title) { say('A task needs a title.', 'bad'); return; }

    // Dates are read the way people write them, and a date that cannot be read
    // stops the save rather than being quietly dropped.
    const dueRaw = document.getElementById('tdDue').value.trim();
    const deferRaw = document.getElementById('tdDefer').value.trim();
    const due = dueRaw ? parseWhen(dueRaw, todayISO()) : '';
    const defer = deferRaw ? parseWhen(deferRaw, todayISO()) : '';
    if (dueRaw && !due) { say('Due date not recognised — try friday, 1 Sep or 2026-09-01.', 'bad'); return; }
    if (deferRaw && !defer) { say('Hide-until date not recognised.', 'bad'); return; }

    const recur = document.getElementById('tdRecur').value.trim();

    const args = {
      id: t.id,
      title: title,
      notes: document.getElementById('tdNotes').value.trim() || null,
      status: document.getElementById('tdStatus').value,
      project: document.getElementById('tdProject').value.trim() || null,
      due_date: due || null,
      defer_until: defer || null,
      recur: recur || null,
      recur_from: document.getElementById('tdRecurFrom').value,
    };

    saveBtn.disabled = true;
    say('Saving…');
    try {
      await callTool('update_task', args);
      await loadTasks(true);
      const fresh = allTasks.find(x => x.id === t.id);
      if (fresh) selectTask(fresh); else showTaskEmptyState();
    } catch (err) {
      saveBtn.disabled = false;
      say(String(err.message || err), 'bad');
    }
  });

  const doneBtn = document.getElementById('tdDone');
  if (doneBtn) doneBtn.addEventListener('click', async () => {
    doneBtn.disabled = true;
    say('Finishing…');
    try {
      const out = await callTool('complete_task', { id: t.id });
      await loadTasks(true);
      // complete_task says when the next instance is due; worth repeating,
      // because a repeating task vanishing off the list looks like a bug.
      showTaskEmptyState();
      if (/Next one due/.test(out)) showToastStatus(out);
    } catch (err) {
      doneBtn.disabled = false;
      say(String(err.message || err), 'bad');
    }
  });

  const reopenBtn = document.getElementById('tdReopen');
  if (reopenBtn) reopenBtn.addEventListener('click', async () => {
    reopenBtn.disabled = true;
    try {
      await callTool('update_task', { id: t.id, status: 'next' });
      await loadTasks(true);
      const fresh = allTasks.find(x => x.id === t.id);
      if (fresh) selectTask(fresh); else showTaskEmptyState();
    } catch (err) {
      reopenBtn.disabled = false;
      say(String(err.message || err), 'bad');
    }
  });

  const delBtn = document.getElementById('tdDelete');
  delBtn.addEventListener('click', async () => {
    if (delBtn.getAttribute('data-armed') !== 'yes') {
      delBtn.setAttribute('data-armed', 'yes');
      delBtn.textContent = 'Really delete';
      say('Deleting is permanent. To keep the record, set the status to Dropped instead.');
      return;
    }
    try {
      await callTool('delete_task', { id: t.id });
      await loadTasks(false);
      showTaskEmptyState();
    } catch (err) {
      say(String(err.message || err), 'bad');
    }
  });

  const noteBtn = document.getElementById('tdOpenNote');
  if (noteBtn) noteBtn.addEventListener('click', async () => {
    const found = findThought(t.thought_id);
    if (found) { setViewMode('notes'); selectThought(found); return; }
    // The note may be older than the hundred the drawer holds.
    noteBtn.disabled = true;
    noteBtn.textContent = 'Fetching…';
    try {
      const text = await callTool('fetch', { id: t.thought_id });
      const doc = JSON.parse(text);
      setViewMode('notes');
      selectThought(normalizeThought({
        id: doc.id, content: doc.text, created_at: doc.metadata && doc.metadata.created_at,
        metadata: doc.metadata || {},
      }));
    } catch (err) {
      noteBtn.disabled = false;
      noteBtn.textContent = 'Open the note';
      say('Could not fetch that note — ' + err.message, 'bad');
    }
  });
}

// ---------- switching between the two ----------

function renderTaskFilters() {
  chipRow.innerHTML = '';
  [['open', 'To do'], ['inbox', 'Inbox'], ['next', 'Next'],
   ['waiting', 'Waiting'], ['done', 'Done']].forEach(([key, label]) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (taskFilter === key ? ' active' : '');
    chip.type = 'button';
    if (taskFilter === key) chip.style.background = 'var(--brass)';
    chip.textContent = label;
    chip.addEventListener('click', () => {
      taskFilter = key;
      renderTaskFilters();
      loadTasks(false);
    });
    chipRow.appendChild(chip);
  });
}

function setViewMode(mode) {
  viewMode = mode;
  const tasks = mode === 'tasks';

  document.getElementById('modeNotes').setAttribute('aria-pressed', String(!tasks));
  document.getElementById('modeTasks').setAttribute('aria-pressed', String(tasks));
  document.getElementById('searchRow').hidden = tasks;
  document.getElementById('taskAddRow').hidden = !tasks;
  document.querySelector('.facet-bar').hidden = tasks;
  if (tasks) document.getElementById('facetPanel').hidden = true;

  // The note-only header buttons have nothing to act on in task mode.
  ['newBtn', 'statsBtn', 'importBtn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.hidden = tasks;
  });

  app.classList.remove('detail-open');
  closeReference();

  if (tasks) {
    renderTaskFilters();
    showTaskEmptyState();
    loadTasks(false);
  } else {
    chipRow.innerHTML = '';
    renderChips();
    showEmptyState();
    renderFacets();
  }
}

document.getElementById('modeNotes').addEventListener('click', () => {
  if (viewMode !== 'notes') setViewMode('notes');
});
document.getElementById('modeTasks').addEventListener('click', () => {
  if (viewMode !== 'tasks') setViewMode('tasks');
});

document.getElementById('taskAddInput').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const input = ev.currentTarget;
  const text = input.value;
  if (!text.trim()) return;
  input.value = '';
  quickAddTask(text);
});

// ---------- held notes ----------
// Three ways the queue drains, because none of them is reliable alone:
// the browser's own online event (which lies often enough on captive portals
// and VPNs that it cannot be the only trigger), every load (which covers the
// note written offline yesterday and reopened this morning), and the pill
// itself, for when you can see the connection is back and the browser cannot.
document.getElementById('heldBtn').addEventListener('click', () => { flushOutbox(); });
window.addEventListener('online', () => { flushOutbox(); });

renderOutbox();

if (mcpAccessKey) { loadAll(); flushOutbox(); }

else showUnlock();

// ---------- installable app ----------
// Only registers over http(s): opened as a file:// the API is unavailable and
// registration would throw.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* not fatal */ });
  });
}
