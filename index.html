<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Brain — Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #16140F;
    --panel: #1E1A12;
    --panel-raised: #262019;
    --ruled: rgba(232,223,200,0.07);
    --hairline: rgba(232,223,200,0.13);
    --ink: #E9DFC7;
    --ink-dim: #A79A7D;
    --ink-faint: #766B54;
    --brass: #C9A227;
    --moss: #7C9A6E;
    --rust: #B15B45;
    --blue: #6C93A8;
    --plum: #9A79A0;
    --unfiled: #766B54;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(201,162,39,0.05), transparent 45%),
      radial-gradient(ellipse at 100% 110%, rgba(124,154,110,0.04), transparent 40%);
  }

  /* subtle paper grain */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    z-index: 50;
    mix-blend-mode: overlay;
  }

  button { font-family: inherit; }

  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: 100vh;
  }

  .app.ref-open { grid-template-columns: 380px 1fr 320px; }

  /* ---------- DRAWER (left column) ---------- */
  .drawer {
    background: var(--panel);
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .drawer-header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--hairline);
  }

  .drawer-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .drawer-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .drawer-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-dim);
    width: 30px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 120ms, color 120ms, transform 400ms;
    flex-shrink: 0;
  }
  .refresh-btn:hover { border-color: var(--brass); color: var(--brass); }
  .refresh-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .refresh-btn.spinning svg { animation: spin 700ms linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search-row {
    margin-top: 14px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 9px 32px 9px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 120ms;
  }
  .search-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .search-input:focus { border-color: var(--brass); }

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
  }
  .search-clear:hover { color: var(--brass); }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .chip {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color 120ms, color 120ms, background 120ms;
  }
  .chip:hover { border-color: var(--ink-dim); }
  .chip.active { color: var(--paper); border-color: transparent; }
  .chip:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .chip-group-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 12px;
  }

  .topic-chip-row {
    max-height: 96px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .topic-chip-row::-webkit-scrollbar { width: 6px; }
  .topic-chip-row::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

  .chip-count {
    opacity: 0.65;
    margin-left: 1px;
  }
  .chip-caret {
    margin-left: 3px;
    font-size: 8px;
    opacity: 0.8;
  }

  .chip-subrow {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 1px 0 3px 10px;
    padding-left: 9px;
    border-left: 2px solid var(--hairline);
  }
  .chip-sub {
    font-size: 9.5px;
    padding: 3px 8px;
    opacity: 0.9;
  }

  .list-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0 20px;
  }

  .list-scroll::-webkit-scrollbar { width: 8px; }
  .list-scroll::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

  .card-row {
    display: flex;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--ruled);
    cursor: pointer;
    padding: 0;
    color: inherit;
  }

  .card-row-tab {
    width: 5px;
    flex-shrink: 0;
    background: var(--unfiled);
  }

  .card-row-body {
    flex: 1;
    padding: 13px 18px 13px 15px;
    min-width: 0;
    transition: background 120ms, transform 120ms;
  }

  .card-row:hover .card-row-body { background: rgba(232,223,200,0.03); transform: translateX(2px); }
  .card-row:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
  .card-row.selected .card-row-body { background: rgba(201,162,39,0.08); }
  .card-row.referencing .card-row-body { background: rgba(108,147,168,0.1); }

  .card-row-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }

  .card-row-type {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .card-row-date {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .card-row-preview {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-dim);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-row.selected .card-row-preview { color: var(--ink); }

  .list-status {
    padding: 30px 22px;
    color: var(--ink-faint);
    font-size: 13px;
    font-style: italic;
    line-height: 1.6;
  }

  .list-status .retry {
    display: inline-block;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-style: normal;
    text-decoration: underline;
    color: var(--brass);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  /* ---------- MAIN (right column) ---------- */
  .main {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 40px;
    overflow-y: auto;
    min-height: 0;
  }

  .empty-state {
    max-width: 380px;
    margin-top: 12vh;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty-state .glyph {
    font-family: var(--font-display);
    font-size: 34px;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }
  .empty-state p {
    font-size: 14px;
    font-style: italic;
    line-height: 1.6;
  }

  .index-card {
    width: 100%;
    max-width: 620px;
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    box-shadow: 0 22px 50px -20px rgba(0,0,0,0.6);
    transform: rotate(-0.35deg);
    animation: settle 220ms ease-out;
    overflow: hidden;
  }

  @keyframes settle {
    from { opacity: 0; transform: rotate(-0.35deg) translateY(8px); }
    to   { opacity: 1; transform: rotate(-0.35deg) translateY(0); }
  }

  .index-card-ribbon {
    height: 7px;
  }

  .index-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px 0;
  }

  .index-card-type {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 0;
  }

  .index-card-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .index-card-body {
    padding: 18px 28px 26px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      var(--ruled) 28px
    );
  }

  .index-card-body p {
    font-size: 17px;
    line-height: 28px;
    margin: 0;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .body-link {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(108,147,168,0.4);
  }
  .body-link:hover { border-bottom-color: var(--blue); }

  .index-card-foot {
    border-top: 1px solid var(--hairline);
    padding: 14px 28px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .tag.person::before { content: "@ "; color: var(--ink-faint); }
  .tag.topic::before { content: "# "; color: var(--ink-faint); }
  .tag.author::before { content: "by "; color: var(--ink-faint); }
  .tag.source::before { content: "via "; color: var(--ink-faint); }

  .back-btn {
    display: none;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 18px;
    padding: 4px 0;
  }

  /* ---------- card actions (edit/delete) ---------- */
  .index-card-head-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-faint);
    width: 26px;
    height: 26px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 120ms, color 120ms;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--rust); color: var(--rust); }
  .icon-btn#editBtn:hover { border-color: var(--brass); color: var(--brass); }
  .icon-btn:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:hover { border-color: var(--hairline); color: var(--ink-faint); }

  .index-card-confirm {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    background: rgba(177,91,69,0.09);
    border-top: 1px solid var(--hairline);
    flex-wrap: wrap;
  }

  .confirm-text {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-right: auto;
  }

  .confirm-cancel, .confirm-delete {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 120ms, color 120ms, background 120ms, opacity 120ms;
  }
  .confirm-cancel {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-dim);
  }
  .confirm-cancel:hover { border-color: var(--ink-dim); color: var(--ink); }

  .confirm-delete {
    background: var(--rust);
    border: 1px solid var(--rust);
    color: var(--ink);
    font-weight: 500;
  }
  .confirm-delete:hover { opacity: 0.88; }
  .confirm-delete:disabled, .confirm-cancel:disabled { opacity: 0.5; cursor: default; }

  /* ---------- compose (new thought) ---------- */
  .compose-textarea {
    width: 100%;
    min-height: 180px;
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 28px;
    color: var(--ink);
    padding: 0;
  }
  .compose-textarea::placeholder { color: var(--ink-faint); font-style: italic; }

  .compose-actions {
    justify-content: flex-end;
  }

  .compose-status {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin-right: auto;
  }

  .compose-cancel, .compose-save {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 120ms, color 120ms, background 120ms, opacity 120ms;
  }
  .compose-cancel {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-dim);
  }
  .compose-cancel:hover { border-color: var(--ink-dim); color: var(--ink); }

  .compose-save {
    background: var(--brass);
    border: 1px solid var(--brass);
    color: var(--paper);
    font-weight: 500;
  }
  .compose-save:hover { opacity: 0.88; }
  .compose-save:disabled, .compose-cancel:disabled { opacity: 0.5; cursor: default; }

  /* ---------- field list (Title/Author/Published/Source/Tags/URL) ---------- */
  .field-list {
    padding: 16px 28px 6px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .field-row {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 13px;
    line-height: 1.5;
  }
  .field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    width: 74px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .field-value {
    color: var(--ink-dim);
    word-break: break-word;
  }
  .field-value.empty { opacity: 0.5; font-style: italic; }
  .field-value a { color: var(--blue); text-decoration: none; }
  .field-value a:hover { text-decoration: underline; }
  .field-tag-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    font: inherit;
    font-size: 13px;
    padding: 0;
    cursor: pointer;
    text-decoration: none;
  }
  .field-tag-btn:hover { color: var(--brass); text-decoration: underline; }
  .field-tags { display: flex; flex-wrap: wrap; gap: 4px 10px; }

  /* ---------- edit mode ---------- */
  .edit-field-list {
    padding: 16px 28px 4px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .edit-field-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .edit-field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    width: 74px;
    flex-shrink: 0;
  }
  .edit-field-input {
    flex: 1;
    min-width: 0;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    outline: none;
  }
  .edit-field-input:focus { border-color: var(--brass); }
  .edit-body-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 7px;
  }
  .edit-body-textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 320px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    outline: none;
    resize: vertical;
    overflow: hidden;
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 26px;
    color: var(--ink);
    padding: 12px 14px;
  }
  .edit-body-textarea:focus { border-color: var(--brass); }

  /* ---------- links / linked notes ---------- */
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 14px 28px 6px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .tag-row {
    padding: 2px 28px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .link-list, .linked-note-list {
    padding: 0 28px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .link-item, .linked-note-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
  }
  .link-open {
    color: var(--blue);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .link-open:hover { text-decoration: underline; }
  .linked-note-open {
    background: none;
    border: none;
    color: var(--ink-dim);
    text-align: left;
    cursor: pointer;
    font: inherit;
    font-size: 12.5px;
    padding: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .linked-note-open:hover { color: var(--brass); }
  .link-create-btn, .link-add-toggle {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .link-create-btn:hover, .link-add-toggle:hover { border-color: var(--brass); color: var(--brass); }
  .linked-note-unlink {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .linked-note-unlink:hover { color: var(--rust); }

  .link-picker {
    padding: 8px 28px 16px;
  }
  .link-picker-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 12.5px;
    padding: 7px 10px;
    border-radius: 4px;
    outline: none;
    margin-bottom: 6px;
  }
  .link-picker-input:focus { border-color: var(--brass); }
  .link-picker-results { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .link-picker-item {
    background: none;
    border: none;
    text-align: left;
    color: var(--ink-dim);
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }
  .link-picker-item:hover { background: rgba(232,223,200,0.05); color: var(--ink); }

  /* ---------- reference panel ---------- */
  .ref-panel {
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    display: none;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
  }
  .app.ref-open .ref-panel { display: flex; }
  .ref-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  .ref-panel-label {
    font-family: var(--font-mono);

<script>
// Talks directly to your Open Brain MCP server (Supabase edge function) — no
// AI middleman needed just to list or search notes. Auth is the MCP Access
// Key from your credential tracker, sent as the x-brain-key header, the same
// way the Claude Code CLI / mcp-remote connections use it.
const MCP_URL = "https://uftlxeahciewiitclkbu.supabase.co/functions/v1/open-brain-mcp";
const MCP_ACCESS_KEY = "0e5f61a4dba2ea08005bb8f859cbacdae7569e8ea805f7071ac078ee9f7e6193";

const TYPE_STYLES = {
  observation:  { color: 'var(--moss)', label: 'Observation' },
  idea:         { color: 'var(--brass)', label: 'Idea' },
  task:         { color: 'var(--rust)',  label: 'Task' },
  reference:    { color: 'var(--blue)',  label: 'Reference' },
  person_note:  { color: 'var(--plum)',  label: 'Person note' },
};
const UNFILED = { color: 'var(--unfiled)', label: 'Unfiled' };

function typeStyle(t) {
  if (t && TYPE_STYLES[t]) return TYPE_STYLES[t];
  return UNFILED;
}

let allThoughts = [];   // full list, from last successful list fetch
let displayed = [];     // currently shown (after search/filter)
let activeTypes = new Set();
let activeTopics = new Set(); // normalized (lowercased) topic strings
let activeAuthors = new Set(); // normalized (lowercased) author strings
let activeSources = new Set(); // normalized (lowercased) source strings
let expandedTopicGroups = new Set(); // lowercased first-word group keys currently expanded
let selectedIndex = null;
let editingId = null;    // id of the thought currently open in the edit form, or null
let referenceId = null;  // id of the thought shown read-only in the reference panel, or null
let searchMode = false;
let lastSearchQuery = '';

const listScroll = document.getElementById('listScroll');
const chipRow = document.getElementById('chipRow');
const topicRow = document.getElementById('topicRow');
const topicRowLabel = document.getElementById('topicRowLabel');
const authorRow = document.getElementById('authorRow');
const authorRowLabel = document.getElementById('authorRowLabel');
const sourceRow = document.getElementById('sourceRow');
const sourceRowLabel = document.getElementById('sourceRowLabel');
const main = document.getElementById('main');
const app = document.getElementById('app');
const refPanel = document.getElementById('refPanel');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const refreshBtn = document.getElementById('refreshBtn');
const newBtn = document.getElementById('newBtn');

function formatDate(iso) {
  if (!iso) return 'Undated';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'Undated';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// For interpolating into a double-quoted HTML attribute (value="...",
// data-x="..."). escapeHtml alone isn't safe here — text-node serialization
// doesn't escape quote characters, so an unescaped " in e.g. a title would
// break out of the attribute. getAttribute()/reading .value later decodes
// these entities back to the original string automatically.
function escapeAttr(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Renders note content for display: HTML-escaped first (so nothing in a note
// can inject markup), then markdown links [text](url) and bare http(s) URLs
// are turned into real anchors. The raw markdown is left untouched in the
// stored content and in the edit textarea — this is display-only.
const MD_LINK_RE = /\[([^\]\n]{1,200})\]\((https?:\/\/[^\s<>"')]+)\)/g;
const BARE_URL_RE = /(^|[\s(])(https?:\/\/[^\s<>"')]+)/g;

function linkAnchor(url, label) {
  // url/label are already HTML-escaped by escapeHtml, so they must not be
  // escaped again (that would turn &amp; into &amp;amp;). The URL character
  // class excludes " < > so it is safe inside a double-quoted attribute.
  const trail = url.match(/[.,;:!?]+$/);
  let href = url, tail = '';
  if (trail && label === url) { href = url.slice(0, -trail[0].length); tail = trail[0]; }
  return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="body-link">'
    + (label === url ? href : label) + '</a>' + tail;
}

function renderBodyHtml(content) {
  let html = escapeHtml(content);
  html = html.replace(MD_LINK_RE, (_m, text, url) => linkAnchor(url, text));
  html = html.replace(BARE_URL_RE, (_m, pre, url) => pre + linkAnchor(url, url));
  return html;
}

/* ---------- MCP JSON-RPC client ---------- */

let mcpSessionId = null; // the server strips this from responses, but kept in case that changes
let rpcCounter = 0;

async function mcpRequest(method, params) {
  const body = { jsonrpc: '2.0', id: ++rpcCounter, method };
  if (params !== undefined) body.params = params;

  const headers = {
    'Content-Type': 'application/json',
    'Accept': 'application/json, text/event-stream',
    'x-brain-key': MCP_ACCESS_KEY,
  };
  if (mcpSessionId) headers['Mcp-Session-Id'] = mcpSessionId;

  let response;
  try {
    response = await fetch(MCP_URL, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (err) {
    throw new Error('Could not reach the archive server. This is usually a network problem, or the server may not be allowing direct browser requests (CORS). (' + err.message + ')');
  }

  const sid = response.headers.get('Mcp-Session-Id');
  if (sid) mcpSessionId = sid;

  if (!response.ok) {
    let detail = '';
    try { detail = (await response.text()).slice(0, 200); } catch (_) {}
    let hint = '';
    if (response.status === 401 || response.status === 403) hint = ' — check that the access key embedded in this page is still valid';
    throw new Error('Archive returned HTTP ' + response.status + hint + (detail ? (': ' + detail) : ''));
  }

  const contentType = response.headers.get('Content-Type') || '';
  let payload;
  if (contentType.includes('text/event-stream')) {
    const raw = await response.text();
    const dataLines = raw.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim());
    const lastJson = [...dataLines].reverse().find(l => l.startsWith('{'));
    if (!lastJson) throw new Error('The archive sent a streamed response with no data.');
    payload = JSON.parse(lastJson);
  } else {
    const raw = await response.text();
    payload = raw.trim() ? JSON.parse(raw) : {};
  }

  if (payload.error) throw new Error(payload.error.message || 'The archive reported an error.');
  return payload.result;
}

// Your server rebuilds a fresh MCP server + transport on every single HTTP
// call (sessionIdGenerator: undefined — true stateless mode, per the source
// you shared), so there's no persisted session to negotiate and no need to
// send "initialize" before a tool call — each request is self-contained.
async function callTool(name, args) {
  const result = await mcpRequest('tools/call', { name, arguments: args || {} });
  const block = ((result && result.content) || []).find(b => b.type === 'text');
  if (!block) throw new Error('The archive returned no readable content for "' + name + '".');
  return block.text;
}

/* ---------- Normalizing the tool's JSON output into cards ----------
   list_thoughts / search_thoughts are called with format:"json" so the
   server returns a real array of {id, content, created_at, metadata}
   objects instead of the plain-text format meant for other AI clients —
   no more regex-parsing prose, and ids are always the real database id. */

function normalizeType(raw) {
  if (!raw) return null;
  const t = String(raw).trim().toLowerCase();
  if (!t || t === '??' || t === 'unknown' || t === 'none' || t === 'null') return null;
  return Object.prototype.hasOwnProperty.call(TYPE_STYLES, t) ? t : null;
}

function normalizeThought(raw) {
  const m = raw.metadata || {};
  return {
    id: raw.id,
    realId: raw.id,
    content: raw.content || '',
    created_at: raw.created_at || null,
    type: normalizeType(m.type),
    topics: Array.isArray(m.topics) ? m.topics : [],
    people: Array.isArray(m.people) ? m.people : [],
    author: m.author || null,
    source: m.source_name || null,
    source_url: m.source_url || null,
    title: m.title || null,
    published_date: m.published_date || null,
    extracted_links: Array.isArray(m.extracted_links) ? m.extracted_links : [],
    linked_thought_ids: Array.isArray(m.linked_thought_ids) ? m.linked_thought_ids : [],
  };
}

function parseJsonThoughts(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (_) { raw = []; }
  if (!Array.isArray(raw)) raw = [];
  return raw.map(normalizeThought);
}

function findThought(id) {
  return allThoughts.find(t => t.id === id) || null;
}

function renderChips() {
  const typesPresent = new Set(allThoughts.map(t => t.type || '__unfiled__'));
  chipRow.innerHTML = '';
  if (typesPresent.size <= 1) return;
  typesPresent.forEach(t => {
    const key = t === '__unfiled__' ? null : t;
    const style = typeStyle(key);
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeTypes.has(t) ? ' active' : '');
    if (activeTypes.has(t)) chip.style.background = style.color;
    chip.innerHTML = '<span class="dot" style="background:' + style.color + '"></span>' + style.label;
    chip.addEventListener('click', () => {
      if (activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
      applyFilters();
    });
    chipRow.appendChild(chip);
  });
}

// Topic chips are built from the full loaded list (allThoughts), same as
// the type chips above — matching each other keeps the two filter rows
// self-consistent, and lets you browse by topic regardless of whether a
// search is currently active. Topics are grouped case-insensitively (the
// AI extractor isn't always consistent about casing) but displayed using
// the first-seen casing.
function makeTopicChip(norm, label, isSub) {
  const chip = document.createElement('button');
  chip.className = 'chip' + (isSub ? ' chip-sub' : '') + (activeTopics.has(norm) ? ' active' : '');
  if (activeTopics.has(norm)) chip.style.background = 'var(--brass)';
  chip.innerHTML = '<span class="dot" style="background:var(--brass)"></span># ' + escapeHtml(label);
  chip.addEventListener('click', () => {
    if (activeTopics.has(norm)) activeTopics.delete(norm); else activeTopics.add(norm);
    applyFilters();
  });
  return chip;
}

// Topics that share a first word (e.g. "AI", "AI Agents", "AI Careers") get
// collapsed under one parent chip so a busy tag vocabulary doesn't overwhelm
// the drawer — click the parent to expand/collapse its members, click a
// member to filter by it same as any other topic chip. Topics with no
// sibling sharing that first word render as ordinary flat chips.
function renderTopicChips() {
  const topicMap = new Map(); // normalized -> display label
  allThoughts.forEach(t => {
    (t.topics || []).forEach(top => {
      const norm = top.trim().toLowerCase();
      if (norm && !topicMap.has(norm)) topicMap.set(norm, top.trim());
    });
  });

  topicRow.innerHTML = '';
  if (topicMap.size === 0) {
    topicRowLabel.style.display = 'none';
    return;
  }
  topicRowLabel.style.display = 'block';

  const groups = new Map(); // lowercased first word -> [{norm, label}]
  topicMap.forEach((label, norm) => {
    const firstWord = label.split(/\s+/)[0].toLowerCase();
    if (!groups.has(firstWord)) groups.set(firstWord, []);
    groups.get(firstWord).push({ norm, label });
  });

  const entries = Array.from(groups.entries()).sort((a, b) => a[0].localeCompare(b[0]));

  entries.forEach(([groupKey, members]) => {
    if (members.length === 1) {
      const { norm, label } = members[0];
      topicRow.appendChild(makeTopicChip(norm, label));
      return;
    }

    members.sort((a, b) => a.label.localeCompare(b.label));
    const isExpanded = expandedTopicGroups.has(groupKey);
    const anyActive = members.some(m => activeTopics.has(m.norm));
    const displayLabel = members[0].label.split(/\s+/)[0];

    const parent = document.createElement('button');
    parent.className = 'chip chip-group' + (anyActive ? ' active' : '');
    if (anyActive) parent.style.background = 'var(--brass)';
    parent.innerHTML = '<span class="dot" style="background:var(--brass)"></span># '
      + escapeHtml(displayLabel)
      + '<span class="chip-count">(' + members.length + ')</span>'
      + '<span class="chip-caret">' + (isExpanded ? '▾' : '▸') + '</span>';
    parent.title = isExpanded ? 'Collapse' : 'Show ' + members.length + ' ' + displayLabel + ' subtopics';
    parent.addEventListener('click', () => {
      if (expandedTopicGroups.has(groupKey)) expandedTopicGroups.delete(groupKey);
      else expandedTopicGroups.add(groupKey);
      renderTopicChips();
    });
    topicRow.appendChild(parent);

    if (isExpanded) {
      const subRow = document.createElement('div');
      subRow.className = 'chip-subrow';
      members.forEach(({ norm, label }) => subRow.appendChild(makeTopicChip(norm, label, true)));
      topicRow.appendChild(subRow);
    }
  });
}

// Author/Source chips work like Topics (built from allThoughts, hidden when
// there's nothing but a single value) but each thought has at most one of
// each rather than an array, so the map-building and filter predicate are a
// little simpler than the topic version.
function renderSingleValueChips(row, rowLabel, field, accentColor, activeSet) {
  const map = new Map(); // normalized -> display label
  allThoughts.forEach(t => {
    const raw = t[field];
    if (raw) {
      const norm = raw.trim().toLowerCase();
      if (norm && !map.has(norm)) map.set(norm, raw.trim());
    }
  });

  row.innerHTML = '';
  if (map.size === 0) {
    rowLabel.style.display = 'none';
    return;
  }
  rowLabel.style.display = 'block';

  const sorted = Array.from(map.entries()).sort((a, b) => a[1].localeCompare(b[1]));
  sorted.forEach(([norm, label]) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeSet.has(norm) ? ' active' : '');
    if (activeSet.has(norm)) chip.style.background = accentColor;
    chip.innerHTML = '<span class="dot" style="background:' + accentColor + '"></span>' + escapeHtml(label);
    chip.addEventListener('click', () => {
      if (activeSet.has(norm)) activeSet.delete(norm); else activeSet.add(norm);
      applyFilters();
    });
    row.appendChild(chip);
  });
}

function renderAuthorChips() {
  renderSingleValueChips(authorRow, authorRowLabel, 'author', 'var(--plum)', activeAuthors);
}

function renderSourceChips() {
  renderSingleValueChips(sourceRow, sourceRowLabel, 'source', 'var(--blue)', activeSources);
}

function applyFilters() {
  const base = searchMode ? displayed.baseResults : allThoughts;
  let filtered = base;
  if (activeTypes.size > 0) {
    filtered = filtered.filter(t => activeTypes.has(t.type || '__unfiled__'));
  }
  if (activeTopics.size > 0) {
    filtered = filtered.filter(t =>
      (t.topics || []).some(top => activeTopics.has(top.trim().toLowerCase()))
    );
  }
  if (activeAuthors.size > 0) {
    filtered = filtered.filter(t => t.author && activeAuthors.has(t.author.trim().toLowerCase()));
  }
  if (activeSources.size > 0) {
    filtered = filtered.filter(t => t.source && activeSources.has(t.source.trim().toLowerCase()));
  }
  renderChips();
  renderTopicChips();
  renderAuthorChips();
  renderSourceChips();
  renderList(filtered, searchMode);
}

function renderList(items, isSearch) {
  displayed = items;
  displayed.baseResults = isSearch ? displayed.baseResults : items;
  listScroll.innerHTML = '';

  if (items.length === 0) {
    const status = document.createElement('div');
    status.className = 'list-status';
    status.textContent = isSearch
      ? 'No cards match that search.'
      : 'The drawer is empty. Capture a thought to file one here.';
    listScroll.appendChild(status);
    return;
  }

  items.forEach((t) => {
    const style = typeStyle(t.type);
    const row = document.createElement('button');
    row.className = 'card-row'
      + (selectedIndex === t.id ? ' selected' : '')
      + (referenceId === t.id ? ' referencing' : '');
    row.innerHTML = `
      <div class="card-row-tab" style="background:${style.color}"></div>
      <div class="card-row-body">
        <div class="card-row-meta">
          <span class="card-row-type" style="color:${style.color}">${style.label}</span>
          <span class="card-row-date">${formatDate(t.created_at)}</span>
        </div>
        <div class="card-row-preview">${escapeHtml(t.title || t.content)}</div>
      </div>
    `;
    row.addEventListener('click', () => {
      if (editingId && t.id !== editingId) {
        openReference(t);
      } else if (!editingId) {
        selectThought(t);
      }
    });
    listScroll.appendChild(row);
  });
}

// Shared by both the author and source field-value clicks in the detail
// view — exits any active search and narrows the drawer to just that value.
function filterToSingleValue(setRef, value) {
  searchMode = false;
  lastSearchQuery = '';
  searchInput.value = '';
  searchClear.style.display = 'none';
  setRef.clear();
  setRef.add(value.trim().toLowerCase());
  showEmptyState();
  applyFilters();
}

function renderLinksSection(t) {
  const items = t.extracted_links.map(l => {
    const label = l.text && l.text !== l.url ? l.text : l.url;
    return `
      <div class="link-item">
        <a class="link-open" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>
        <button class="link-create-btn" data-url="${escapeAttr(l.url)}" data-text="${escapeAttr(l.text || '')}" type="button">+ Create linked note</button>
      </div>
    `;
  }).join('');
  return `<div class="section-label"><span>Links found in this note</span></div><div class="link-list">${items}</div>`;
}

function renderLinkedNotesSection(t) {
  const items = t.linked_thought_ids.map(id => {
    const found = findThought(id);
    const label = found
      ? (found.title || found.content.replace(/\s+/g, ' ').trim().slice(0, 60))
      : ('Note ' + id.slice(0, 8) + '…');
    return `
      <div class="linked-note-item">
        <button class="linked-note-open" data-id="${escapeAttr(id)}" type="button">${escapeHtml(label)}</button>
        <button class="linked-note-unlink" data-id="${escapeAttr(id)}" title="Remove link" type="button">×</button>
      </div>
    `;
  }).join('');
  return `
    <div class="section-label">
      <span>Linked notes</span>
      <button class="link-add-toggle" id="linkAddToggle" type="button">+ Link to another note</button>
    </div>
    <div class="linked-note-list">${items || '<span class="field-value empty">No linked notes yet.</span>'}</div>
    <div class="link-picker" id="linkPicker" style="display:none">
      <input class="link-picker-input" id="linkPickerInput" type="text" placeholder="Search notes to link…" />
      <div class="link-picker-results" id="linkPickerResults"></div>
    </div>
  `;
}

function setupLinkPicker(t) {
  const toggle = document.getElementById('linkAddToggle');
  const picker = document.getElementById('linkPicker');
  const input = document.getElementById('linkPickerInput');
  const results = document.getElementById('linkPickerResults');
  if (!toggle) return;

  function renderResults(query) {
    const q = query.trim().toLowerCase();
    const linked = new Set(t.linked_thought_ids);
    const candidates = allThoughts.filter(o => o.id !== t.id && !linked.has(o.id));
    const matches = (q
      ? candidates.filter(o => (o.title || '').toLowerCase().includes(q) || o.content.toLowerCase().includes(q))
      : candidates
    ).slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map(o => `<button class="link-picker-item" data-id="${escapeAttr(o.id)}" type="button">${escapeHtml(o.title || o.content.replace(/\s+/g, ' ').trim().slice(0, 70))}</button>`).join('')
      : '<span class="field-value empty" style="padding:6px 8px;display:block;">No matches.</span>';
    results.querySelectorAll('.link-picker-item').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await callTool('link_thoughts', { id_a: t.id, id_b: btn.getAttribute('data-id') });
          await refreshAndReselect(t.id);
        } catch (err) {
          btn.disabled = false;
          results.insertAdjacentHTML('afterbegin', `<span class="field-value" style="color:var(--rust);display:block;padding:4px 8px;">Could not link — ${escapeHtml(err.message)}</span>`);
        }
      });
    });
  }

  toggle.addEventListener('click', () => {
    const showing = picker.style.display !== 'none';
    picker.style.display = showing ? 'none' : 'block';
    if (!showing) { input.value = ''; renderResults(''); input.focus(); }
  });
  input.addEventListener('input', () => renderResults(input.value));
}

async function refreshAndReselect(id) {
  await loadAll();
  const found = findThought(id);
  if (found) selectThought(found); else showEmptyState();
}

function closeReference() {
  referenceId = null;
  refPanel.innerHTML = '';
  app.classList.remove('ref-open');
}

function openReference(t) {
  referenceId = t.id;
  renderList(displayed, searchMode);
  refPanel.innerHTML = `
    <div class="ref-panel-header">
      <span class="ref-panel-label">Reference</span>
      <button class="ref-panel-close" id="refClose" aria-label="Close reference panel" type="button">×</button>
    </div>
    <div class="ref-panel-body">
      <h3 class="ref-panel-title">${escapeHtml(t.title || t.content.replace(/\s+/g, ' ').trim().slice(0, 60))}</h3>
      <div class="ref-panel-fields">
        <div class="field-row"><span class="field-label">Author</span><span class="field-value">${t.author ? escapeHtml(t.author) : '<span class="field-value empty">—</span>'}</span></div>
        <div class="field-row"><span class="field-label">Published</span><span class="field-value">${t.published_date ? escapeHtml(formatDate(t.published_date)) : '<span class="field-value empty">—</span>'}</span></div>
        <div class="field-row"><span class="field-label">Source</span><span class="field-value">${t.source ? escapeHtml(t.source) : '<span class="field-value empty">—</span>'}</span></div>
      </div>
      <div class="ref-panel-content">${renderBodyHtml(t.content)}</div>
      <button class="ref-panel-open-full" id="refOpenFull" type="button">Open this note (discards current edit)</button>
    </div>
  `;
  app.classList.add('ref-open');
  document.getElementById('refClose').addEventListener('click', closeReference);
  document.getElementById('refOpenFull').addEventListener('click', () => {
    editingId = null;
    closeReference();
    selectThought(t);
  });
}

function selectThought(t) {
  selectedIndex = t.id;
  editingId = null;
  closeReference();
  renderList(displayed, searchMode);
  const style = typeStyle(t.type);

  const titleHtml = t.title ? escapeHtml(t.title) : '<span class="field-value empty">—</span>';
  const authorHtml = t.author
    ? `<button class="field-tag-btn" data-author="${escapeAttr(t.author)}" type="button">${escapeHtml(t.author)}</button>`
    : '<span class="field-value empty">—</span>';
  const publishedHtml = t.published_date
    ? escapeHtml(formatDate(t.published_date))
    : '<span class="field-value empty">—</span>';
  const sourceHtml = t.source
    ? `<button class="field-tag-btn" data-source="${escapeAttr(t.source)}" type="button">${escapeHtml(t.source)}</button>`
    : '<span class="field-value empty">—</span>';
  const tagsHtml = t.topics.length
    ? '<div class="field-tags">' + t.topics.map(tag => `<button class="field-tag-btn" data-topic="${escapeAttr(tag)}" type="button">#${escapeHtml(tag)}</button>`).join('') + '</div>'
    : '<span class="field-value empty">—</span>';
  const urlHtml = t.source_url
    ? `<a href="${escapeAttr(t.source_url)}" target="_blank" rel="noopener">${escapeHtml(t.source_url)}</a>`
    : '<span class="field-value empty">—</span>';

  const peopleHtml = t.people.length
    ? `<div class="section-label"><span>People mentioned</span></div><div class="tag-row">${t.people.map(p => `<span class="tag person">${escapeHtml(p)}</span>`).join('')}</div>`
    : '';
  const linksHtml = t.extracted_links.length ? renderLinksSection(t) : '';
  const linkedNotesHtml = renderLinkedNotesSection(t);

  main.innerHTML = `
    <div class="index-card">
      <div class="index-card-ribbon" style="background:${style.color}"></div>
      <div class="index-card-head">
        <span class="index-card-type" style="color:${style.color}">${style.label}</span>
        <div class="index-card-head-right">
          <span class="index-card-date" title="Date captured">${formatDate(t.created_at)}</span>
          <button class="icon-btn" id="editBtn" title="Edit thought" aria-label="Edit thought">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          </button>
          <button class="icon-btn" id="deleteBtn" title="Delete thought" aria-label="Delete thought">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
          </button>
        </div>
      </div>
      <div class="field-list">
        <div class="field-row"><span class="field-label">Title</span><span class="field-value">${titleHtml}</span></div>
        <div class="field-row"><span class="field-label">Author</span><span class="field-value">${authorHtml}</span></div>
        <div class="field-row"><span class="field-label">Published</span><span class="field-value">${publishedHtml}</span></div>
        <div class="field-row"><span class="field-label">Source</span><span class="field-value">${sourceHtml}</span></div>
        <div class="field-row"><span class="field-label">Tags</span><span class="field-value">${tagsHtml}</span></div>
        <div class="field-row"><span class="field-label">URL</span><span class="field-value">${urlHtml}</span></div>
      </div>
      ${peopleHtml}
      ${linksHtml}
      ${linkedNotesHtml}
      <div class="index-card-body"><p>${renderBodyHtml(t.content)}</p></div>
      <div class="index-card-confirm" id="cardConfirm"></div>
    </div>
  `;

  const deleteBtn = document.getElementById('deleteBtn');
  const editBtn = document.getElementById('editBtn');
  const cardConfirm = document.getElementById('cardConfirm');
  const deletableId = t.realId;

  editBtn.addEventListener('click', () => startEdit(t));

  deleteBtn.addEventListener('click', () => {
    cardConfirm.style.display = 'flex';
    cardConfirm.innerHTML = `
      <span class="confirm-text">Delete this thought? This can't be undone.</span>
      <button class="confirm-cancel" type="button">Cancel</button>
      <button class="confirm-delete" type="button">Delete</button>
    `;
    const textEl = cardConfirm.querySelector('.confirm-text');
    const cancelBtn = cardConfirm.querySelector('.confirm-cancel');
    const confirmBtn = cardConfirm.querySelector('.confirm-delete');

    cancelBtn.addEventListener('click', () => {
      cardConfirm.style.display = 'none';
      cardConfirm.innerHTML = '';
    });

    confirmBtn.addEventListener('click', async () => {
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = 'Deleting…';
      try {
        await callTool('delete_thought', { id: deletableId });
        showEmptyState();
        await loadAll();
      } catch (err) {
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = 'Delete';
        textEl.textContent = 'Could not delete — ' + err.message;
      }
    });
  });

  main.querySelectorAll('[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      searchMode = false;
      lastSearchQuery = '';
      searchInput.value = '';
      searchClear.style.display = 'none';
      const tag = btn.getAttribute('data-topic');
      activeTopics = new Set([tag.trim().toLowerCase()]);
      // Auto-expand this tag's group (if any) so it's visible, not hidden
      // inside a collapsed parent chip, the moment the drawer re-renders.
      expandedTopicGroups.add(tag.trim().split(/\s+/)[0].toLowerCase());
      showEmptyState();
      applyFilters();
    });
  });
  const authorBtn = main.querySelector('[data-author]');
  if (authorBtn) authorBtn.addEventListener('click', () => filterToSingleValue(activeAuthors, authorBtn.getAttribute('data-author')));
  const sourceBtn = main.querySelector('[data-source]');
  if (sourceBtn) sourceBtn.addEventListener('click', () => filterToSingleValue(activeSources, sourceBtn.getAttribute('data-source')));

  main.querySelectorAll('.link-create-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.getAttribute('data-url');
      const text = btn.getAttribute('data-text');
      const prefill = text && text !== url ? `${text}\n${url}` : url;
      showComposer(prefill, t.id);
    });
  });

  main.querySelectorAll('.linked-note-open').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = findThought(btn.getAttribute('data-id'));
      if (found) selectThought(found);
    });
  });
  main.querySelectorAll('.linked-note-unlink').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await callTool('unlink_thoughts', { id_a: t.id, id_b: btn.getAttribute('data-id') });
        await refreshAndReselect(t.id);
      } catch (err) {
        btn.disabled = false;
        btn.title = 'Could not unlink — ' + err.message;
      }
    });
  });

  setupLinkPicker(t);

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back to drawer';
  back.addEventListener('click', () => app.classList.remove('detail-open'));
  main.prepend(back);

  app.classList.add('detail-open');
}

function startEdit(t) {
  editingId = t.id;
  closeReference();
  renderList(displayed, searchMode);
  const style = typeStyle(t.type);

  main.innerHTML = `
    <div class="index-card">
      <div class="index-card-ribbon" style="background:${style.color}"></div>
      <div class="index-card-head">
        <span class="index-card-type" style="color:${style.color}">${style.label} · editing</span>
        <div class="index-card-head-right">
          <span class="index-card-date">${formatDate(t.created_at)}</span>
        </div>
      </div>
      <div class="edit-field-list">
        <div class="edit-field-row"><span class="edit-field-label">Title</span><input class="edit-field-input" id="editTitle" type="text" value="${escapeAttr(t.title || '')}" /></div>
        <div class="edit-field-row"><span class="edit-field-label">Author</span><input class="edit-field-input" id="editAuthor" type="text" value="${escapeAttr(t.author || '')}" /></div>
        <div class="edit-field-row"><span class="edit-field-label">Published</span><input class="edit-field-input" id="editPublished" type="text" placeholder="YYYY-MM-DD" value="${escapeAttr(t.published_date || '')}" /></div>
        <div class="edit-field-row"><span class="edit-field-label">Source</span><input class="edit-field-input" id="editSource" type="text" value="${escapeAttr(t.source || '')}" /></div>
        <div class="edit-field-row"><span class="edit-field-label">Tags</span><input class="edit-field-input" id="editTags" type="text" placeholder="comma, separated, tags" value="${escapeAttr(t.topics.join(', '))}" /></div>
        <div class="edit-field-row"><span class="edit-field-label">URL</span><input class="edit-field-input" id="editUrl" type="text" value="${escapeAttr(t.source_url || '')}" /></div>
      </div>
      <div class="index-card-body">
        <label class="edit-body-label" for="editContent">Body</label>
        <textarea class="edit-body-textarea" id="editContent" spellcheck="true">${escapeHtml(t.content)}</textarea>
      </div>
      <div class="index-card-foot compose-actions">
        <span class="compose-status" id="editStatus"></span>
        <button class="compose-cancel" id="editCancel" type="button">Cancel</button>
        <button class="compose-save" id="editSave" type="button">Save changes</button>
      </div>
    </div>
  `;

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back to drawer';
  back.addEventListener('click', () => { editingId = null; app.classList.remove('detail-open'); });
  main.prepend(back);
  app.classList.add('detail-open');

  const cancelBtn = document.getElementById('editCancel');
  const saveBtn = document.getElementById('editSave');
  const statusEl = document.getElementById('editStatus');
  const bodyEl = document.getElementById('editContent');

  function autoGrow() {
    bodyEl.style.height = 'auto';
    bodyEl.style.height = (bodyEl.scrollHeight + 2) + 'px';
  }
  bodyEl.addEventListener('input', autoGrow);
  autoGrow();

  cancelBtn.addEventListener('click', () => { editingId = null; selectThought(t); });

  saveBtn.addEventListener('click', async () => {
    const newContent = document.getElementById('editContent').value.trim();
    if (!newContent) {
      statusEl.textContent = 'Content cannot be empty.';
      statusEl.style.color = 'var(--rust)';
      return;
    }
    const newTitle = document.getElementById('editTitle').value.trim();
    const newAuthor = document.getElementById('editAuthor').value.trim();
    const newPublished = document.getElementById('editPublished').value.trim();
    const newSource = document.getElementById('editSource').value.trim();
    const newTags = document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(Boolean);
    const newUrl = document.getElementById('editUrl').value.trim();

    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    statusEl.style.color = 'var(--ink-faint)';
    statusEl.textContent = 'Saving changes…';

    const args = {
      id: t.id,
      title: newTitle || null,
      author: newAuthor || null,
      published_date: newPublished || null,
      source_name: newSource || null,
      source_url: newUrl || null,
      topics: newTags,
    };
    if (newContent !== t.content) args.content = newContent;

    try {
      await callTool('update_thought', args);
      editingId = null;
      await refreshAndReselect(t.id);
    } catch (err) {
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      saveBtn.textContent = 'Save changes';
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Could not save — ' + err.message;
    }
  });
}

function showEmptyState() {
  selectedIndex = null;
  editingId = null;
  closeReference();
  renderList(displayed, searchMode);
  main.innerHTML = `
    <div class="empty-state">
      <div class="glyph">§</div>
      <p>Select a card from the drawer to read it.</p>
    </div>
  `;
  app.classList.remove('detail-open');
}

function showComposer(prefill, parentId) {
  selectedIndex = null;
  editingId = null;
  closeReference();
  renderList(displayed, searchMode);
  main.innerHTML = `
    <div class="index-card">
      <div class="index-card-ribbon" style="background:var(--brass)"></div>
      <div class="index-card-head">
        <span class="index-card-type" style="color:var(--brass)">New thought${parentId ? ' · linked' : ''}</span>
      </div>
      <div class="index-card-body">
        <textarea class="compose-textarea" id="composeText" placeholder="Write a clear, standalone thought — it'll be auto-tagged when saved…">${escapeHtml(prefill || '')}</textarea>
      </div>
      <div class="index-card-foot compose-actions">
        <span class="compose-status" id="composeStatus"></span>
        <button class="compose-cancel" id="composeCancel" type="button">Cancel</button>
        <button class="compose-save" id="composeSave" type="button">Save to archive</button>
      </div>
    </div>
  `;
  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back to drawer';
  back.addEventListener('click', () => app.classList.remove('detail-open'));
  main.prepend(back);
  app.classList.add('detail-open');

  const textEl = document.getElementById('composeText');
  const statusEl = document.getElementById('composeStatus');
  const saveBtn = document.getElementById('composeSave');
  const cancelBtn = document.getElementById('composeCancel');

  textEl.focus();
  if (prefill) textEl.setSelectionRange(0, 0);

  cancelBtn.addEventListener('click', showEmptyState);

  async function submit() {
    const content = textEl.value.trim();
    if (!content) {
      statusEl.textContent = 'Write something first.';
      statusEl.style.color = 'var(--rust)';
      return;
    }
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    statusEl.style.color = 'var(--ink-faint)';
    statusEl.textContent = parentId ? 'Sending to the archive and linking back…' : 'Sending to the archive…';
    try {
      const args = { content };
      if (parentId) args.parent_thought_id = parentId;
      await callTool('capture_thought', args);
      statusEl.style.color = 'var(--moss)';
      statusEl.textContent = 'Saved.';
      setTimeout(async () => {
        showEmptyState();
        if (parentId) { await loadAll(); const found = findThought(parentId); if (found) selectThought(found); }
        else { await loadAll(); }
      }, 500);
    } catch (err) {
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      saveBtn.textContent = 'Save to archive';
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Could not save — ' + err.message;
    }
  }

  saveBtn.addEventListener('click', submit);
  textEl.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
  });
}

newBtn.addEventListener('click', () => showComposer());

function showStatus(msg, isError, retryFn) {
  listScroll.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'list-status';
  el.style.color = isError ? 'var(--rust)' : 'var(--ink-faint)';
  el.textContent = msg;
  if (retryFn) {
    const btn = document.createElement('button');
    btn.className = 'retry';
    btn.textContent = 'Try again';
    btn.addEventListener('click', retryFn);
    el.appendChild(document.createElement('br'));
    el.appendChild(btn);
  }
  listScroll.appendChild(el);
}

async function loadAll() {
  searchMode = false;
  lastSearchQuery = '';
  searchInput.value = '';
  searchClear.style.display = 'none';
  showStatus('Opening the drawer…', false);
  try {
    const text = await callTool('list_thoughts', { limit: 100, format: 'json' });
    allThoughts = parseJsonThoughts(text);
    activeTypes = new Set();
    activeTopics = new Set();
    activeAuthors = new Set();
    activeSources = new Set();
    applyFilters();
  } catch (err) {
    showStatus('Could not reach the archive — ' + err.message, true, loadAll);
  }
}

async function runSearch(query) {
  if (!query.trim()) { loadAll(); return; }
  searchMode = true;
  lastSearchQuery = query;
  searchClear.style.display = 'block';
  showStatus('Searching the archive for "' + query + '"…', false);
  try {
    const text = await callTool('search_thoughts', { query, limit: 50, format: 'json' });
    const results = parseJsonThoughts(text);
    displayed.baseResults = results;
    activeTypes = new Set();
    activeTopics = new Set();
    activeAuthors = new Set();
    activeSources = new Set();
    applyFilters();
  } catch (err) {
    showStatus('Search failed — ' + err.message, true, () => runSearch(query));
  }
}

refreshBtn.addEventListener('click', () => {
  refreshBtn.classList.add('spinning');
  setTimeout(() => refreshBtn.classList.remove('spinning'), 700);
  searchMode ? runSearch(lastSearchQuery) : loadAll();
});

searchClear.addEventListener('click', () => { loadAll(); });

let searchTimer = null;
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(searchInput.value); }
});
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  if (searchInput.value.trim() === '') { searchClear.style.display = 'none'; return; }
  searchTimer = setTimeout(() => runSearch(searchInput.value), 650);
});

loadAll();
</script>

</body>
</html>
