<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Brain — Catalog</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#16140F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Open Brain" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #16140F;
    --panel: #1E1A12;
    --panel-raised: #262019;
    --ruled: rgba(232,223,200,0.07);
    --hairline: rgba(232,223,200,0.13);
    --ink: #E9DFC7;
    --ink-dim: #A79A7D;
    --ink-faint: #766B54;
    --brass: #C9A227;
    --moss: #7C9A6E;
    --rust: #B15B45;
    --blue: #6C93A8;
    --plum: #9A79A0;
    --unfiled: #766B54;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(201,162,39,0.05), transparent 45%),
      radial-gradient(ellipse at 100% 110%, rgba(124,154,110,0.04), transparent 40%);
  }

  /* subtle paper grain */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    z-index: 50;
    mix-blend-mode: overlay;
  }

  button { font-family: inherit; }

  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: 100vh;
  }

  .app.ref-open { grid-template-columns: 380px 1fr 320px; }

  /* ---------- DRAWER (left column) ---------- */
  .drawer {
    background: var(--panel);
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .drawer-header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--hairline);
  }

  .drawer-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .drawer-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .drawer-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-dim);
    width: 30px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 120ms, color 120ms, transform 400ms;
    flex-shrink: 0;
  }
  .refresh-btn:hover { border-color: var(--brass); color: var(--brass); }
  .refresh-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .refresh-btn.spinning svg { animation: spin 700ms linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* The held-notes pill. Sized like the icon buttons but wider, because a
     count is the whole point of it: "something of yours has not landed yet"
     is only reassuring if you can see how much. Hidden entirely at zero —
     an always-present "0 held" trains you to stop reading it. */
  .held-btn {
    background: none;
    border: 1px solid var(--brass);
    color: var(--brass);
    font-family: var(--font-mono);
    font-size: 11px;
    height: 30px;
    padding: 0 8px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color 120ms, color 120ms;
    flex-shrink: 0;
  }
  .held-btn[hidden] { display: none; }
  .held-btn:hover { border-color: var(--ink); color: var(--ink); }
  .held-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .held-btn.sending { opacity: 0.6; pointer-events: none; }
  /* A queue that stopped for a reason other than the network — a rejected key,
     a server that answered no — is not a waiting state, so it stops looking
     like one. */
  .held-btn.stuck { border-color: var(--rust); color: var(--rust); }

  .search-row {
    margin-top: 14px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 9px 32px 9px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 120ms;
  }
  .search-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .search-input:focus { border-color: var(--brass); }

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
  }
  .search-clear:hover { color: var(--brass); }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .chip {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color 120ms, color 120ms, background 120ms;
  }
  .chip:hover { border-color: var(--ink-dim); }
  .chip.active { color: var(--paper); border-color: transparent; }
  .chip:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .chip-group-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 12px;
  }

  .topic-chip-row {
    max-height: 96px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .topic-chip-row::-webkit-scrollbar { width: 6px; }
  .topic-chip-row::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

  .chip-count {
    opacity: 0.65;
    margin-left: 1px;
  }
  .chip-caret {
    margin-left: 3px;
    font-size: 8px;
    opacity: 0.8;
  }

  .chip-subrow {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 1px 0 3px 10px;
    padding-left: 9px;
    border-left: 2px solid var(--hairline);
  }
  .chip-sub {
    font-size: 9.5px;
    padding: 3px 8px;
    opacity: 0.9;
  }

  .list-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0 20px;
  }

  .list-scroll::-webkit-scrollbar { width: 8px; }
  .list-scroll::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

  .card-row {
    display: flex;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--ruled);
    cursor: pointer;
    padding: 0;
    color: inherit;
  }

  .card-row-tab {
    width: 5px;
    flex-shrink: 0;
    background: var(--unfiled);
  }

  .card-row-body {
    flex: 1;
    padding: 13px 18px 13px 15px;
    min-width: 0;
    transition: background 120ms, transform 120ms;
  }

  .card-row:hover .card-row-body { background: rgba(232,223,200,0.03); transform: translateX(2px); }
  .card-row:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
  .card-row.selected .card-row-body { background: rgba(201,162,39,0.08); }
  .card-row.referencing .card-row-body { background: rgba(108,147,168,0.1); }

  /* A note is often remembered by who is in it, and the AI-written title rarely
     names them — so the people ride along under the title. */
  .card-row-people {
    margin-top: 3px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--plum);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-row-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }

  .card-row-type {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .card-row-date {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .card-row-preview {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-dim);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    /* A title with a very long unbroken run — a URL, a slug — would otherwise
       widen the whole drawer rather than wrap. */
    overflow-wrap: anywhere;
  }
  .card-row.selected .card-row-preview { color: var(--ink); }

  .list-status {
    padding: 30px 22px;
    color: var(--ink-faint);
    font-size: 13px;
    font-style: italic;
    line-height: 1.6;
  }

  .list-status .retry {
    display: inline-block;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-style: normal;
    text-decoration: underline;
    color: var(--brass);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  /* ---------- MAIN (right column) ---------- */
  .main {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    /* Read by the sticky bars, which pull themselves up by this much so they
       pin to the very top of the reading area rather than leaving a strip of
       text sliding along above them. */
    --main-pad-top: 40px;
    padding: var(--main-pad-top) 28px;
    overflow-y: auto;
    min-height: 0;
  }

  .empty-state {
    max-width: 380px;
    margin-top: 12vh;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty-state .glyph {
    font-family: var(--font-display);
    font-size: 34px;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }
  .empty-state p {
    font-size: 14px;
    font-style: italic;
    line-height: 1.6;
  }

  .edit-actions {
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }
  .edit-actions-bottom { border-bottom: none; }

  .index-card {
    width: 100%;
    max-width: 1040px;
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    box-shadow: 0 22px 50px -20px rgba(0,0,0,0.6);
    transform: rotate(-0.35deg);
    animation: settle 220ms ease-out;
    /* clip, not hidden: hidden would make the card its own scroll container and
       the sticky bars inside it would stop sticking to the top of the page. */
    overflow: clip;
  }

  @keyframes settle {
    from { opacity: 0; transform: rotate(-0.35deg) translateY(8px); }
    to   { opacity: 1; transform: rotate(-0.35deg) translateY(0); }
  }

  .index-card-ribbon {
    height: 7px;
  }

  .index-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px 0;
  }

  .index-card-type {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 0;
  }

  .index-card-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }

  .index-card-body {
    padding: 18px 28px 26px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      var(--ruled) 28px
    );
  }

  .index-card-body p {
    font-size: 17px;
    line-height: 28px;
    margin: 0;
    color: var(--ink);
    white-space: pre-wrap;
    /* pre-wrap keeps the article's own line breaks, but leaves a long unbroken
       string — a captured URL — no place to break, so it runs past the edge and
       is simply lost. Let those wrap anywhere; ordinary prose is unaffected. */
    overflow-wrap: anywhere;
  }

  .body-link {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(108,147,168,0.4);
  }
  .body-link:hover { border-bottom-color: var(--blue); }

  /* In-brain link: [Text](thought:<id>) — opens another note in place. */
  .thought-link {
    color: var(--brass);
    text-decoration: none;
    border-bottom: 1px solid rgba(176,141,87,0.45);
    cursor: pointer;
  }
  .thought-link:hover { border-bottom-color: var(--brass); }
  .thought-link.missing {
    color: var(--ink-dim);
    border-bottom-style: dotted;
    cursor: default;
  }

  .index-card-foot {
    border-top: 1px solid var(--hairline);
    padding: 14px 28px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .tag.person::before { content: "@ "; color: var(--ink-faint); }
  .tag.topic::before { content: "# "; color: var(--ink-faint); }
  .tag.author::before { content: "by "; color: var(--ink-faint); }
  .tag.source::before { content: "via "; color: var(--ink-faint); }

  .back-btn {
    display: none;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 18px;
    padding: 4px 0;
  }

  /* ---------- card actions (edit/delete) ---------- */
  .index-card-head-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-faint);
    width: 26px;
    height: 26px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 120ms, color 120ms;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--rust); color: var(--rust); }
  .icon-btn#editBtn:hover { border-color: var(--brass); color: var(--brass); }
  .icon-btn:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:hover { border-color: var(--hairline); color: var(--ink-faint); }

  .index-card-confirm {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    background: rgba(177,91,69,0.09);
    border-top: 1px solid var(--hairline);
    flex-wrap: wrap;
  }

  .confirm-text {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-right: auto;
  }

  .confirm-cancel, .confirm-delete {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 120ms, color 120ms, background 120ms, opacity 120ms;
  }
  .confirm-cancel {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-dim);
  }
  .confirm-cancel:hover { border-color: var(--ink-dim); color: var(--ink); }

  .confirm-delete {
    background: var(--rust);
    border: 1px solid var(--rust);
    color: var(--ink);
    font-weight: 500;
  }
  .confirm-delete:hover { opacity: 0.88; }
  .confirm-delete:disabled, .confirm-cancel:disabled { opacity: 0.5; cursor: default; }

  /* ---------- compose (new thought) ---------- */
  .compose-textarea {
    width: 100%;
    min-height: 180px;
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 28px;
    color: var(--ink);
    padding: 0;
  }
  .compose-textarea::placeholder { color: var(--ink-faint); font-style: italic; }

  .compose-actions {
    justify-content: flex-end;
  }

  .compose-status {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin-right: auto;
  }

  .compose-cancel, .compose-save {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 120ms, color 120ms, background 120ms, opacity 120ms;
  }
  .compose-cancel {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-dim);
  }
  .compose-cancel:hover { border-color: var(--ink-dim); color: var(--ink); }

  .compose-save {
    background: var(--brass);
    border: 1px solid var(--brass);
    color: var(--paper);
    font-weight: 500;
  }
  .compose-save:hover { opacity: 0.88; }
  .compose-save:disabled, .compose-cancel:disabled { opacity: 0.5; cursor: default; }

  /* ---------- field list (Title/Author/Published/Source/Tags/URL) ---------- */
  .field-list {
    padding: 16px 28px 6px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .field-row {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 13px;
    line-height: 1.5;
  }
  .field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    width: 74px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .field-value {
    color: var(--ink-dim);
    word-break: break-word;
  }
  .field-value.empty { opacity: 0.5; font-style: italic; }
  .field-value a { color: var(--blue); text-decoration: none; }
  .field-value a:hover { text-decoration: underline; }
  .field-tag-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    font: inherit;
    font-size: 13px;
    padding: 0;
    cursor: pointer;
    text-decoration: none;
  }
  .field-tag-btn:hover { color: var(--brass); text-decoration: underline; }
  .field-tags { display: flex; flex-wrap: wrap; gap: 4px 10px; }

  /* ---------- edit mode ---------- */
  .edit-field-list {
    padding: 16px 28px 4px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .edit-field-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .edit-field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    width: 74px;
    flex-shrink: 0;
  }
  .edit-field-input {
    flex: 1;
    min-width: 0;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    outline: none;
  }
  .edit-field-input:focus { border-color: var(--brass); }
  .edit-body-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 7px;
  }
  .edit-body-textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 320px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    outline: none;
    resize: vertical;
    overflow: hidden;
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 26px;
    color: var(--ink);
    padding: 12px 14px;
  }
  .edit-body-textarea:focus { border-color: var(--brass); }
  .edit-body-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  /* The picker that drops a link into the body text. The linked-notes picker
     supplies its own gutter; this one sits inside the card body, which has
     padding already. */
  /* Both bars ride along at the top of the reading area, so the control is
     wherever the eye is rather than only at the top of a long article. */
  .edit-body-sticky, .read-body-bar {
    position: sticky;
    top: calc(-1 * var(--main-pad-top, 0px));
    z-index: 4;
    background: var(--panel-raised);
    padding: 10px 0 8px;
    margin-top: -10px;
  }
  .read-body-bar { display: flex; justify-content: flex-end; gap: 6px; }
  .bar-actions { display: flex; align-items: center; gap: 6px; }
  .inline-link-picker { padding: 0 0 10px; }
  .inline-link-picker[hidden] { display: none; }
  .inline-link-picker .link-picker-item { border: 1px solid var(--hairline); }
  .inline-link-picker .link-picker-item:hover { border-color: var(--brass); color: var(--brass); }
  .inline-link-picker .link-picker-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    display: block;
    margin: 6px 0 0;
  }

  /* ---------- links / linked notes ---------- */
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 14px 28px 6px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .tag-row {
    padding: 2px 28px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .link-list, .linked-note-list {
    padding: 0 28px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .link-item, .linked-note-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
  }
  .link-open {
    color: var(--blue);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .link-open:hover { text-decoration: underline; }
  .linked-note-open {
    background: none;
    border: none;
    color: var(--ink-dim);
    text-align: left;
    cursor: pointer;
    font: inherit;
    font-size: 12.5px;
    padding: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .linked-note-open:hover { color: var(--brass); }
  .link-create-btn, .link-add-toggle {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .link-create-btn:hover, .link-add-toggle:hover { border-color: var(--brass); color: var(--brass); }
  .linked-note-unlink {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .linked-note-unlink:hover { color: var(--rust); }

  .link-picker {
    padding: 8px 28px 16px;
  }
  .link-picker-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 12.5px;
    padding: 7px 10px;
    border-radius: 4px;
    outline: none;
    margin-bottom: 6px;
  }
  .link-picker-input:focus { border-color: var(--brass); }
  .link-picker-results { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .link-picker-item {
    background: none;
    border: none;
    text-align: left;
    color: var(--ink-dim);
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }
  .link-picker-item:hover { background: rgba(232,223,200,0.05); color: var(--ink); }

  /* ---------- reference panel ---------- */
  .ref-panel {
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    display: none;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
  }
  .app.ref-open .ref-panel { display: flex; }
  .ref-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  .ref-panel-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .ref-panel-close {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--ink-faint);
    width: 24px;
    height: 24px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    line-height: 1;
  }
  .ref-panel-close:hover { border-color: var(--rust); color: var(--rust); }
  .ref-panel-body { padding: 16px 20px 30px; }
  .ref-panel-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .ref-panel-fields { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .ref-panel-content {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-dim);
    white-space: pre-wrap;
    margin-bottom: 16px;
  }
  .ref-panel-open-full {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--brass);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .ref-panel-open-full:hover { border-color: var(--brass); }

  /* Facet disclosure. The full rail is 573px on a 375x812 screen — 70% of the
     viewport before a single note — so on a phone the topic/author/source
     groups collapse behind this button and the list starts near the top. */
  .facet-toggle { display: none; }
  .card-meta-toggle { display: none; }

  /* ---------- archive statistics ---------- */
  .stats { position: fixed; inset: 0; z-index: 80; overflow-y: auto; background: var(--paper); }
  .stats[hidden] { display: none; }
  .stats-inner { max-width: 860px; margin: 0 auto; padding: 26px 20px 60px; }
  .stats-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .stats-head h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }

  .stats-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                 gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); margin-bottom: 16px; }
  .stats-tiles div { background: var(--panel); padding: 13px 14px; }
  .stats-tiles .n { display: block; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
                    font-size: 24px; color: var(--brass); margin-bottom: 5px; }
  .stats-tiles .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
                    text-transform: uppercase; color: var(--ink-faint); }

  .stats-card { background: var(--panel); border: 1px solid var(--hairline); border-radius: 3px;
                padding: 16px 18px 18px; margin-bottom: 14px; }
  .stats-card h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .stats-card .hint { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em;
                      text-transform: uppercase; color: var(--ink-faint); margin-left: 8px; }
  .note-line { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-faint); }

  .meter { height: 10px; background: var(--paper); border: 1px solid var(--hairline); border-radius: 5px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--brass); }
  .meter-label { margin: 8px 0 0; font-size: 13px; color: var(--ink-dim); }
  .meter-label strong { color: var(--ink); }

  .stack { position: relative; height: 22px; border-radius: 3px; overflow: hidden; background: var(--paper); }
  /* 2px gap between segments so adjacent fills never touch */
  .stack .seg { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--panel); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px;
            font-size: 12.5px; color: var(--ink-dim); }
  .legend .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
                   margin-right: 6px; vertical-align: -1px; }
  .legend b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

  .chart { width: 100%; height: auto; display: block; }
  .chart .axis { stroke: var(--hairline); stroke-width: 1; }
  .chart .bar { fill: var(--blue); }
  .chart .bar:hover { fill: var(--brass); }
  .axis-label { display: flex; justify-content: space-between; margin: 4px 2px 0;
                font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); }

  .bars { list-style: none; margin: 0; padding: 0; }
  .bars li { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 38px;
             align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
  .bars .t { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .track { background: var(--paper); border-radius: 3px; height: 9px; }
  .bars .fill { display: block; height: 100%; background: var(--brass); border-radius: 3px; }
  .bars .v { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint);
             text-align: right; font-variant-numeric: tabular-nums; }

  .hubs { list-style: none; margin: 0; padding: 0; counter-reset: hub; }
  .hubs li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
             padding: 7px 0; border-bottom: 1px solid var(--ruled); }
  .hubs button { background: none; border: none; color: var(--ink); font-family: var(--font-body);
                 font-size: 13.5px; text-align: left; cursor: pointer; padding: 0; }
  .hubs button:hover { color: var(--brass); }
  .hubs span { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); }

  #graphCanvas { width: 100%; height: 320px; display: block; }

  .stats-tip { position: fixed; z-index: 90; pointer-events: none; display: none;
               background: var(--panel-raised); border: 1px solid var(--hairline); border-radius: 3px;
               padding: 7px 10px; font-size: 12.5px; color: var(--ink); max-width: 200px; }
  .stats-tip span { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); }

  /* ---------- facet dropdowns ---------- */
  /* Four buttons do not fit one row in the drawer, so they wrap rather than
     spilling over the edge into the reading pane. */
  .facet-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .facet-btn {
    /* Two per row: four across does not fit the drawer, and three-plus-one
       reads like a mistake rather than a layout. */
    flex: 1 1 calc(50% - 3px);
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 6px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .facet-btn:hover { border-color: var(--brass); }
  .facet-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .facet-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--brass); }
  .facet-btn.filtering { color: var(--brass); border-color: var(--brass); }
  .facet-n { color: var(--ink-faint); font-size: 10px; }
  .facet-btn[aria-expanded="true"] .facet-caret { transform: rotate(180deg); }
  .facet-caret { transition: transform 140ms ease; }

  .facet-panel { padding-bottom: 4px; }
  .facet-panel[hidden] { display: none; }
  .alpha-strip { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0 8px; }
  .alpha-strip[hidden] { display: none; }
  .alpha-btn {
    min-width: 22px;
    padding: 3px 5px;
    background: none;
    border: 1px solid transparent;
    border-radius: 2px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
  }
  .alpha-btn:hover { color: var(--ink); border-color: var(--hairline); }
  .alpha-btn.on { color: var(--paper); background: var(--brass); border-color: var(--brass); }
  .facet-chips { max-height: 210px; overflow-y: auto; }

  /* ---------- import (drag a file in) ---------- */
  .drop-veil {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(22,20,15,0.86);
    border: 2px dashed var(--brass);
  }
  .drop-veil.on { display: flex; }
  .drop-veil p {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--ink);
    text-align: center;
    margin: 0;
    padding: 0 24px;
  }
  .drop-veil small {
    display: block;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .import {
    position: fixed;
    inset: 0;
    z-index: 75;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(22,20,15,0.9);
  }
  .import[hidden] { display: none; }
  .import-panel {
    width: 100%;
    max-width: 760px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 20px;
  }
  .import-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .import-file {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-dim);
    word-break: break-all;
  }
  .import-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .import-text {
    flex: 1;
    min-height: 240px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.55;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
  }
  .import-text:focus { border-color: var(--brass); }
  .import-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .import-btn {
    background: var(--brass);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 10px 13px;
    cursor: pointer;
  }
  .import-btn.ghost {
    background: none;
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
  }
  .import-btn:disabled { opacity: 0.5; cursor: default; }
  .import-status { font-size: 13px; color: var(--ink-dim); }
  .import-status.error { color: var(--rust); }
  .import-picker { display: none; flex-direction: column; gap: 4px; }

  /* Tag confirmation. The extractor guesses topics from the text alone, and on
     a subject the archive does not usually cover it guesses badly — a note
     about light waves came back tagged "AI". Showing its guess while the note
     is still in front of you is the cheapest place to fix that. */
  .import-tags { display: flex; flex-direction: column; gap: 9px; }
  .import-tags-head { font-size: 13px; color: var(--ink-dim); }
  .import-tag-row { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
  .import-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--ink);
    border: 1px solid var(--ink-dim); border-radius: 3px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    padding: 5px 8px;
  }
  .import-tag button {
    background: none; border: none; color: var(--ink-dim);
    font-size: 14px; line-height: 1; padding: 0; cursor: pointer;
  }
  .import-tag button:hover { color: var(--rust); }
  .import-tag.is-new { border-color: var(--brass); color: var(--brass); }
  .import-tag-empty { font-size: 12px; color: var(--ink-dim); font-style: italic; }
  .import-tag-add { display: flex; gap: 6px; }
  .import-tag-input {
    flex: 1; background: transparent; color: var(--ink);
    border: 1px solid var(--ink-dim); border-radius: 3px;
    font-family: var(--font-mono); font-size: 12px; padding: 7px 8px;
  }
  .import-tag-input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .edit-tag-suggest-body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .import-tag-common { display: flex; flex-wrap: wrap; gap: 5px; }
  .import-tag-common button {
    background: none; border: 1px dashed var(--ink-dim); border-radius: 3px;
    color: var(--ink-dim); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.06em; padding: 4px 7px; cursor: pointer;
  }
  .import-tag-common button:hover { color: var(--brass); border-color: var(--brass); }
  .import-picker.on .link-picker-item { border: 1px solid var(--hairline); }
  .import-picker.on .link-picker-item:hover { border-color: var(--brass); color: var(--brass); }
  .import-picker.on { display: flex; }

  .import-editor { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .import-editor[hidden] { display: none; }
  .import-summary { display: flex; flex-direction: column; gap: 12px; }
  .import-summary[hidden] { display: none; }
  .import-summary-text { margin: 0; font-size: 14.5px; color: var(--ink-dim); }
  .import-made {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 300px;
    overflow-y: auto;
    border-top: 1px solid var(--ruled);
  }
  .import-made li {
    padding: 9px 2px;
    border-bottom: 1px solid var(--ruled);
    font-size: 14px;
  }
  .import-made strong { display: block; color: var(--ink); font-weight: 500; }
  .import-made span {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    word-break: break-all;
  }

  /* ---------- unlock gate ---------- */
  .unlock {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--paper);
  }
  .unlock[hidden] { display: none; }
  .unlock-panel {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 26px 24px 24px;
  }
  .unlock-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .unlock-copy {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-dim);
  }
  .unlock-copy.error { color: var(--rust); }
  .unlock-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }
  .unlock-input:focus { border-color: var(--brass); }
  .unlock-btn {
    background: var(--brass);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px 14px;
    cursor: pointer;
  }
  .unlock-btn:hover { filter: brightness(1.08); }
  .unlock-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    /* A 1fr grid track will not shrink below its content's minimum width, so a
       single long title or nowrap line inside the drawer pushes the whole column
       wider than the screen — taking its right-hand edge out of view. */
    .app, .app.detail-open, .app.ref-open { grid-template-columns: minmax(0, 1fr); }
    .drawer, .main { min-width: 0; }

    .facet-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 4px 0 2px;
      padding: 9px 12px;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .facet-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
    .facet-toggle[aria-expanded="true"] { color: var(--ink); border-color: var(--brass); }
    .facet-toggle-caret { transition: transform 140ms ease; }
    .facet-toggle[aria-expanded="true"] .facet-toggle-caret { transform: rotate(180deg); }
    .facet-toggle .facet-count { color: var(--brass); }

    /* The field list, links and linked notes push the article text more than
       half a screen down on a phone. Reading comes first; the reference data
       sits one tap away. */
    .card-meta-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: calc(100% - 32px);
      margin: 14px 16px 2px;
      padding: 9px 12px;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .card-meta-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
    .card-meta-toggle[aria-expanded="true"] { color: var(--ink); border-color: var(--brass); }
    .card-meta-toggle[aria-expanded="true"] .facet-toggle-caret { transform: rotate(180deg); }
    .card-meta { display: none; }
    .card-meta.open { display: block; }

    .facet-groups { display: none; }
    .facet-groups.open { display: block; }
    /* Freed from a fixed sliver, each group can show its chips inline. */
    .facet-groups .topic-chip-row { max-height: 168px; }

    .app { grid-template-columns: 1fr; }
    .app.ref-open { grid-template-columns: 1fr; }
    .ref-panel { display: none !important; }
    .drawer { display: flex; }
    .main { display: none; padding: 0; --main-pad-top: 0px; }
    .app.detail-open .drawer { display: none; }

    /* On a phone the card and the back button must stack. Left as a flex row,
       the 88px button sits beside the card and squeezes the reading column to
       about 24 characters. */
    .app.detail-open .main {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      /* The desktop rule centres the card horizontally. In a column that centres
         it *vertically*, and a card taller than the screen then overflows equally
         both ways — putting the start of the article above scroll position zero,
         where it cannot be reached. */
      justify-content: flex-start;
    }
    .back-btn {
      display: inline-block;
      align-self: flex-start;
      margin: 10px 0 4px 14px;
    }

    /* Full-bleed: the desktop tilt and side borders cost width the page cannot
       spare, and a rotated box clips against the viewport edge. */
    .index-card {
      max-width: 100%;
      /* The card is a flex item here. Without this it shrinks to the height of
         the viewport instead of growing to its content, which clips the article
         and leaves nothing to scroll. */
      flex: 0 0 auto;
      transform: none;
      border-left: none;
      border-right: none;
      border-radius: 0;
      box-shadow: none;
    }
    .index-card-head { padding: 16px 16px 0; }
    .index-card-body { padding: 16px 16px 22px; }
    .index-card-foot { padding: 12px 16px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    .card-row:hover .card-row-body { transform: none; }
  }
  /* The hidden attribute carries only UA-stylesheet weight, so any class that
     sets display beats it and the element stays on screen. These are the ones
     the mode switch toggles, so grant them the specificity to actually go. */
  .refresh-btn[hidden],
  .facet-bar[hidden],
  .search-row[hidden] { display: none; }

  /* ---------- tasks ----------
     The drawer shows one of two things: the archive, or the list of what needs
     doing. They share the shell but almost nothing else, because reading and
     doing want different furniture. */

  .mode-row {
    display: flex;
    gap: 2px;
    margin: 0 0 12px;
    border-bottom: 1px solid var(--hairline);
  }

  .mode-btn {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 4px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: -1px;
  }
  .mode-btn:hover { color: var(--ink-dim); }
  .mode-btn[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--brass); }
  .mode-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }

  /* The count only earns its place when there is something waiting. */
  .mode-n {
    font-size: 10px;
    color: var(--rust);
  }
  .mode-btn[aria-pressed="true"] .mode-n { color: var(--brass); }

  .task-group {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 16px 18px 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .task-group.overdue { color: var(--rust); }
  .task-group:first-child { padding-top: 6px; }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 11px 18px 11px 15px;
    border-bottom: 1px solid var(--ruled);
    transition: background 120ms;
  }
  .task-row:hover { background: rgba(232,223,200,0.03); }
  .task-row.selected { background: rgba(201,162,39,0.08); }
  .task-row.settling { opacity: 0.35; }

  /* Ticking something off is the most-used control in the whole view, so it is
     a real target rather than a checkbox glyph. */
  .task-tick {
    flex-shrink: 0;
    width: 17px;
    height: 17px;
    margin-top: 1px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 50%;
    background: none;
    cursor: pointer;
    padding: 0;
    position: relative;
    transition: border-color 120ms, background 120ms;
  }
  .task-tick:hover { border-color: var(--moss); background: rgba(124,154,110,0.15); }
  .task-tick:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .task-tick.done { border-color: var(--moss); background: var(--moss); }
  .task-tick svg { position: absolute; inset: 0; margin: auto; opacity: 0; }
  .task-tick:hover svg, .task-tick.done svg { opacity: 1; }
  .task-tick.done svg { color: var(--paper); }

  .task-open {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: pointer;
    font-family: inherit;
  }
  .task-open:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .task-title {
    font-size: 14px;
    line-height: 1.4;
    color: var(--ink-dim);
    overflow-wrap: anywhere;
  }
  .task-row.selected .task-title { color: var(--ink); }
  .task-row.is-done .task-title { text-decoration: line-through; color: var(--ink-faint); }

  .task-sub {
    margin-top: 3px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
  }
  .task-sub .due.late { color: var(--rust); }
  .task-sub .due.soon { color: var(--brass); }
  .task-sub .proj { color: var(--moss); }
  .task-sub .note-link { color: var(--blue); }
  .task-sub .repeat { color: var(--plum); }

  .task-status-tag {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 1px 5px;
  }

  /* ---------- task detail ---------- */

  .task-detail { padding: 40px 48px 80px; max-width: 640px; }

  .task-field { margin-top: 18px; }

  .task-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }

  .task-input, .task-textarea, .task-select {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 9px 11px;

  }
  .task-textarea { min-height: 90px; resize: vertical; }
  .task-select { font-family: var(--font-mono); font-size: 12px; }
  .task-input:focus, .task-textarea:focus, .task-select:focus {
    outline: none;
    border-color: var(--brass);
  }

  .task-row-fields { display: flex; gap: 14px; flex-wrap: wrap; }
  .task-row-fields .task-field { flex: 1; min-width: 150px; }

  .task-hint {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .task-hint.bad { color: var(--rust); }

  .task-actions {
    margin-top: 26px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .task-btn {
    background: var(--brass);
    border: 1px solid var(--brass);
    color: var(--paper);
    font-family: var(--font-mono);

  .task-btn.ghost:hover { color: var(--ink); border-color: var(--ink-dim); }
  .task-btn.danger { background: none; color: var(--rust); border-color: transparent; }
  .task-btn:disabled { opacity: 0.5; cursor: default; }
  .task-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .task-detail-status.good { color: var(--moss); }

  @media (max-width: 860px) {

</style>
