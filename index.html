<script>
// Talks directly to your Open Brain MCP server (Supabase edge function) — no
// AI middleman needed just to list or search notes. Auth is the MCP Access
// Key from your credential tracker, sent as the x-brain-key header, the same
// way the Claude Code CLI / mcp-remote connections use it.
const MCP_URL = "https://uftlxeahciewiitclkbu.supabase.co/functions/v1/open-brain-mcp";

// The access key is NOT stored in this file. Anyone holding it can read, write
// and delete everything in the archive, so baking it into the page would hand
// it to anyone who ever gets a copy — a host, a backup, a shared link. It is
// entered once and kept in this browser's localStorage instead.
const KEY_STORAGE = 'openbrain.accessKey';
let mcpAccessKey = '';
try { mcpAccessKey = localStorage.getItem(KEY_STORAGE) || ''; } catch (_) { mcpAccessKey = ''; }

function setAccessKey(key) {
  mcpAccessKey = (key || '').trim();
  try {
    if (mcpAccessKey) localStorage.setItem(KEY_STORAGE, mcpAccessKey);
    else localStorage.removeItem(KEY_STORAGE);
  } catch (_) { /* private browsing — the key just won't persist */ }
}

const TYPE_STYLES = {
  observation:  { color: 'var(--moss)', label: 'Observation' },
  idea:         { color: 'var(--brass)', label: 'Idea' },
  task:         { color: 'var(--rust)',  label: 'Task' },
  reference:    { color: 'var(--blue)',  label: 'Reference' },
  person_note:  { color: 'var(--plum)',  label: 'Person note' },
};
const UNFILED = { color: 'var(--unfiled)', label: 'Unfiled' };

function typeStyle(t) {
  if (t && TYPE_STYLES[t]) return TYPE_STYLES[t];
  return UNFILED;
}

let allThoughts = [];   // full list, from last successful list fetch
let displayed = [];     // currently shown (after search/filter)
let activeTypes = new Set();
let activeTopics = new Set(); // normalized (lowercased) topic strings
let activeAuthors = new Set(); // normalized (lowercased) author strings
let activeSources = new Set(); // normalized (lowercased) source strings
let activePeople = new Set();  // normalized (lowercased) person names
let selectedIndex = null;
let editingId = null;    // id of the thought currently open in the edit form, or null
let referenceId = null;  // id of the thought shown read-only in the reference panel, or null
let searchMode = false;
let lastSearchQuery = '';

const listScroll = document.getElementById('listScroll');
const chipRow = document.getElementById('chipRow');
const main = document.getElementById('main');
const app = document.getElementById('app');
const refPanel = document.getElementById('refPanel');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const refreshBtn = document.getElementById('refreshBtn');
const newBtn = document.getElementById('newBtn');

// Whoever is writing here. Notes typed into the catalog are by definition
// yours, so the extractor should not be left to guess at the author.
const SELF_AUTHOR = 'Stewart Morpurgo';

const MONTH_NAMES = ['jan', 'feb', 'mar', 'apr', 'may', 'jun',
                     'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

// Dates are stored as YYYY-MM-DD — the form the archive sorts, filters and
// charts on — but nobody should have to type that. This reads the ways a date
// is normally written and returns the stored form, or null if it cannot tell.
// Day comes first when the order is ambiguous: 01/08/1974 is 1 August.
function parseDateInput(text) {
  const raw = (text || '').trim().replace(/,/g, ' ').replace(/\s+/g, ' ');
  if (!raw) return '';

  const build = (y, m, d) => {
    if (!(y >= 1000 && y <= 9999) || !(m >= 1 && m <= 12) || !(d >= 1 && d <= 31)) return null;
    const probe = new Date(Date.UTC(y, m - 1, d));
    if (probe.getUTCMonth() !== m - 1 || probe.getUTCDate() !== d) return null;  // 31 Feb
    const pad = n => String(n).padStart(2, '0');
    return y + '-' + pad(m) + '-' + pad(d);
  };
  const fullYear = y => (y >= 100 ? y : y + (y <= (new Date().getFullYear() % 100) ? 2000 : 1900));
  const monthOf = word => MONTH_NAMES.indexOf(word.slice(0, 3).toLowerCase()) + 1;

  let m;
  // 1974-08-01, and 1974/08/01
  if ((m = raw.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/)))
    return build(+m[1], +m[2], +m[3]);
  // 01/08/1974, 1-8-74, 01.08.1974
  if ((m = raw.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2}|\d{4})$/)))
    return build(fullYear(+m[3]), +m[2], +m[1]);
  // 1 Aug 1974, 01 August 1974
  if ((m = raw.match(/^(\d{1,2}) ([A-Za-z]{3,9})\.? (\d{2}|\d{4})$/)))
    return build(fullYear(+m[3]), monthOf(m[2]), +m[1]);
  // Aug 1 1974, August 1st 1974
  if ((m = raw.match(/^([A-Za-z]{3,9})\.? (\d{1,2})(?:st|nd|rd|th)? (\d{2}|\d{4})$/)))
    return build(fullYear(+m[3]), monthOf(m[1]), +m[2]);
  return null;
}

// The stored date as it is typed and read back: dd/mm/yyyy.
function formatDateInput(iso) {
  const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || '');
}

// Today, in the archive's date format and the reader's own timezone.
function todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function formatDate(iso) {
  if (!iso) return 'Undated';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'Undated';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// For interpolating into a double-quoted HTML attribute (value="...",
// data-x="..."). escapeHtml alone isn't safe here — text-node serialization
// doesn't escape quote characters, so an unescaped " in e.g. a title would
// break out of the attribute. getAttribute()/reading .value later decodes
// these entities back to the original string automatically.
function escapeAttr(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Renders note content for display: HTML-escaped first (so nothing in a note
// can inject markup), then markdown links [text](url) and bare http(s) URLs
// are turned into real anchors. The raw markdown is left untouched in the
// stored content and in the edit textarea — this is display-only.
const MD_LINK_RE = /\[([^\]\n]{1,200})\]\((https?:\/\/[^\s<>"')]+)\)/g;
const BARE_URL_RE = /(^|[\s(])(https?:\/\/[^\s<>"')]+)/g;
// In-brain link: [Text](thought:<uuid>) points at another note in this archive
// instead of the open web. Rendered as a click target handled in selectThought.
const THOUGHT_LINK_RE = /\[([^\]\n]{1,200})\]\(thought:([0-9a-fA-F-]{36})\)/g;

function linkAnchor(url, label) {
  // url/label are already HTML-escaped by escapeHtml, so they must not be
  // escaped again (that would turn &amp; into &amp;amp;). The URL character
  // class excludes " < > so it is safe inside a double-quoted attribute.
  const trail = url.match(/[.,;:!?]+$/);
  let href = url, tail = '';
  if (trail && label === url) { href = url.slice(0, -trail[0].length); tail = trail[0]; }
  return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="body-link">'
    + (label === url ? href : label) + '</a>' + tail;
}

function renderBodyHtml(content) {
  let html = escapeHtml(content);
  html = html.replace(THOUGHT_LINK_RE, (_m, text, id) => {
    const found = findThought(id);
    return found
      ? '<a class="thought-link" data-id="' + escapeAttr(id) + '" title="Open this note">' + text + '</a>'
      : '<span class="thought-link missing" title="This note is no longer in the archive">' + text + '</span>';
  });
  html = html.replace(MD_LINK_RE, (_m, text, url) => linkAnchor(url, text));
  html = html.replace(BARE_URL_RE, (_m, pre, url) => pre + linkAnchor(url, url));
  return html;
}

/* ---------- MCP JSON-RPC client ---------- */

let mcpSessionId = null; // the server strips this from responses, but kept in case that changes
let rpcCounter = 0;

async function mcpRequest(method, params) {
  const body = { jsonrpc: '2.0', id: ++rpcCounter, method };
  if (params !== undefined) body.params = params;

  const headers = {
    'Content-Type': 'application/json',
    'Accept': 'application/json, text/event-stream',
    'x-brain-key': mcpAccessKey,
  };
  if (mcpSessionId) headers['Mcp-Session-Id'] = mcpSessionId;

  let response;
  try {
    response = await fetch(MCP_URL, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (err) {
    // Flagged, not just worded: a note written on a dead connection is held in
    // the outbox rather than lost, and the only way to tell that case from
    // "the archive answered, and said no" is which side of this try the
    // failure came from. A rejection here means nothing reached the server.
    const unreachable = new Error('Could not reach the archive server. This is usually a network problem, or the server may not be allowing direct browser requests (CORS). (' + err.message + ')');
    unreachable.unreachable = true;
    throw unreachable;
  }

  const sid = response.headers.get('Mcp-Session-Id');
  if (sid) mcpSessionId = sid;

  if (!response.ok) {
    let detail = '';
    try { detail = (await response.text()).slice(0, 200); } catch (_) {}
    let hint = '';
    if (response.status === 401 || response.status === 403) {
      setAccessKey('');
      showUnlock('That key was rejected. Check it and try again.');
      hint = ' — the archive rejected that access key';
    }
    throw new Error('Archive returned HTTP ' + response.status + hint + (detail ? (': ' + detail) : ''));
  }

  const contentType = response.headers.get('Content-Type') || '';
  let payload;
  if (contentType.includes('text/event-stream')) {
    const raw = await response.text();
    const dataLines = raw.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim());
    const lastJson = [...dataLines].reverse().find(l => l.startsWith('{'));
    if (!lastJson) throw new Error('The archive sent a streamed response with no data.');
    payload = JSON.parse(lastJson);
  } else {
    const raw = await response.text();
    payload = raw.trim() ? JSON.parse(raw) : {};
  }

  if (payload.error) {
    // The server answers an invalid key with HTTP 200 and a JSON-RPC error
    // (code -32001), so the auth check has to happen here, not on the status.
    const msg = payload.error.message || 'The archive reported an error.';
    if (payload.error.code === -32001 || /unauthor/i.test(msg)) {
      setAccessKey('');
      showUnlock('That key was rejected. Check it and try again.');
    }
    throw new Error(msg);
  }
  return payload.result;
}

// Your server rebuilds a fresh MCP server + transport on every single HTTP
// call (sessionIdGenerator: undefined — true stateless mode, per the source
// you shared), so there's no persisted session to negotiate and no need to
// send "initialize" before a tool call — each request is self-contained.
async function callTool(name, args) {
  const result = await mcpRequest('tools/call', { name, arguments: args || {} });
  const block = ((result && result.content) || []).find(b => b.type === 'text');
  if (!block) throw new Error('The archive returned no readable content for "' + name + '".');
  return block.text;
}

/* ---------- the outbox: notes written while the archive was unreachable ----------

   The catalog's shell is cached by the service worker, so it opens on a dead
   connection and lets you type. Until this existed, pressing Save then threw
   and the note stayed in a textarea that the next navigation cleared — the
   worst possible moment to lose one, because it is exactly the moment you are
   in a meeting with no signal.

   Only captures are held. Edits, links and tasks all name a row by id and
   assume the server's current state, so replaying them minutes or hours later
   can quietly overwrite something changed since. A capture is append-only and
   carries everything it needs, so replaying it is always safe. Anything else
   still fails loudly, as before.

   localStorage rather than IndexedDB, deliberately: this is a handful of short
   text notes waiting minutes, not an offline mirror of the archive. The 5MB
   ceiling is far past what a queue like that ever reaches, the access key
   already lives here so nothing new is being exposed, and a synchronous store
   needs no open, no versioning and no transactions in a page that has none of
   that anywhere else. Quota is handled where it can happen rather than hoped
   about: a write that will not fit refuses in front of you instead of
   pretending to have saved. */

const OUTBOX_STORAGE = 'openbrain.outbox';
let outboxSending = false;

function outboxRead() {
  // Every read is defensive. Storage can be unavailable (a locked-down browser,
  // a private window), and a half-written value from a killed tab must not take
  // the whole page down on load.
  try {
    const raw = localStorage.getItem(OUTBOX_STORAGE);
    if (!raw) return [];
    const list = JSON.parse(raw);
    return Array.isArray(list) ? list.filter(r => r && typeof r.content === 'string') : [];
  } catch (_) {
    return [];
  }
}

function outboxWrite(list) {
  try {
    if (list.length) localStorage.setItem(OUTBOX_STORAGE, JSON.stringify(list));
    else localStorage.removeItem(OUTBOX_STORAGE);
    return true;
  } catch (_) {
    return false;
  }
}

function outboxAdd(args) {
  const record = {
    // Date plus a random tail: two notes held in the same millisecond is
    // implausible, but an id collision would silently drop one of them.
    id: 'held-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    content: args.content,
    author: args.author,
    published_date: args.published_date,
    written_at: new Date().toISOString(),
  };
  if (args.parent_thought_id) record.parent_thought_id = args.parent_thought_id;

  const list = outboxRead();
  list.push(record);
  if (!outboxWrite(list)) return null;
  renderOutbox();
  return record;
}

function outboxRemove(id) {
  outboxWrite(outboxRead().filter(r => r.id !== id));
}

function renderOutbox(message) {
  const btn = document.getElementById('heldBtn');
  const count = document.getElementById('heldCount');
  if (!btn || !count) return;
  const held = outboxRead();
  btn.hidden = held.length === 0;
  count.textContent = held.length + ' held';
  btn.classList.toggle('sending', outboxSending);
  btn.classList.toggle('stuck', !!message);
  btn.title = message
    ? message + ' Click to try again.'
    : (held.length === 1 ? 'One note is' : held.length + ' notes are') +
      ' waiting for the archive. Click to send now.';
}

// Replayed in the order they were written, and stopped at the first failure
// rather than skipped past: a note that refers to "the above" reads as nonsense
// if the note above it went in an hour later. Stopping also keeps a rejected
// key from burning through the whole queue producing the same error each time.
async function flushOutbox() {
  if (outboxSending) return { sent: 0 };
  if (!mcpAccessKey) return { sent: 0 };   // locked: nothing to send with
  const held = outboxRead();
  if (!held.length) return { sent: 0 };

  outboxSending = true;
  renderOutbox();

  // Every held note has already had one send fail — that failure is the only
  // way into the outbox — and a failed send may still have landed: fetch()
  // rejects identically whether the request never left the machine or the reply
  // was lost on the way back. upsert_thought is a plain insert with no dedupe,
  // so replaying the second case files the note twice. Hence: ask the archive
  // what it already has before replaying anything into it.
  //
  // Read once per flush, not once per note, and deliberately not updated with
  // what this flush sends: two identical notes really written twice must both
  // survive, and they only do if the second is checked against the archive as
  // it stood before either went in.
  //
  // Exact content rather than a semantic search, because the question is "is
  // this same note already filed" — search_thoughts answers a different one and
  // would happily match last week's note on the same subject and bin today's.
  let filed = null;
  const alreadyFiled = async (record) => {
    if (filed === null) {
      try {
        filed = parseJsonThoughts(await callTool('list_thoughts', { limit: 100, format: 'json' }))
          .map(t => (t.content || '').trim());
      } catch (_) {
        // Cannot tell. Send it: a duplicate you can see and delete beats a note
        // quietly dropped on a maybe.
        filed = [];
      }
    }
    return filed.includes(record.content.trim());
  };

  let sent = 0;
  let failure = null;
  for (const record of held) {
    if (await alreadyFiled(record)) {
      outboxRemove(record.id);
      continue;
    }
    const args = {
      content: record.content,
      author: record.author || SELF_AUTHOR,
      published_date: record.published_date || todayISO(),
    };
    if (record.parent_thought_id) args.parent_thought_id = record.parent_thought_id;
    try {
      await callTool('capture_thought', args);
      outboxRemove(record.id);
      sent++;
    } catch (err) {
      failure = err;
      break;
    }
  }

  outboxSending = false;
  // Still no network is the expected state, not an error worth shouting about:
  // it stays a quiet count. Anything else means the archive answered and
  // refused, which you do need to see.
  renderOutbox(failure && !failure.unreachable
    ? ('The archive refused a held note — ' + failure.message)
    : null);

  // Refreshing mid-search would throw away the results being read. The held
  // notes are safely in the archive either way; the list catches up on the
  // next refresh.
  if (sent && viewMode === 'notes' && !searchMode && !app.classList.contains('detail-open')) {
    try { await loadAll(); } catch (_) { /* the notes are saved regardless */ }
  }
  return { sent, failure };
}

/* ---------- Normalizing the tool's JSON output into cards ----------
   list_thoughts / search_thoughts are called with format:"json" so the
   server returns a real array of {id, content, created_at, metadata}
   objects instead of the plain-text format meant for other AI clients —
   no more regex-parsing prose, and ids are always the real database id. */

function normalizeType(raw) {
  if (!raw) return null;
  const t = String(raw).trim().toLowerCase();
  if (!t || t === '??' || t === 'unknown' || t === 'none' || t === 'null') return null;
  return Object.prototype.hasOwnProperty.call(TYPE_STYLES, t) ? t : null;
}

function normalizeThought(raw) {
  const m = raw.metadata || {};
  return {
    id: raw.id,
    realId: raw.id,
    content: raw.content || '',
    created_at: raw.created_at || null,
    type: normalizeType(m.type),
    topics: Array.isArray(m.topics) ? m.topics : [],
    people: Array.isArray(m.people) ? m.people : [],
    author: m.author || null,
    source: m.source_name || null,
    source_url: m.source_url || null,
    title: m.title || null,
    published_date: m.published_date || null,
    updated_date: m.updated_date || null,
    extracted_links: Array.isArray(m.extracted_links) ? m.extracted_links : [],
    linked_thought_ids: Array.isArray(m.linked_thought_ids) ? m.linked_thought_ids : [],
  };
}

function parseJsonThoughts(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (_) { raw = []; }
  if (!Array.isArray(raw)) raw = [];
  return raw.map(normalizeThought);
}

function findThought(id) {
  return allThoughts.find(t => t.id === id) || null;
}

function renderChips() {
  const typesPresent = new Set(allThoughts.map(t => t.type || '__unfiled__'));
  chipRow.innerHTML = '';
  if (typesPresent.size <= 1) return;
  typesPresent.forEach(t => {
    const key = t === '__unfiled__' ? null : t;
    const style = typeStyle(key);
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeTypes.has(t) ? ' active' : '');
    if (activeTypes.has(t)) chip.style.background = style.color;
    chip.innerHTML = '<span class="dot" style="background:' + style.color + '"></span>' + style.label;
    chip.addEventListener('click', () => {
      if (activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
      applyFilters();
    });
    chipRow.appendChild(chip);
  });
}

// Topic chips are built from the full loaded list (allThoughts), same as
// the type chips above — matching each other keeps the two filter rows
// self-consistent, and lets you browse by topic regardless of whether a
// search is currently active. Topics are grouped case-insensitively (the
// AI extractor isn't always consistent about casing) but displayed using
// the first-seen casing.

// Topics that share a first word (e.g. "AI", "AI Agents", "AI Careers") get
// collapsed under one parent chip so a busy tag vocabulary doesn't overwhelm
// the drawer — click the parent to expand/collapse its members, click a
// member to filter by it same as any other topic chip. Topics with no
// sibling sharing that first word render as ordinary flat chips.

// Author/Source chips work like Topics (built from allThoughts, hidden when
// there's nothing but a single value) but each thought has at most one of
// each rather than an array, so the map-building and filter predicate are a
// little simpler than the topic version.



// ---------- facet dropdowns ----------
// One line each for topics, authors and sources. Only one opens at a time, so
// the drawer stays short however many tags the archive accumulates.
//
// Topics get an A–Z index because there are hundreds of them, most used only
// once; authors and sources are a handful, so an index there would be friction
// for nothing. The default topic view is the ones actually worth browsing —
// those used more than once — with the long tail behind its letter.

const facetPanel = document.getElementById('facetPanel');
const facetChips = document.getElementById('facetChips');
const alphaStrip = document.getElementById('alphaStrip');
const facetButtons = {
  topics: document.getElementById('facetBtnTopics'),
  authors: document.getElementById('facetBtnAuthors'),
  people: document.getElementById('facetBtnPeople'),
  sources: document.getElementById('facetBtnSources'),
};

let openFacet = null;      // 'topics' | 'authors' | 'sources' | null
let topicLetter = null;    // null means the "common" view

function topicCounts() {
  const counts = new Map();   // normalised -> { label, n }
  allThoughts.forEach(t => {
    (t.topics || []).forEach(raw => {
      const norm = raw.trim().toLowerCase();
      if (!norm) return;
      const entry = counts.get(norm) || { label: raw.trim(), n: 0 };
      entry.n += 1;
      counts.set(norm, entry);
    });
  });
  return counts;
}

function listCounts(field) {
  const counts = new Map();
  allThoughts.forEach(t => (t[field] || []).forEach(raw => {
    const norm = (raw || '').trim().toLowerCase();
    if (!norm) return;
    const entry = counts.get(norm) || { label: raw.trim(), n: 0 };
    entry.n += 1;
    counts.set(norm, entry);
  }));
  return counts;
}

function valueCounts(field) {
  const counts = new Map();
  allThoughts.forEach(t => {
    const raw = t[field];
    if (!raw) return;
    const norm = raw.trim().toLowerCase();
    const entry = counts.get(norm) || { label: raw.trim(), n: 0 };
    entry.n += 1;
    counts.set(norm, entry);
  });
  return counts;
}

function facetChip(norm, label, count, activeSet, colour) {
  const chip = document.createElement('button');
  const on = activeSet.has(norm);
  chip.className = 'chip' + (on ? ' active' : '');
  if (on) chip.style.background = colour;
  chip.innerHTML = '<span class="dot" style="background:' + colour + '"></span>'
    + escapeHtml(label)
    + (count > 1 ? '<span class="chip-count">(' + count + ')</span>' : '');
  chip.addEventListener('click', () => {
    if (activeSet.has(norm)) activeSet.delete(norm); else activeSet.add(norm);
    applyFilters();
  });
  return chip;
}

function renderAlphaStrip(counts) {
  const letters = [...new Set([...counts.values()]
    .map(v => (v.label[0] || '').toUpperCase())
    .filter(c => /[A-Z]/.test(c)))].sort();
  alphaStrip.innerHTML = '';

  const common = document.createElement('button');
  common.className = 'alpha-btn' + (topicLetter === null ? ' on' : '');
  common.type = 'button';
  common.textContent = 'Common';
  common.title = 'Topics used more than once';
  common.addEventListener('click', () => { topicLetter = null; renderFacetPanel(); });
  alphaStrip.appendChild(common);

  letters.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'alpha-btn' + (topicLetter === letter ? ' on' : '');
    btn.type = 'button';
    btn.textContent = letter;
    btn.addEventListener('click', () => {
      topicLetter = topicLetter === letter ? null : letter;
      renderFacetPanel();
    });
    alphaStrip.appendChild(btn);
  });
}

function renderFacetPanel() {
  facetPanel.hidden = !openFacet;
  alphaStrip.hidden = openFacet !== 'topics';
  facetChips.innerHTML = '';
  if (!openFacet) return;

  if (openFacet === 'topics') {
    const counts = topicCounts();
    renderAlphaStrip(counts);
    let entries = [...counts.entries()];
    if (topicLetter) {
      entries = entries.filter(([, v]) => (v.label[0] || '').toUpperCase() === topicLetter)
                       .sort((a, b) => a[1].label.localeCompare(b[1].label));
    } else {
      // Anything used once is noise here; it is still reachable by its letter.
      entries = entries.filter(([norm, v]) => v.n > 1 || activeTopics.has(norm))
                       .sort((a, b) => b[1].n - a[1].n || a[1].label.localeCompare(b[1].label));
    }
    if (!entries.length) {
      facetChips.innerHTML = '<span class="field-value empty">Nothing under that letter.</span>';
      return;
    }
    entries.forEach(([norm, v]) =>
      facetChips.appendChild(facetChip(norm, '# ' + v.label, v.n, activeTopics, 'var(--brass)')));
    return;
  }

  const spec = {
    people:  { counts: () => listCounts('people'), set: activePeople,  colour: 'var(--plum)' },
    authors: { counts: () => valueCounts('author'), set: activeAuthors, colour: 'var(--moss)' },
    sources: { counts: () => valueCounts('source'), set: activeSources, colour: 'var(--blue)' },
  }[openFacet];
  const counts = spec.counts();
  const set = spec.set;
  const colour = spec.colour;
  [...counts.entries()]
    .sort((a, b) => b[1].n - a[1].n || a[1].label.localeCompare(b[1].label))
    .forEach(([norm, v]) => facetChips.appendChild(facetChip(norm, v.label, v.n, set, colour)));
}

function renderFacetBar() {
  const sizes = {
    topics: topicCounts().size,
    authors: valueCounts('author').size,
    people: listCounts('people').size,
    sources: valueCounts('source').size,
  };
  const actives = { topics: activeTopics, authors: activeAuthors,
                    people: activePeople, sources: activeSources };
  document.getElementById('facetNTopics').textContent = sizes.topics || '';
  document.getElementById('facetNAuthors').textContent = sizes.authors || '';
  document.getElementById('facetNPeople').textContent = sizes.people || '';
  document.getElementById('facetNSources').textContent = sizes.sources || '';
  Object.keys(facetButtons).forEach(name => {
    const btn = facetButtons[name];
    btn.setAttribute('aria-expanded', openFacet === name ? 'true' : 'false');
    // A filter left on inside a closed dropdown would otherwise be invisible.
    btn.classList.toggle('filtering', actives[name].size > 0);
    btn.style.display = sizes[name] ? '' : 'none';
  });
}

Object.keys(facetButtons).forEach(name => {
  facetButtons[name].addEventListener('click', () => {
    openFacet = openFacet === name ? null : name;
    if (name === 'topics' && openFacet !== 'topics') topicLetter = null;
    renderFacetBar();
    renderFacetPanel();
  });
});

function renderFacets() {
  renderFacetBar();
  renderFacetPanel();
}

function applyFilters() {
  const base = searchMode ? displayed.baseResults : allThoughts;
  let filtered = base;
  if (activeTypes.size > 0) {
    filtered = filtered.filter(t => activeTypes.has(t.type || '__unfiled__'));
  }
  if (activeTopics.size > 0) {
    filtered = filtered.filter(t =>
      (t.topics || []).some(top => activeTopics.has(top.trim().toLowerCase()))
    );
  }
  if (activePeople.size > 0) {
    filtered = filtered.filter(t =>
      (t.people || []).some(p => activePeople.has(p.trim().toLowerCase()))
    );
  }
  if (activeAuthors.size > 0) {
    filtered = filtered.filter(t => t.author && activeAuthors.has(t.author.trim().toLowerCase()));
  }
  if (activeSources.size > 0) {
    filtered = filtered.filter(t => t.source && activeSources.has(t.source.trim().toLowerCase()));
  }
  renderChips();
  renderFacets();
  renderList(filtered, searchMode);
}

function renderList(items, isSearch) {
  displayed = items;
  displayed.baseResults = isSearch ? displayed.baseResults : items;
  listScroll.innerHTML = '';

  if (items.length === 0) {
    const status = document.createElement('div');
    status.className = 'list-status';
    status.textContent = isSearch
      ? 'No cards match that search.'
      : 'The drawer is empty. Capture a thought to file one here.';
    listScroll.appendChild(status);
    return;
  }

  items.forEach((t) => {
    const style = typeStyle(t.type);
    const row = document.createElement('button');
    row.className = 'card-row'
      + (selectedIndex === t.id ? ' selected' : '')
      + (referenceId === t.id ? ' referencing' : '');
    row.innerHTML = `
      <div class="card-row-tab" style="background:${style.color}"></div>
      <div class="card-row-body">
        <div class="card-row-meta">
          <span class="card-row-type" style="color:${style.color}">${style.label}</span>
          <span class="card-row-date">${formatDate(t.created_at)}</span>
        </div>
        <div class="card-row-preview">${escapeHtml(t.title || t.content)}</div>
        ${(t.people || []).length
          ? `<div class="card-row-people">${escapeHtml((t.people || []).slice(0, 4).join(' · '))}</div>`
          : ''}
      </div>
    `;
    row.addEventListener('click', () => {
      if (editingId && t.id !== editingId) {
        openReference(t);
      } else if (!editingId) {
        selectThought(t);
      }
    });
    listScroll.appendChild(row);
  });
}

// Shared by both the author and source field-value clicks in the detail
// view — exits any active search and narrows the drawer to just that value.
function filterToSingleValue(setRef, value) {
  searchMode = false;
  lastSearchQuery = '';
  searchInput.value = '';
  searchClear.style.display = 'none';
  setRef.clear();
  setRef.add(value.trim().toLowerCase());
  showEmptyState();
  applyFilters();
}

function renderLinksSection(t) {
  const items = t.extracted_links.map(l => {
    const label = l.text && l.text !== l.url ? l.text : l.url;
    return `
      <div class="link-item">
        <a class="link-open" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>
      </div>
    `;
  }).join('');
  return `<div class="section-label"><span>Links found in this note</span></div><div class="link-list">${items}</div>`;
}

function renderLinkedNotesSection(t) {
  const items = t.linked_thought_ids.map(id => {
    const found = findThought(id);
    const label = found
      ? (found.title || found.content.replace(/\s+/g, ' ').trim().slice(0, 60))
      : ('Note ' + id.slice(0, 8) + '…');
    return `
      <div class="linked-note-item">
        <button class="linked-note-open" data-id="${escapeAttr(id)}" type="button">${escapeHtml(label)}</button>
        <button class="linked-note-unlink" data-id="${escapeAttr(id)}" title="Remove link" type="button">×</button>
      </div>
    `;
  }).join('');
  return `
    <div class="section-label">
      <span>Linked notes</span>
      <button class="link-add-toggle" id="linkAddToggle" type="button">+ Link to another note</button>
    </div>
    <div class="linked-note-list">${items || '<span class="field-value empty">No linked notes yet.</span>'}</div>
    <div class="link-picker" id="linkPicker" style="display:none">
      <input class="link-picker-input" id="linkPickerInput" type="text" placeholder="Search notes to link…" />
      <div class="link-picker-results" id="linkPickerResults"></div>
    </div>
  `;
}

function setupLinkPicker(t) {
  const toggle = document.getElementById('linkAddToggle');
  const picker = document.getElementById('linkPicker');
  const input = document.getElementById('linkPickerInput');
  const results = document.getElementById('linkPickerResults');
  if (!toggle) return;

  function renderResults(query) {
    const q = query.trim().toLowerCase();
    const linked = new Set(t.linked_thought_ids);
    const candidates = allThoughts.filter(o => o.id !== t.id && !linked.has(o.id));
    const matches = (q
      ? candidates.filter(o => (o.title || '').toLowerCase().includes(q) || o.content.toLowerCase().includes(q))
      : candidates
    ).slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map(o => `<button class="link-picker-item" data-id="${escapeAttr(o.id)}" type="button">${escapeHtml(o.title || o.content.replace(/\s+/g, ' ').trim().slice(0, 70))}</button>`).join('')
      : '<span class="field-value empty" style="padding:6px 8px;display:block;">No matches.</span>';
    results.querySelectorAll('.link-picker-item').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await callTool('link_thoughts', { id_a: t.id, id_b: btn.getAttribute('data-id') });
          await refreshAndReselect(t.id);
        } catch (err) {
          btn.disabled = false;
          results.insertAdjacentHTML('afterbegin', `<span class="field-value" style="color:var(--rust);display:block;padding:4px 8px;">Could not link — ${escapeHtml(err.message)}</span>`);
        }
      });
    });
  }

  toggle.addEventListener('click', () => {
    const showing = picker.style.display !== 'none';
    picker.style.display = showing ? 'none' : 'block';
    if (!showing) { input.value = ''; renderResults(''); input.focus(); }
  });
  input.addEventListener('input', () => renderResults(input.value));
}

async function refreshAndReselect(id, mark) {
  await loadAll();
  const found = findThought(id);
  if (found) selectThought(found, mark); else showEmptyState();
}

// Back to the top of whichever card is on screen. Both the reading view and the
// edit view carry the button in their sticky bar.
function wireTopButtons() {
  main.querySelectorAll('.top-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const from = main.scrollTop;
      main.scrollTo({ top: 0, behavior: 'smooth' });
      // If the smooth scroll was ignored, jump anyway: a button that silently
      // does nothing is worse than one that skips the animation.
      setTimeout(() => { if (from > 0 && main.scrollTop === from) main.scrollTop = 0; }, 300);
    });
  });
}

// A phrase can repeat down a long article, so take the occurrence nearest to
// where the scroll bar says we are rather than simply the first.
function nearestIndex(hay, needle, estimate) {
  let best = -1, gap = Infinity;
  for (let at = hay.indexOf(needle); at !== -1; at = hay.indexOf(needle, at + 1)) {
    const d = Math.abs(at - estimate);
    if (d < gap) { best = at; gap = d; }
    if (at > estimate + 4000) break;
  }
  return best;
}

// The link markup as the reader sees it, so words taken from the stored text
// can be found again in the rendered article.
function strippedMarkup(text) {
  return text.replace(THOUGHT_LINK_RE, '$1').replace(MD_LINK_RE, '$1');
}

// Where the editor was left, described in a way that survives the edit itself:
// some words from the top of the screen, and roughly how far down they were.
// Offsets alone would not do — saving can change the text above them.
function readingMark(el) {
  const y = Math.max(0, main.getBoundingClientRect().top + STICKY_ROOM
                        - el.getBoundingClientRect().top);
  const at = offsetAtTop(el, y);
  let text = strippedMarkup(el.value.slice(at, at + 240)).replace(/^\s+/, '');
  // The top of the screen usually falls mid-word; start at the next whole one
  // so the words can be found again in the rendered article.
  if (at > 0 && /\S/.test(el.value[at - 1])) text = text.replace(/^\S*\s+/, '');
  const words = text.slice(0, 48);
  return words.length >= 10 ? { words, fraction: at / Math.max(1, el.value.length) } : null;
}

// The screen rectangle of one character inside rendered text.
function rangeRect(root, index) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let seen = 0, node;
  while ((node = walker.nextNode())) {
    const len = node.textContent.length;
    if (seen + len > index) {
      const range = document.createRange();
      const start = index - seen;
      range.setStart(node, start);
      range.setEnd(node, Math.min(len, start + 1));
      const rect = range.getBoundingClientRect();
      return rect && rect.height ? rect : null;
    }
    seen += len;
  }
  return null;
}

// Put the reading view back where the editing was left off.
function scrollToMark(mark) {
  const para = main.querySelector('.index-card-body p');
  if (!para || !mark) return;
  const text = para.textContent;
  const box = para.getBoundingClientRect();
  const at = nearestIndex(text, mark.words, Math.round(text.length * mark.fraction));
  const rect = at === -1 ? null : rangeRect(para, at);
  const y = rect
    ? rect.top - main.getBoundingClientRect().top
    : box.top - main.getBoundingClientRect().top + box.height * mark.fraction;
  main.scrollTop = Math.max(0, main.scrollTop + y - STICKY_ROOM);
}

// Room to leave under the sticky bar when scrolling something into view.
const STICKY_ROOM = 78;

// Where a character sits inside the textarea, measured by laying the same text
// out in a hidden copy of it. A textarea gives no way to ask directly, and the
// answer is what keeps the edit view lined up with what was just being read.
function withTextMirror(el, fn) {
  const cs = getComputedStyle(el);
  const mirror = document.createElement('div');
  ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 'lineHeight',
   'textTransform', 'wordSpacing', 'textIndent', 'paddingTop', 'paddingRight',
   'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth',
   'borderBottomWidth', 'borderLeftWidth'].forEach(prop => { mirror.style[prop] = cs[prop]; });
  mirror.style.boxSizing = 'border-box';
  mirror.style.width = el.offsetWidth + 'px';
  mirror.style.position = 'absolute';
  mirror.style.top = '0';
  mirror.style.left = '-9999px';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.overflowWrap = 'break-word';
  const text = document.createTextNode('');
  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  mirror.appendChild(text);
  mirror.appendChild(marker);
  document.body.appendChild(mirror);
  try {
    return fn(offset => {
      text.nodeValue = el.value.slice(0, offset);
      return marker.getBoundingClientRect().top - mirror.getBoundingClientRect().top;
    });
  } finally {
    mirror.remove();
  }
}

// The last character that still sits at or above y pixels down the textarea.
function offsetAtTop(el, y) {
  return withTextMirror(el, topOf => {
    let lo = 0, hi = el.value.length;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      if (topOf(mid) <= y) lo = mid; else hi = mid - 1;
    }
    return lo;
  });
}

function lineStart(value, offset) {
  return value.lastIndexOf('\n', Math.max(0, offset - 1)) + 1;
}

function caretFromPoint(x, y) {
  let spot = null;
  if (document.caretRangeFromPoint) {
    const range = document.caretRangeFromPoint(x, y);
    if (range) spot = { node: range.startContainer, offset: range.startOffset };
  } else if (document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(x, y);
    if (pos) spot = { node: pos.offsetNode, offset: pos.offset };
  }
  if (!spot) return null;
  if (spot.node.nodeType !== 3) {
    // Some browsers answer with the containing element; step into its text.
    const child = spot.node.childNodes && spot.node.childNodes[spot.offset];
    if (!child || child.nodeType !== 3) return null;
    spot = { node: child, offset: 0 };
  }
  return spot;
}

// Which part of the note is at the top of the screen while reading, as an
// offset into the stored text. Read by taking the words showing at the top edge
// and finding them in the source; the rendered text drops the link markup, so
// matching words is more reliable than counting characters. Falls back to how
// far down the article the scroll has reached.
function readingOffset(t) {
  const para = main.querySelector('.index-card-body p');
  if (!para) return null;
  const box = para.getBoundingClientRect();
  const edge = main.getBoundingClientRect().top + STICKY_ROOM;
  if (box.bottom <= edge) return t.content.length;
  const y = Math.max(edge, box.top + 2);
  const seen = Math.min(1, Math.max(0, (edge - box.top) / Math.max(1, box.height)));
  const estimate = Math.round(t.content.length * seen);
  const spot = caretFromPoint(box.left + 6, y);
  if (spot) {
    const rest = spot.node.textContent.slice(spot.offset);
    const lead = rest.search(/\S/);
    if (lead !== -1) {
      const snippet = rest.slice(lead, lead + 48);
      if (snippet.length >= 10) {
        const at = nearestIndex(t.content, snippet, estimate);
        if (at !== -1) return at;
      }
    }
  }
  return estimate;
}

// How far down the reading area a character currently sits.
function caretScreenY(el, offset) {
  return el.getBoundingClientRect().top - main.getBoundingClientRect().top
       + withTextMirror(el, topOf => topOf(offset));
}

// Bring a character into view, by default only when it is off screen or hidden
// under the sticky bar — scrolling on every insert would yank the page about.
function scrollCaretIntoView(el, offset, always) {
  const y = caretScreenY(el, offset);
  if (always || y < STICKY_ROOM || y > main.clientHeight - 40) {
    main.scrollTop = Math.max(0, main.scrollTop + y - STICKY_ROOM);
  }
}

// Put the cursor at a character and scroll it to just under the sticky bar.
function placeCaretInView(el, offset) {
  const at = Math.max(0, Math.min(offset, el.value.length));
  el.focus({ preventScroll: true });       // focusing normally jumps to the end
  el.setSelectionRange(at, at);
  el.dispatchEvent(new Event('select'));   // tells the link picker where we are
  scrollCaretIntoView(el, at, true);
}

// Inserting a link into the body text, as opposed to relating two notes.
// The markup written here is what renderBodyHtml() turns back into a clickable
// link, so the label must stay on one line and free of square brackets.
// A keyboard hint is noise on a phone, where there is no modifier key to press.
const LINK_SHORTCUT = window.matchMedia('(hover: hover) and (pointer: fine)').matches
  ? (/Mac/.test(navigator.platform || '') ? '⌘K · ' : 'Ctrl+K · ')
  : '+ ';

function noteLabel(t) {
  return t.title || t.content.replace(/\s+/g, ' ').trim().slice(0, 70);
}

function setupBodyLinkPicker(current, bodyEl, autoGrow) {
  const toggle = document.getElementById('editLinkToggle');
  const picker = document.getElementById('editLinkPicker');
  const input = document.getElementById('editLinkInput');
  const results = document.getElementById('editLinkResults');
  if (!toggle) return;

  // Opening the picker moves focus off the textarea, which drops the caret and
  // any selection, so remember where they were while the textarea still has it.
  let caretStart = bodyEl.value.length, caretEnd = bodyEl.value.length;
  let aimed = false;      // has the cursor been put anywhere meaningful yet?
  let ownLine = false;    // insert the link as a line of its own
  function remember() {
    caretStart = bodyEl.selectionStart;
    caretEnd = bodyEl.selectionEnd;
  }
  ['keyup', 'mouseup', 'input', 'select', 'touchend'].forEach(e =>
    bodyEl.addEventListener(e, () => { remember(); aimed = true; }));
  bodyEl.addEventListener('blur', remember);

  function insert(note) {
    const selected = bodyEl.value.slice(caretStart, caretEnd).replace(/\s+/g, ' ').trim();
    const label = (selected || noteLabel(note)).replace(/[\[\]]/g, '').slice(0, 200);
    const markup = '[' + label + '](thought:' + note.id + ')' + (ownLine && !selected ? '\n' : '');
    bodyEl.value = bodyEl.value.slice(0, caretStart) + markup + bodyEl.value.slice(caretEnd);
    close();
    const caret = caretStart + markup.length;
    // preventScroll matters: assigning value put the cursor at the very end, so
    // a plain focus() would scroll to the bottom of the article.
    bodyEl.focus({ preventScroll: true });
    bodyEl.setSelectionRange(caret, caret);
    remember();
    aimed = true;
    ownLine = false;
    autoGrow();
    scrollCaretIntoView(bodyEl, caret, false);
  }

  function render(query) {
    const q = query.trim();
    const matches = (q ? localSearch(q) : allThoughts)
      .filter(o => o.id !== current.id)
      .slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map(o => '<button class="link-picker-item" data-id="' + escapeAttr(o.id) +
          '" type="button">' + escapeHtml(noteLabel(o)) + '</button>').join('')
      : '<span class="field-value empty" style="padding:6px 8px;display:block;">No matches.</span>';
    results.querySelectorAll('.link-picker-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const note = findThought(btn.getAttribute('data-id'));
        if (note) insert(note);
      });
    });
    return matches;
  }

  function open() {
    if (document.activeElement === bodyEl) { remember(); aimed = true; }
    // Nothing has been pointed at, so aim at the first line on screen — with a
    // long article scrolled halfway down, appending to the end would put the
    // link somewhere the reader cannot see.
    ownLine = !aimed;
    if (!aimed) {
      const y = Math.max(0, main.getBoundingClientRect().top + STICKY_ROOM
                            - bodyEl.getBoundingClientRect().top);
      caretStart = caretEnd = lineStart(bodyEl.value, offsetAtTop(bodyEl, y));
    }
    picker.hidden = false;
    input.value = '';
    render('');
    input.focus();
  }
  function close() {
    picker.hidden = true;
    results.innerHTML = '';
  }

  toggle.addEventListener('click', () => { picker.hidden ? open() : close(); });

  bodyEl.addEventListener('keydown', ev => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') {
      ev.preventDefault();
      remember();
      open();
    }
  });

  input.addEventListener('input', () => render(input.value));
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { close(); bodyEl.focus(); }
    if (ev.key === 'Enter') {
      ev.preventDefault();
      const first = results.querySelector('.link-picker-item');
      if (first) first.click();
    }
  });
}

      </div>

        <div class="edit-body-sticky">

            <div class="bar-actions">
              <button class="link-add-toggle top-btn" type="button">↑ Top</button>
              <button class="link-add-toggle" id="editLinkToggle" type="button">${LINK_SHORTCUT}Link to a note</button>
            </div>

  `;

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back to drawer';
  back.addEventListener('click', () => { editingId = null; app.classList.remove('detail-open'); });
  main.prepend(back);
  app.classList.add('detail-open');

  // Two identical action bars, top and bottom; every handler drives both so
  // they never disagree about whether a save is in flight.
  const cancelBtns = Array.from(main.querySelectorAll('.edit-cancel'));
  const saveBtns = Array.from(main.querySelectorAll('.edit-save'));
  const statusEls = Array.from(main.querySelectorAll('.edit-status'));
  const bodyEl = document.getElementById('editContent');

  function setStatus(message, colour) {
    statusEls.forEach(el => { el.textContent = message; el.style.color = colour; });
  }
  function setBusy(busy) {
    saveBtns.forEach(b => { b.disabled = busy; b.textContent = busy ? 'Saving…' : 'Save changes'; });
    cancelBtns.forEach(b => { b.disabled = busy; });
  }

  function autoGrow() {
    // Collapsing the box to measure it momentarily shortens the page, and the
    // browser clamps the scroll to the shorter page — which is why editing a
    // long article used to jump back towards the top. Put the scroll back.
    const keep = main.scrollTop;
    bodyEl.style.height = 'auto';
    bodyEl.style.height = (bodyEl.scrollHeight + 2) + 'px';
    if (main.scrollTop !== keep) main.scrollTop = keep;
  }
  bodyEl.addEventListener('input', autoGrow);

  // Tag suggestions on the edit panel. The field itself stays a plain
  // comma-separated list — the save path reads it unchanged — but retyping a
  // tag from memory is how "Workflow" and "workflow" became two tags, so offer
  // the ones already in use rather than trusting recall.
  (function wireEditTagSuggestions() {
    const field = document.getElementById('editTags');
    const adder = document.getElementById('editTagAdd');
    const options = document.getElementById('editTagOptions');
    const common = document.getElementById('editTagCommon');
    if (!field || !adder || !options || !common) return;

    const current = () => field.value.split(',').map(x => x.trim()).filter(Boolean);

    function append(tag) {
      const clean = (tag || '').trim().replace(/,+$/, '').trim();
      if (!clean) return;
      const have = current();
      if (have.some(x => x.toLowerCase() === clean.toLowerCase())) return;  // same tag, different case
      field.value = have.concat(clean).join(', ');
      paint();
    }

    // Most-used first: the vocabulary's preferred tags rise to the top on their
    // own, without this file needing its own copy of topics.txt to drift from.
    const counts = Array.from(topicCounts().values())
      .sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));

    options.innerHTML = counts.map(c =>
      '<option value="' + escapeAttr(c.label) + '">' + c.n + ' note' + (c.n === 1 ? '' : 's') + '</option>').join('');

    function paint() {
      const have = current().map(x => x.toLowerCase());
      common.innerHTML = counts.slice(0, 14).map(c =>
        '<button type="button" data-tag="' + escapeAttr(c.label) + '"' +
        (have.indexOf(c.label.toLowerCase()) === -1 ? '' : ' disabled') + '>' +
        escapeHtml(c.label) + '</button>').join('');
    }
    paint();

    common.addEventListener('click', ev => {
      const btn = ev.target.closest('button[data-tag]');
      if (btn && !btn.disabled) append(btn.dataset.tag);
    });
    adder.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' && ev.key !== ',') return;
      ev.preventDefault();
      append(adder.value);
      adder.value = '';
    });
    // Picking from the browser's datalist fires input, not keydown.
    adder.addEventListener('input', () => {
      if (counts.some(c => c.label === adder.value)) { append(adder.value); adder.value = ''; }
    });
    field.addEventListener('input', paint);
  })();
  autoGrow();
  setupBodyLinkPicker(t, bodyEl, autoGrow);
  wireTopButtons();
  if (anchorOffset != null) {
    // After layout, or the textarea has not grown to its full height yet.
    requestAnimationFrame(() => placeCaretInView(bodyEl, anchorOffset));
  }

  // Whatever form the date was typed in, show it back as dd/mm/yyyy — and say
  // so plainly when it could not be read, rather than quietly dropping it.
  const publishedEl = document.getElementById('editPublished');
  publishedEl.addEventListener('blur', () => {
    const iso = parseDateInput(publishedEl.value);
    if (iso === null) {
      publishedEl.style.borderColor = 'var(--rust)';
      setStatus('Date not recognised — try 01/08/1974, 1 Aug 1974 or 1974-08-01.', 'var(--rust)');
      return;
    }
    publishedEl.style.borderColor = '';
    publishedEl.value = formatDateInput(iso);
    if (statusEls[0].textContent.startsWith('Date not recognised')) setStatus('', '');
  });

  cancelBtns.forEach(b => b.addEventListener('click', () => {
    const mark = readingMark(bodyEl);
    editingId = null;
    selectThought(t, mark);
  }));

  saveBtns.forEach(b => b.addEventListener('click', save));

  async function save() {
    const newContent = document.getElementById('editContent').value.trim();
    if (!newContent) {
      setStatus('Content cannot be empty.', 'var(--rust)');
      return;
    }
    const newTitle = document.getElementById('editTitle').value.trim();
    const newAuthor = document.getElementById('editAuthor').value.trim();
    const newPublished = parseDateInput(document.getElementById('editPublished').value);
    if (newPublished === null) {
      setStatus('Date not recognised — try 01/08/1974, 1 Aug 1974 or 1974-08-01.', 'var(--rust)');
      document.getElementById('editPublished').focus();
      return;
    }
    const newSource = document.getElementById('editSource').value.trim();
    const newTags = document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(Boolean);
    const newUrl = document.getElementById('editUrl').value.trim();

    // Read the position before the save: the card is rebuilt afterwards.
    const mark = readingMark(bodyEl);
    setBusy(true);
    setStatus('Saving changes…', 'var(--ink-faint)');

    const args = {
      id: t.id,
      title: newTitle || null,
      author: newAuthor || null,
      published_date: newPublished || null,
      source_name: newSource || null,
      source_url: newUrl || null,
      topics: newTags,
    };
    if (newContent !== t.content) args.content = newContent;

    // Stamp the note as revised, but only if this edit really changed
    // something — opening the editor and saving out of habit is not a revision,
    // and neither is a housekeeping script tidying tags.
    const unchanged =
      newTitle === (t.title || '') &&
      newAuthor === (t.author || '') &&
      newPublished === (t.published_date || '') &&
      newSource === (t.source || '') &&
      newUrl === (t.source_url || '') &&
      newContent === t.content &&
      newTags.join('\u0000') === t.topics.join('\u0000');
    if (!unchanged) args.updated_date = todayISO();

    try {
      await callTool('update_thought', args);
      editingId = null;
      await refreshAndReselect(t.id, mark);
    } catch (err) {
      setBusy(false);
      setStatus('Could not save — ' + err.message, 'var(--rust)');
    }
  }
}

function showComposer(prefill, parentId) {
  selectedIndex = null;
  editingId = null;
  closeReference();
  renderList(displayed, searchMode);
  main.innerHTML = `
    <div class="index-card">
      <div class="index-card-ribbon" style="background:var(--brass)"></div>
      <div class="index-card-head">
        <span class="index-card-type" style="color:var(--brass)">New thought${parentId ? ' · linked' : ''}</span>
      </div>
      <div class="index-card-body">
        <textarea class="compose-textarea" id="composeText" placeholder="Write a clear, standalone thought — it'll be auto-tagged when saved…">${escapeHtml(prefill || '')}</textarea>
      </div>
      <div class="index-card-foot compose-actions">
        <span class="compose-status" id="composeStatus"></span>
        <button class="compose-cancel" id="composeCancel" type="button">Cancel</button>
        <button class="compose-save" id="composeSave" type="button">Save to archive</button>
      </div>
    </div>
  `;
  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back to drawer';
  back.addEventListener('click', () => app.classList.remove('detail-open'));
  main.prepend(back);
  app.classList.add('detail-open');

  const textEl = document.getElementById('composeText');
  const statusEl = document.getElementById('composeStatus');
  const saveBtn = document.getElementById('composeSave');
  const cancelBtn = document.getElementById('composeCancel');

  textEl.focus();
  if (prefill) textEl.setSelectionRange(0, 0);

  cancelBtn.addEventListener('click', showEmptyState);

  async function submit() {
    const content = textEl.value.trim();
    if (!content) {
      statusEl.textContent = 'Write something first.';
      statusEl.style.color = 'var(--rust)';
      return;
    }
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    statusEl.style.color = 'var(--ink-faint)';
    statusEl.textContent = parentId ? 'Sending to the archive and linking back…' : 'Sending to the archive…';
    try {
      // Written here, now, by you — all three are facts, so they are stated
      // rather than left to the extractor to infer from the prose. Imported
      // files go the other way: their own byline and date are detected.
      const args = { content, author: SELF_AUTHOR, published_date: todayISO() };
      if (parentId) args.parent_thought_id = parentId;
      const res = await callTool('capture_thought', args);
      // The id is needed to offer the tag step. The extractor reads the text
      // with no idea what this archive collects, so on an unfamiliar subject it
      // reaches for the nearest tag it knows — a note about light waves came
      // back tagged "AI". Confirming while the note is still in mind is the
      // cheapest place to correct it.
      const saved = /id: ([0-9a-f-]{36})/.exec(res);
      statusEl.style.color = 'var(--moss)';
      statusEl.textContent = 'Saved.';
      setTimeout(async () => {
        showEmptyState();
        if (parentId) { await loadAll(); const found = findThought(parentId); if (found) selectThought(found); }
        else { await loadAll(); }
        if (saved) await confirmTags(saved[1]);
      }, 500);
    } catch (err) {
      // An unreachable archive is not a lost note. Hold it and say so — the
      // composer closes exactly as it does on a real save, because being made
      // to sit and stare at a failed textarea is the thing this replaces.
      if (err.unreachable) {
        const held = outboxAdd({ content, author: SELF_AUTHOR, published_date: todayISO(),
                                 parent_thought_id: parentId });
        if (held) {
          statusEl.style.color = 'var(--brass)';
          statusEl.textContent = 'No connection — held on this device. It will be sent when the archive is reachable again.';
          // Long enough to read, and checked on the way out: if you have
          // started another note in the meantime this is a different textarea,
          // and clearing it would throw away what you have just typed.
          setTimeout(() => {
            if (document.getElementById('composeText') === textEl) showEmptyState();
          }, 1400);
          return;
        }
        // Storage refused it, so there is nowhere to put the note but the
        // textarea it is already in. Leave it there and say why.
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.textContent = 'Save to archive';
        statusEl.style.color = 'var(--rust)';
        statusEl.textContent = 'No connection, and this device has no room to hold the note. Copy it somewhere before leaving this page.';
        return;
      }
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      saveBtn.textContent = 'Save to archive';
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Could not save — ' + err.message;
    }
  }

  saveBtn.addEventListener('click', submit);
  textEl.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
  });
}

function showStatus(msg, isError, retryFn) {
  listScroll.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'list-status';
  el.style.color = isError ? 'var(--rust)' : 'var(--ink-faint)';
  el.textContent = msg;
  if (retryFn) {
    const btn = document.createElement('button');
    btn.className = 'retry';
    btn.textContent = 'Try again';
    btn.addEventListener('click', retryFn);
    el.appendChild(document.createElement('br'));
    el.appendChild(btn);

async function loadAll() {
  searchMode = false;
  lastSearchQuery = '';
  searchInput.value = '';
  searchClear.style.display = 'none';
  showStatus('Opening the drawer…', false);
  try {
    const text = await callTool('list_thoughts', { limit: 100, format: 'json' });
    allThoughts = parseJsonThoughts(text);
    activeTypes = new Set();
    activeTopics = new Set();
    activeAuthors = new Set();
    activeSources = new Set();
    activePeople = new Set();
    applyFilters();
  } catch (err) {
    showStatus('Could not reach the archive — ' + err.message, true, loadAll);
  }
}

// Everything worth matching on, flattened once per note and cached: the words
// people actually search for live in tags, authors and sources as often as in
// the text.
function searchableText(t) {
  if (t._haystack === undefined) {
    t._haystack = [
      t.title || '', t.content || '', t.author || '', t.source || '',
      (t.topics || []).join(' '), (t.people || []).join(' '),
      t.source_url || ''
    ].join(' ').toLowerCase().replace(/[^a-z0-9]+/g, ' ');
  }
  return t._haystack;
}

// Word-based, punctuation-blind: "burn tokens" finds "token burn", and
// "4question" finds "4-Question". Every word must appear somewhere.
function localSearch(query) {
  const flat = query.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const words = flat.split(' ').filter(Boolean);
  if (!words.length) return [];
  const squashed = flat.replace(/ /g, '');
  // "tokens" should find "token burn"; a bare substring test misses the plural.
  const present = (hay, w) =>
    hay.indexOf(w) !== -1 || (w.length > 3 && w.slice(-1) === 's' && hay.indexOf(w.slice(0, -1)) !== -1);
  return allThoughts.filter(t => {
    const hay = searchableText(t);
    return words.every(w => present(hay, w)) ||
           hay.replace(/ /g, '').indexOf(squashed) !== -1;
  }).sort((a, b) => {
    // A note *about* the thing beats one that mentions it in passing.
    const at = (a.title || '').toLowerCase(), bt = (b.title || '').toLowerCase();
    const aHit = words.every(w => present(at, w)) ? 0 : 1;
    const bHit = words.every(w => present(bt, w)) ? 0 : 1;
    return aHit - bHit;
  });
}

// Instant: match what is already loaded, with no round trip.
function runLocalSearch(query) {
  if (!query.trim()) { loadAll(); return; }
  searchMode = true;
  lastSearchQuery = query;
  searchClear.style.display = 'block';
  displayed.baseResults = localSearch(query);
  applyFilters();
}

async function runSearch(query) {
  if (!query.trim()) { loadAll(); return; }
  searchMode = true;
  lastSearchQuery = query;
  searchClear.style.display = 'block';
  const local = localSearch(query);
  if (local.length) {
    displayed.baseResults = local;
    applyFilters();
  } else {
    showStatus('Searching the archive for "' + query + '"…', false);
  }
  try {
    const text = await callTool('search_thoughts', { query, limit: 50, format: 'json' });
    const semantic = parseJsonThoughts(text);
    // Literal matches first — they are what the typist meant — then anything
    // the archive found by meaning that the words alone would have missed.
    const seen = new Set(local.map(t => t.id));
    const results = local.concat(semantic.filter(t => !seen.has(t.id)));
    displayed.baseResults = results;
    activeTypes = new Set();
    activeTopics = new Set();
    activeAuthors = new Set();
    activeSources = new Set();
    activePeople = new Set();
    applyFilters();
  } catch (err) {
    showStatus('Search failed — ' + err.message, true, () => runSearch(query));
  }
}

// ---------- import: drag a file onto the catalog ----------
// PDFs are read here in the browser. That keeps the archive server out of it
// entirely: no upload, no file-size ceiling, no extra credential.

let pdfLibPromise = null;
function loadPdfLib() {
  if (!pdfLibPromise) {
    pdfLibPromise = new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = 'pdf.min.js';
      tag.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
        resolve(window.pdfjsLib);
      };
      tag.onerror = () => reject(new Error('Could not load the PDF reader.'));
      document.head.appendChild(tag);
    });
  }
  return pdfLibPromise;
}

// Rebuild a PDF's hyperlinks as markdown.
//
// pdf.js keeps text and links apart: getTextContent() has no URLs, and
// getAnnotations() has URLs with page coordinates but no text. The two are
// matched by position — but a link often covers only part of a text run
// ("Open Brain" inside "Open Brain from the earlier guide"), so the run is
// split by the proportion of its width the link rectangle covers.
async function pdfToMarkdown(file) {
  const lib = await loadPdfLib();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];

  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    const anns = (await page.getAnnotations())
      .filter(a => a.url)
      .map(a => ({
        url: a.url,
        x1: Math.min(a.rect[0], a.rect[2]), x2: Math.max(a.rect[0], a.rect[2]),
        y1: Math.min(a.rect[1], a.rect[3]), y2: Math.max(a.rect[1], a.rect[3])
      }));

    const segment = (item) => {
      const str = item.str;
      const x = item.transform[4], y = item.transform[5], w = item.width || 0;
      if (!str || !w) return [{ str: str, url: null }];
      const hit = anns.find(a => y >= a.y1 - 2 && y <= a.y2 + 2 && a.x1 < x + w && a.x2 > x);
      if (!hit) return [{ str: str, url: null }];
      const a = Math.round(Math.max(0, (hit.x1 - x) / w) * str.length);
      const b = Math.round(Math.min(1, (hit.x2 - x) / w) * str.length);
      if (b <= a) return [{ str: str, url: null }];
      const out = [];
      if (a > 0) out.push({ str: str.slice(0, a), url: null });
      out.push({ str: str.slice(a, b), url: hit.url });
      if (b < str.length) out.push({ str: str.slice(b), url: null });
      return out;
    };

    let lastY = null, line = [], lines = [];
    const flush = () => {
      if (!line.length) return;
      let text = '', runUrl = null, run = '';
      for (const piece of line) {
        if (piece.url !== runUrl) {
          if (runUrl && run.trim()) text += '[' + run.trim() + '](' + runUrl + ')';
          else text += run;
          run = '';
          runUrl = piece.url;
        }
        run += piece.str;
      }
      if (runUrl && run.trim()) text += '[' + run.trim() + '](' + runUrl + ')';
      else text += run;
      lines.push(text);
      line = [];
    };

    for (const item of content.items) {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) flush();
      segment(item).forEach(seg => line.push(seg));
      lastY = y;
    }
    flush();
    pages.push(lines.join('\n'));
  }
  return pages.join('\n\n');
}

// The same link rules fix-links.py applies, minus the parts that need the
// network. Boilerplate and promo links go; a link to an article already in the
// archive becomes an in-brain link. Links to articles not held yet are left
// alone — creating those needs to fetch the page, which the browser cannot do
// across origins, so fix-links.py picks them up on its next run.
const IMPORT_DROP_ANCHOR = [
  /^nate$/i,
  /learn about all my substack tiers here/i,
  /grab my prompt tool here/i
];
const IMPORT_DROP_HOST = [
  'unlock-ai.natebjones.com', 'www.heypresto.ai', 'heypresto.ai', 'talent.natebjones.com',
  // Community invites are newsletter furniture, not part of the article.
  'join.slack.com', 'discord.gg'
];
const IMPORT_DROP_URL = [
  'https://substack.com/@natesnewsletter',
  'https://nateszerotoai.substack.com/',
  'https://cursor.com/pricing'
];

function applyImportLinkRules(text) {
  const byUrl = {};
  allThoughts.forEach(t => {
    const u = t.source_url;
    if (u) {
      const n = u.trim().replace(/[.,;:!?]+$/, '').replace(/^http:\/\//, 'https://');
      if (!byUrl[n]) byUrl[n] = t.id;
    }
  });

  const linked = new Set();
  const pending = [];
  const seenPending = new Set();
  const out = text.replace(/\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g, (whole, anchor, url) => {
    const n = url.trim().replace(/[.,;:!?]+$/, '').replace(/^http:\/\//, 'https://');
    const host = n.replace(/^https?:\/\//, '').split('/')[0];
    if (IMPORT_DROP_ANCHOR.some(re => re.test(anchor.trim())) ||
        IMPORT_DROP_URL.indexOf(n) !== -1 || IMPORT_DROP_HOST.indexOf(host) !== -1) {
      return '';
    }
    const id = byUrl[n];
    if (id) {
      linked.add(id);
      return '[' + anchor + '](thought:' + id + ')';
    }
    // An article from a publication we archive, that we do not hold yet.
    const suppressed = IMPORT_NO_CAPTURE.some(p => n.toLowerCase().indexOf(p) !== -1);
    if (IMPORT_CAPTURE_HOST.indexOf(host) !== -1 && !suppressed && !seenPending.has(n)) {
      seenPending.add(n);
      pending.push({ url: n, anchor: anchor.trim() });
    }
    return whole;
  });

  return { text: out, linked: Array.from(linked), pending: pending };
}

// A PDF hard-wraps at the column, so most "lines" are sentence fragments and
// have to be rejoined or the note reads as stumps. Newsletter furniture (the
// byline, subscribe pitches, page numbers) is dropped outright.
function cleanImportedText(raw) {
  const DROP = [
    /^watch now$/i, /^nate$/i, /^subscribed?$/i, /^share$/i, /^leave a comment$/i,
    /^\d{1,3}$/,
    /^[A-Z]{3}\s+\d{1,2},\s*\d{4}\b.*$/,
    /^i make this substack thanks to readers/i,
    /learn about all my substack tiers here/i,
    /grab my prompt tool here/i,
    /^upgrade to paid$/i, /^subscribe$/i
  ];

  const lines = raw
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ' ')
    .split('\n')
    .map(l => l.replace(/[ \t]+/g, ' ').trim())
    .filter(l => !DROP.some(re => re.test(l)));

  // Work out the column width this file wrapped at: a line close to that width
  // ran out of room and continues on the next, whatever it starts with. A
  // markedly shorter line genuinely ended a paragraph, or is a heading.
  const lengths = lines.filter(Boolean).map(l => l.length).sort((a, b) => a - b);
  const column = lengths.length ? lengths[Math.floor(lengths.length * 0.9)] : 80;
  const wrapAt = column * 0.72;

  const out = [];
  let joinNext = false;
  for (const line of lines) {
    if (!line) {
      if (out.length && out[out.length - 1] !== '') out.push('');
      joinNext = false;
      continue;
    }
    const prev = out.length ? out[out.length - 1] : '';
    const continues = joinNext ||
      (prev && /^[a-z0-9(“"'—–-]/.test(line) && !/[.!?:;”"’)]$/.test(prev));
    if (continues && prev) out[out.length - 1] = prev + ' ' + line;
    else out.push(line);
    joinNext = line.length >= wrapAt;
  }

  let text = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  const firstBreak = text.indexOf('\n');
  const first = firstBreak === -1 ? text : text.slice(0, firstBreak);
  if (first && first.length < 200 && first[0] !== '#') text = '# ' + text;
  return text;
}

// The byline and date are stripped as boilerplate before the note is saved —
// they are furniture when reading — but they are also the only author and date
// the file carries. So they are read out first and applied to the saved note.
const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6,
                 JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };

function detectArticleMeta(raw) {
  const found = {};
  const pad = (n) => String(n).padStart(2, '0');

  const date = raw.match(/\b([A-Z]{3})\s+(\d{1,2}),\s*(\d{4})\b/);
  if (date && MONTHS[date[1]]) {
    found.published_date = date[3] + '-' + pad(MONTHS[date[1]]) + '-' + pad(date[2]);
  }

  // A short all-caps line sitting directly above that date is the byline. By
  // this point it may already be a markdown link, so allow the brackets.
  const byline = raw.match(
    /(?:^|\n)[ \t]*\[?([A-Z][A-Z .'’-]{1,28}?)\]?(?:\([^)]*\))?[ \t]*\n[^\n]{0,40}[A-Z]{3}\s+\d{1,2},\s*\d{4}/);
  if (byline) {
    found.author = byline[1].trim().replace(/\s+/g, ' ').toLowerCase()
      .replace(/\b\w/g, c => c.toUpperCase());   // the server expands known short names
  }

  if (/natesnewsletter\.substack\.com/.test(raw)) found.source_name = "Nate B. Jones Substack";
  else if (/nateszerotoai\.substack\.com/.test(raw)) found.source_name = "Zero to AI";
  return found;
}

// Fill only what is missing: never overwrite something already recorded.
async function applyDetectedMeta(id, existing) {
  const args = { id: id };
  const map = { published_date: 'published_date', author: 'author', source_name: 'source' };
  Object.keys(map).forEach(key => {
    const already = existing ? existing[map[key]] : null;
    if (importMeta[key] && !already) args[key] = importMeta[key];
  });
  if (Object.keys(args).length > 1) {
    try { await callTool('update_thought', args); } catch (err) { /* the note is saved regardless */ }
  }
}

async function recordImportLinks(id) {

// Hosts whose articles belong in the archive. A link to one of these that we
// do not hold yet gets a placeholder note, so the reference points somewhere
// real straight away and can be completed later by importing the original.
// Articles that should never become notes, however often they are referenced —
// a paywall tier you do not have. Kept in step with no-capture.txt.
const IMPORT_NO_CAPTURE = [
  'executive-briefing', 'beyond-model-routing',
  'ai-token-cost-management', 'ai-agent-ownership',
];

const IMPORT_CAPTURE_HOST = [
  'natesnewsletter.substack.com', 'nateszerotoai.substack.com', 'promptkit.natebjones.com'
];

function placeholderContent(anchor, url) {
  // The anchor is often a fragment of the sentence that linked here ("here",
  // "in a post yesterday"), which makes a poor title. Fall back to the URL's
  // own slug when it does not look like a name.
  let label = (anchor || '').replace(/\s+/g, ' ').trim().replace(/[.,;:]+$/, '');
  const looksLikeFragment = label.length < 14 || /^[a-z]/.test(label);
  if (looksLikeFragment) {
    const slug = url.split('?')[0].replace(/\/$/, '').split('/').pop() || '';
    if (slug.length > 3) {
      label = slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }
  }
  const title = label || url;
  return '# ' + title + '\n\n' +
    'Referenced by another note, but not in the archive yet.\n\n' +
    '---\n\n' +
    '_Source: ' + url + ' — no text has been captured for this one yet. ' +
    'Import the original article to complete it. Paste the full text here to complete it._';
}

// Create a note for each referenced article we do not hold, then point the
// imported text at it. Returns what was made, so the user can be told.
async function createPlaceholders(text, pending) {
  const made = [];
  let out = text;
  for (const item of pending) {
    let id = null;
    try {
      const res = await callTool('capture_thought',
        { content: placeholderContent(item.anchor, item.url) });
      const m = /id: ([0-9a-f-]{36})/.exec(res);
      id = m && m[1];
      if (id) await callTool('update_thought', { id: id, source_url: item.url });
    } catch (err) {
      continue;                       // leave that link external if this fails
    }
    if (!id) continue;
    const escaped = item.url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp('\\]\\(' + escaped + '\\)', 'g'), '](thought:' + id + ')');
    made.push({ id: id, url: item.url,
               title: (item.anchor || item.url).replace(/[.,;:]+$/, '').slice(0, 70) });
    pendingLinks.push(id);
  }
  return { text: out, made: made };
}

// Same import flow from a button, because a phone cannot drag a file onto a page.
async function importFromFile(file) {
  if (!file) return;
  importPanel.hidden = false;
  importFileName.textContent = file.name;
  importText.value = '';
  updateImportCount();
  setImportStatus('Reading…');
  try {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    const raw = isPdf ? await pdfToMarkdown(file) : await file.text();
    importMeta = detectArticleMeta(raw);
    const ruled = applyImportLinkRules(raw);
    pendingLinks = ruled.linked;
    pendingPlaceholders = ruled.pending;
    importText.value = cleanImportedText(ruled.text);
    updateImportCount();
    const bits = [];
    if (pendingLinks.length) {
      bits.push(pendingLinks.length + (pendingLinks.length === 1 ? ' link' : ' links') +
                ' wired up to notes you already hold');
    }
    const metaBits = ['author', 'published_date', 'source_name'].filter(k => importMeta[k]);
    if (metaBits.length) {
      bits.push('picked up ' + metaBits.length + ' detail' + (metaBits.length === 1 ? '' : 's') +
                ' from the file (' + metaBits.join(', ').replace(/_/g, ' ') + ')');
    }
    if (pendingPlaceholders.length) {
      bits.push(pendingPlaceholders.length + ' referenced article' +
                (pendingPlaceholders.length === 1 ? '' : 's') +
                ' not in the archive — those links stay external');
    }
    const detail = bits.length
      ? ' ' + bits.join('; ').replace(/^./, c => c.toUpperCase()) + '.'
      : '';
    setImportStatus('Check it over, then save.' + detail);
  } catch (err) {
    setImportStatus('Could not read that file — ' + err.message, true);
  }
}
