<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Deck</title>
<meta name="description" content="An encrypted flashcard deck.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./cards.webmanifest">
<meta name="theme-color" content="#F3EEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12122A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="./cards-192.png">
<link rel="apple-touch-icon" href="./cards-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* The question side is cool petrol, the answer side warm sand. The flip is a
     change of temperature, so you can tell which face is up without reading it.
     Everything else stays quiet so those two do the talking. */
  :root {
    --ground:      #F3EEE7;
    --ground-2:    #FBF8F3;
    --front:       #2B2E6E;
    --front-ink:   #FBF3E4;
    --front-faint: #A3A6DE;
    --back:        #FFF8EC;
    --back-ink:    #23254A;
    --back-faint:  #A3967E;
    --ink:         #22244A;
    --ink-dim:     #575A7E;
    --ink-faint:   #8D8FAA;
    --hairline:    #E2DACE;
    --accent:      #E5603F;
    --on-accent:   #FFF8F1;
    --good:        #23896A;
    --good-soft:   #D7F0E6;
    --again:       #C2413A;
    --again-soft:  #F9DEDA;
    --shadow:      0 1px 2px rgba(43,46,110,.08), 0 10px 28px rgba(43,46,110,.12);

    --f-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --f-body:    "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --f-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:      #12122A;
      --ground-2:    #1B1B3B;
      --front:       #2D2F72;
      --front-ink:   #F3ECDD;
      --front-faint: #9C9FDA;
      --back:        #33283A;
      --back-ink:    #F6E9D5;
      --back-faint:  #B09C86;
      --ink:         #E6E6F5;
      --ink-dim:     #A2A3C6;
      --ink-faint:   #74769C;
      --hairline:    #2A2B4D;
      --accent:      #FF8A6B;
      --on-accent:   #2A0E06;
      --good:        #5ED1A5;
      --good-soft:   #12332A;
      --again:       #F37F75;
      --again-soft:  #3A1D20;
      --shadow:      0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:      #12122A;
    --ground-2:    #1B1B3B;
    --front:       #2D2F72;
    --front-ink:   #F3ECDD;
    --front-faint: #9C9FDA;
    --back:        #33283A;
    --back-ink:    #F6E9D5;
    --back-faint:  #B09C86;
    --ink:         #E6E6F5;
    --ink-dim:     #A2A3C6;
    --ink-faint:   #74769C;
    --hairline:    #2A2B4D;
    --accent:      #FF8A6B;
    --on-accent:   #2A0E06;
    --good:        #5ED1A5;
    --good-soft:   #12332A;
    --again:       #F37F75;
    --again-soft:  #3A1D20;
    --shadow:      0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  button, select, input { font-family: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 18px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .deck-name {
    font-family: var(--f-display);
    font-size: 17px; font-weight: 600; margin: 0;
    letter-spacing: -0.01em;
  }
  .deck-sub {
    display: block;
    font-family: var(--f-mono); font-size: 10.5px; font-weight: 400;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 3px;
  }
  .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: var(--ground-2); border: 1px solid var(--hairline); color: var(--ink-dim);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  /* ---------- which set of cards ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: none; border: 1px solid var(--hairline); color: var(--ink-dim);
    border-radius: 99px; padding: 6px 12px; font-size: 12.5px; line-height: 1.2;
    display: inline-flex; gap: 7px; align-items: baseline;
  }
  .chip small { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .chip:hover { color: var(--ink); border-color: var(--ink-faint); }
  .chip[aria-pressed="true"] { background: var(--front); border-color: var(--front); color: var(--front-ink); }
  .chip[aria-pressed="true"] small { color: var(--front-faint); }

  /* ---------- progress ---------- */
  .progress { display: flex; align-items: center; gap: 10px; }
  .track { flex: 1; height: 5px; background: var(--ground-2); border: 1px solid var(--hairline); border-radius: 99px; overflow: hidden; }
  .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .28s ease; }
  .count { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- the card ---------- */
  .stage { perspective: 1600px; display: flex; align-items: stretch; flex: 0 0 auto; }
  .card {
    position: relative; width: 100%; height: 60vh; min-height: 340px; max-height: 500px;
    border: none; padding: 0; background: none;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.3,1);
    text-align: left; display: block;
  }
  .card.flipped { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--front); color: var(--front-ink); border: none;
    border-radius: 14px; box-shadow: var(--shadow);
    padding: 48px 24px 44px;
    display: flex; flex-direction: column; justify-content: center;
    overflow-y: auto;
  }
  .face.back { transform: rotateY(180deg); background: var(--back); color: var(--back-ink); justify-content: flex-start; }

  .side-label {
    position: absolute; top: 16px; left: 24px; right: 24px;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; line-height: 1.45;
    text-transform: uppercase; color: var(--front-faint);
  }
  .face.back .side-label, .face.back .hint { color: var(--back-faint); }
  .q {
    font-family: var(--f-display); font-size: clamp(20px, 5.2vw, 26px);
    font-weight: 600; line-height: 1.28; letter-spacing: -0.015em;
    margin: 0; text-wrap: balance; color: var(--front-ink);
  }
  .starter {
    font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5;
    color: var(--front-faint); margin: 16px 0 0;
  }
  .starter:empty { display: none; }
  .a { font-size: clamp(15px, 3.8vw, 17px); line-height: 1.55; margin: 0; color: var(--back-ink); white-space: pre-line; }
  .a.long { font-size: clamp(13.5px, 3.5vw, 15.5px); line-height: 1.5; }
  .hint {
    position: absolute; bottom: 14px; left: 24px; right: 24px;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--front-faint); text-align: center;
  }

  /* ---------- grading ---------- */
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g-btn {
    border-radius: 10px; padding: 13px 12px; font-size: 14.5px; font-weight: 600;
    border: 1px solid transparent;
  }
  .g-again { background: var(--again-soft); color: var(--again); border-color: var(--again); }
  .g-good  { background: var(--good-soft);  color: var(--good);  border-color: var(--good); }
  .g-btn:hover { filter: brightness(.97); }

  .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 8px; }
  .nav-btn {
    background: none; border: 1px solid var(--hairline); color: var(--ink-dim);
    border-radius: 8px; padding: 9px 14px; font-size: 13px;
  }
  .nav-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-faint); }
  .nav-btn:disabled { opacity: .4; cursor: default; }

  /* ---------- round summary ---------- */
  .done { text-align: center; padding: 30px 20px; }
  .done h2 { font-family: var(--f-display); font-size: 24px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .done p { color: var(--ink-dim); margin: 0 0 20px; font-size: 15px; }
  .primary {
    background: var(--accent); color: var(--on-accent); border: none;
    border-radius: 10px; padding: 12px 22px; font-size: 14.5px; font-weight: 600;
  }
  .empty { color: var(--ink-dim); font-size: 14.5px; text-align: center; padding: 24px 0; }

  /* ---------- editor sheet ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--ground); z-index: 20;
    overflow-y: auto; padding: 18px 16px 40px;
  }
  .sheet[hidden] { display: none; }
  .sheet-inner { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { font-family: var(--f-display); font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .row {
    background: var(--ground-2); border: 1px solid var(--hairline);
    border-radius: 11px; padding: 12px 13px; display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 10px;
  }
  .row textarea, .row input, .row select {
    width: 100%; background: var(--ground); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 7px;
    padding: 9px 10px; font-size: 14px; line-height: 1.45;
  }
  .row textarea { resize: vertical; min-height: 46px; }
  .row textarea.q-in { font-family: var(--f-display); font-weight: 600; }
  .row .meta { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
  .row-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .del { background: none; border: none; color: var(--ink-faint); font-size: 12px; padding: 2px 4px; }
  .del:hover { color: var(--again); }

  .save-bar {
    position: sticky; bottom: 0; background: var(--ground);
    padding: 12px 0 4px; display: flex; gap: 10px; align-items: center;
    border-top: 1px solid var(--hairline);
  }
  .sync-note { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .06em; }

  [hidden] { display: none !important; }
  /* ---------- lock ---------- */
  .lock { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .lock h1 { font-family: var(--f-display); font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .lock p { margin: 0; color: var(--ink-dim); font-size: 14.5px; }
  .lock input[type=password] {
    width: 100%; background: var(--ground-2); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 9px; padding: 11px 12px; font-size: 16px;
  }
  .lock label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-dim); }
  .lock .err { color: var(--again); font-size: 13.5px; min-height: 1.3em; }
  .lock a { color: var(--ink-dim); font-size: 13px; }
  a.icon-btn { text-decoration: none; }

  /* ---------- full screen: a bigger card for the desktop ---------- */
  body.fs .wrap, body.fs .sheet-inner { max-width: 900px; }
  body.fs .card { height: 72vh; max-height: none; }

  /* ---------- the slide and timing line: readable at a glance ---------- */
  :root { --label: #F4C542; --label-back: #8A5B00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --label-back: #F0BE45; } }
  :root[data-theme="dark"] { --label-back: #F0BE45; }
  .face { padding-top: 66px; }
  .side-label { font-size: 13.5px; font-weight: 600; letter-spacing: .07em; line-height: 1.4; color: var(--label); }
  .face.back .side-label { color: var(--label-back); }

  /* ---------- walkthrough: one side, everything showing, one click a step ---------- */
  .card.walk { height: 72vh; max-height: 680px; }
  .card.walk .face { transform: none; background: var(--back); color: var(--back-ink); justify-content: flex-start; }
  .card.walk .side-label, .card.walk .hint { color: var(--label-back); }
  .card.walk .hint { color: var(--back-faint); }
  .walk-q {
    font-family: var(--f-display); font-size: clamp(16px, 3.6vw, 19px); font-weight: 600;
    line-height: 1.3; margin: 0 0 14px; color: var(--back-faint);
  }

  /* walkthrough: readable at a glance mid-presentation, but a whole step fits
     on screen without scrolling */
  .wrap:has(.card.walk) { max-width: 880px; }
  .card.walk { height: 78vh; max-height: none; }
  .card.walk .side-label { font-size: 14px; }
  .card.walk .walk-q { font-size: clamp(16px, 1.8vw, 19px); margin-bottom: 10px; }
  .card.walk .a { font-size: clamp(16px, 1.9vw, 20px); line-height: 1.45; }
  .card.walk .a.long { font-size: clamp(15px, 1.7vw, 18px); line-height: 1.42; }
</style>
</head>
<body>
<form class="lock" id="lock" autocomplete="off">
  <h1>Prep deck</h1>
  <p>This deck is encrypted. Enter the passphrase to open it.</p>
  <input type="password" id="pass" aria-label="Passphrase" placeholder="Passphrase" autofocus>
  <label><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button class="primary" type="submit" id="unlockBtn">Open</button>
  <span class="err" id="lockErr" role="alert"></span>
  <a href="./cards.html">&larr; Revision deck</a>
</form>
<div id="app" hidden>
<div class="wrap">
  <div class="top">
    <h1 class="deck-name" id="deckName">Prep deck
      <span class="deck-sub" id="deckSub">Locked</span>
    </h1>
    <div class="top-actions">
      <button class="icon-btn" id="orderBtn" type="button" title="Switch between running order and shuffled"></button>
      <button class="icon-btn" id="fsBtn" type="button" title="Full screen (F)" hidden>Full screen</button>
      <button class="icon-btn" id="editBtn" type="button">Cards</button>
      <a class="icon-btn" href="./cards.html" title="Back to the revision deck">Revision</a>
    </div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Card set"></div>

  <div class="progress">
    <span class="track"><span class="fill" id="fill" style="width:0%"></span></span>
    <span class="count" id="count">0 / 0</span>
  </div>

  <div class="stage" id="stage"></div>

  <div class="grade" id="grade" hidden>
    <button class="g-btn g-again" id="againBtn" type="button">Again</button>
    <button class="g-btn g-good" id="goodBtn" type="button">Got it</button>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" type="button">&larr; Back</button>
    <span class="count" id="roundNote"></span>
    <button class="nav-btn" id="skipBtn" type="button">Skip &rarr;</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2>Your cards</h2>
      <button class="icon-btn" id="closeSheet" type="button">Done</button>
    </div>
    <div id="rows"></div>
    <button class="icon-btn" id="addBtn" type="button">+ Add a card</button>
    <div class="save-bar">
      <button class="primary" id="saveBtn" type="button">Save</button>
      <span class="sync-note" id="syncNote"></span>
    </div>
  </div>
</div>

<script>
function runDeck(embedded) {
  "use strict";

  const LS_DECK = "prep.deck.v2";
  const LS_VIEW = "prep.view.v2";
  const $ = (id) => document.getElementById(id);
  const GROUPS = [
    { key: "speech", label: "Speech" },
    { key: "qa",     label: "Q&A" },
    { key: "plan",   label: "Plan" },
    { key: "walk",   label: "Walkthrough" },
    { key: "all",    label: "All" }
  ];

  // ---------- deck: the published copy, plus any unsaved local edits ----------

  // A hash of the whole published deck, so any republished wording change
  // discards a stale local copy. (Comparing text lengths missed edits.)
  const stamp = (cards) => {
    const s = JSON.stringify(cards);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return "h" + cards.length + ":" + h;
  };

  let deck = embedded;
  let dirty = false;
  try {
    const saved = JSON.parse(localStorage.getItem(LS_DECK) || "null");
    if (saved && saved.base === stamp(embedded) && Array.isArray(saved.cards)) {
      deck = saved.cards;
      dirty = true;
    } else if (saved) {
      localStorage.removeItem(LS_DECK);
    }
  } catch (_) { /* blocked site data: carry on with the published deck */ }

  const stash = () => {
    dirty = true;
    try { localStorage.setItem(LS_DECK, JSON.stringify({ base: stamp(embedded), cards: deck })); }
    catch (_) { /* the deck still works for this session */ }
  };

  // ---------- view: which set, in order or shuffled ----------
  let group = "speech";
  let inOrder = true;
  try {
    const v = JSON.parse(localStorage.getItem(LS_VIEW) || "null");
    if (v && GROUPS.some(g => g.key === v.group)) group = v.group;
    if (v && typeof v.inOrder === "boolean") inOrder = v.inOrder;
  } catch (_) { /* default view */ }
  const keepView = () => {
    try { localStorage.setItem(LS_VIEW, JSON.stringify({ group, inOrder })); } catch (_) {}
  };

  const groupOf = (c) => c.g || "qa";
  const walking = () => group === "walk";
  // The walkthrough folds some speech cards into the one before, so each step
  // is one click. The flashcard sets keep them separate.
  const WALK_FOLD = { s02: "s01" };
  const walkCards = () => {
    const out = [];
    deck.filter(c => groupOf(c) === "speech").forEach(c => {
      const into = WALK_FOLD[c.id] && out.find(o => o.id === WALK_FOLD[c.id]);
      if (into) into.a += "\n\n" + c.a;
      else out.push(Object.assign({}, c));
    });
    return out;
  };
  const setOf = (key) => key === "all" ? deck
    : key === "walk" ? walkCards()
    : deck.filter(c => groupOf(c) === key);
  const activeCards = () => setOf(group);

  // ---------- the round ----------
  let queue = [], current = null, flipped = false, seen = 0, stumbles = 0, roundTotal = 0;
  let history = [];
  const missed = new Set();   // cards marked Again this round

  const shuffled = (a) => {
    const out = a.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };

  function drawChips() {
    const box = $("chips");
    box.innerHTML = "";
    GROUPS.forEach(g => {
      const n = setOf(g.key).length;
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.id = "chip-" + g.key;
      b.setAttribute("aria-pressed", String(group === g.key));
      b.innerHTML = g.label + " <small>" + n + "</small>";
      b.addEventListener("click", () => { group = g.key; keepView(); startRound(); });
      box.appendChild(b);
    });
    $("orderBtn").textContent = inOrder || walking() ? "In order" : "Shuffled";
    $("orderBtn").disabled = walking();
  }

  function startRound() {
    const set = activeCards();
    roundTotal = set.length;
    queue = inOrder || walking() ? set.slice() : shuffled(set);
    seen = 0; stumbles = 0; missed.clear(); history = []; current = null;
    drawChips();
    rebuildStage();
    next(true);
  }

  function next(first) {
    flipped = false;
    if (current && !first) history.push(current);
    current = queue.shift() || null;
    render();
  }

  function back() {
    if (!history.length) return;
    if (current) queue.unshift(current);
    current = history.pop();
    flipped = false;
    if (seen > 0) seen--;
    render();
  }

  function render() {
    const grade = $("grade");

    if (!roundTotal) {
      $("stage").innerHTML = '<p class="empty">No cards in this set yet. Tap <strong>Cards</strong> to write one.</p>';
      grade.hidden = true;
      $("count").textContent = "0 / 0";
      $("fill").style.width = "0%";
      $("roundNote").textContent = "";
      return;
    }
    if (!current) return finish();

    const card = $("card");
    card.classList.toggle("flipped", flipped);
    const tag = current.t || (GROUPS.find(g => g.key === groupOf(current)) || {}).label || "";
    $("tagFront").textContent = tag;
    $("tagBack").textContent = tag;
    $("qText").textContent = current.q;
    $("hText").textContent = current.h ? "Starts “" + current.h + "”" : "";
    $("aText").textContent = current.a;
    $("aText").classList.toggle("long", current.a.length > 520);
    grade.hidden = !flipped;

    const done = roundTotal - queue.length - 1;
    $("count").textContent = done + " / " + roundTotal;
    $("fill").style.width = (done / roundTotal) * 100 + "%";
    $("roundNote").textContent = queue.length + " left in this round";
    $("prevBtn").disabled = history.length === 0;
  }

  function finish() {
    $("stage").innerHTML =
      '<div class="done"><h2>Round finished</h2><p id="doneNote"></p>' +
      '<button class="primary" id="againRound" type="button">Go again</button></div>';
    $("doneNote").textContent = walking()
      ? "That's the whole presentation, start to finish."
      : stumbles
      ? seen + " cards, and " + stumbles + " needed a second look."
      : "All " + seen + " right first time.";
    $("grade").hidden = true;
    $("roundNote").textContent = "";
    $("fill").style.width = "100%";
    $("againRound").addEventListener("click", startRound);
  }

  function rebuildStage() {
    $("stage").innerHTML = walking() ?
      '<button class="card walk" id="card" type="button" aria-live="polite">' +
        '<div class="face"><span class="side-label" id="tagFront"></span>' +
        '<p class="walk-q" id="qText"></p><p class="a" id="aText"></p>' +
        '<span id="tagBack" hidden></span><span id="hText" hidden></span>' +
        '<span class="hint">Click, space or &rarr; for the next step</span></div>' +
      '</button>' :
      '<button class="card" id="card" type="button" aria-live="polite">' +
        '<div class="face front"><span class="side-label" id="tagFront"></span>' +
        '<p class="q" id="qText"></p><p class="starter" id="hText"></p>' +
        '<span class="hint">Say it aloud, then tap or press space</span></div>' +
        '<div class="face back"><span class="side-label" id="tagBack"></span>' +
        '<p class="a" id="aText"></p><span class="hint">Did you have it?</span></div>' +
      '</button>';
    const card = $("card");
    card.addEventListener("click", tap);
    let x0 = null;
    card.addEventListener("touchstart", (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
    card.addEventListener("touchend", (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      x0 = null;
      if (Math.abs(dx) > 60) { seen++; next(); }
    }, { passive: true });
  }

  // ---------- controls ----------
  function tap() {
    if (!current) return;
    if (walking()) { seen++; next(); }
    else { flipped = !flipped; render(); }
  }
  $("goodBtn").addEventListener("click", () => { seen++; next(); });
  $("againBtn").addEventListener("click", () => {
    // Stay on this card: turn it back to the question for another go.
    if (!current) return;
    if (!missed.has(current.id)) { missed.add(current.id); stumbles++; }
    flipped = false;
    render();
  });
  $("skipBtn").addEventListener("click", () => { if (current) queue.push(current); next(); });
  $("prevBtn").addEventListener("click", back);
  $("orderBtn").addEventListener("click", () => { inOrder = !inOrder; keepView(); startRound(); });

  document.addEventListener("keydown", (e) => {
    if (!$("sheet").hidden) return;
    const t = e.target.tagName;
    if (t === "TEXTAREA" || t === "INPUT" || t === "SELECT") return;
    if (e.code === "Space" || e.code === "Enter") {
      if (t === "BUTTON" && e.target.id !== "card") return;
      e.preventDefault();
      tap();
    } else if (e.code === "ArrowRight") { seen++; next(); }
    else if (e.code === "ArrowLeft") { back(); }
    else if (flipped && e.key === "1") { $("againBtn").click(); }
    else if (flipped && e.key === "2") { $("goodBtn").click(); }
  });

  // ---------- editing ----------
  const sheet = $("sheet");

  function field(tag, id, label, value, cls, rows) {
    const el = document.createElement(tag);
    el.id = id; el.value = value || "";
    if (cls) el.className = cls;
    if (rows) el.rows = rows;
    el.setAttribute("aria-label", label);
    return el;
  }

  function drawRows() {
    const box = $("rows");
    box.innerHTML = "";
    if (!deck.length) { box.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
    deck.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="row-head"><span>Card ' + (i + 1) + '</span>' +
        '<button class="del" type="button">Delete</button></div>';

      const meta = document.createElement("div");
      meta.className = "meta";
      const sel = document.createElement("select");
      sel.id = "g-" + c.id; sel.setAttribute("aria-label", "Set for card " + (i + 1));
      GROUPS.filter(g => g.key !== "all" && g.key !== "walk").forEach(g => {
        const o = document.createElement("option");
        o.value = g.key; o.textContent = g.label; sel.appendChild(o);
      });
      sel.value = groupOf(c);
      const tag = field("input", "t-" + c.id, "Slide and timing for card " + (i + 1), c.t);
      tag.placeholder = "Slide and timing";
      meta.append(sel, tag);

      const q = field("textarea", "q-" + c.id, "Prompt for card " + (i + 1), c.q, "q-in", 2);
      const h = field("input", "h-" + c.id, "First words for card " + (i + 1), c.h);
      h.placeholder = "First words (the cue)";
      const a = field("textarea", "a-" + c.id, "Full line for card " + (i + 1), c.a, "", 4);

      sel.addEventListener("change", () => { c.g = sel.value; stash(); });
      tag.addEventListener("input", () => { c.t = tag.value; stash(); });
      q.addEventListener("input", () => { c.q = q.value; stash(); });
      h.addEventListener("input", () => { c.h = h.value; stash(); });
      a.addEventListener("input", () => { c.a = a.value; stash(); });
      row.querySelector(".del").addEventListener("click", () => { deck.splice(i, 1); stash(); drawRows(); });

      row.append(meta, q, h, a);
      box.appendChild(row);
    });
  }

  $("editBtn").addEventListener("click", () => { drawRows(); sheet.hidden = false; });
  $("closeSheet").addEventListener("click", () => {
    sheet.hidden = true;
    deck = deck.filter(c => c.q.trim() || c.a.trim());
    stash();
    startRound();
  });
  $("addBtn").addEventListener("click", () => {
    deck.push({ id: "c" + Date.now().toString(36), g: group === "all" || group === "walk" ? "speech" : group, t: "", q: "", h: "", a: "" });
    stash(); drawRows();
    const qs = $("rows").querySelectorAll("textarea.q-in");
    if (qs.length) qs[qs.length - 1].focus();
  });

  // ---------- saving ----------
  // A static page on your own domain: edits live in this browser only. Cards
  // worth keeping go back into the encrypted deck when the page is rebuilt.
  function save() {
    deck = deck.filter(c => c.q.trim() || c.a.trim());
    stash();
    $("syncNote").textContent = "Saved on this device";
    sheet.hidden = true; startRound();
  }
  $("saveBtn").addEventListener("click", save);

  // ---------- go ----------
  startRound();

  $("syncNote").textContent = dirty ? "Unsaved changes" : "Saves on this device only";
}
</script>

<script>
(() => {
  "use strict";
  const LS_PASS = "prep.passphrase";
  const blob = JSON.parse(document.getElementById("vault").textContent);
  const $ = (id) => document.getElementById(id);
  const bytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function open(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: bytes(blob.salt), iterations: blob.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(blob.iv) }, key, bytes(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function show(data) {
    $("lock").hidden = true;
    $("app").hidden = false;
    $("deckName").firstChild.textContent = data.name + "\n      ";
    $("deckSub").textContent = data.sub;
    document.title = data.name;
    runDeck(data.cards);
  }

  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = $("pass").value.trim().toLowerCase().replace(/\s+/g, " ");
    if (!pass) return;
    $("unlockBtn").disabled = true; $("lockErr").textContent = "Opening…";
    try {
      const data = await open(pass);
      try { if ($("remember").checked) localStorage.setItem(LS_PASS, pass); } catch (_) {}
      show(data);
    } catch (_) {
      $("lockErr").textContent = "That passphrase didn't open it. Check the spaces between words.";
      $("unlockBtn").disabled = false;
    }
  });

  let saved = null;
  try { saved = localStorage.getItem(LS_PASS); } catch (_) {}
  if (saved) {
    open(saved).then(show).catch(() => { try { localStorage.removeItem(LS_PASS); } catch (_) {} });
  }
})();
</script>

if ("serviceWorker" in navigator) {

<script>
// Full screen for desktop browsers. The button stays hidden where the browser
// can't do it (iPhone Safari, or a frame that doesn't allow it).
(() => {
  const btn = document.getElementById("fsBtn");
  const root = document.documentElement;
  const enter = root.requestFullscreen || root.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  const active = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!btn || !enter || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) return;
  btn.hidden = false;
  const toggle = () => { Promise.resolve(active() ? exit.call(document) : enter.call(root)).catch(() => {}); };
  const sync = () => {
    document.body.classList.toggle("fs", !!active());
    btn.textContent = active() ? "Exit full screen" : "Full screen";
  };
  btn.addEventListener("click", toggle);
  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);
  document.addEventListener("keydown", (e) => {
    const t = e.target.tagName;
    if (t === "TEXTAREA" || t === "INPUT" || t === "SELECT") return;
    if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) toggle();
  });
})();
</script>
