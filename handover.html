<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Handover</title>
</head>
<body>
<script>
/* One-time handover for the apps that moved to their own addresses on 5 Nov 2026.
   GENERATED by publish-apps.py: edit APPS there, not this file.
   Loaded hidden inside one of the new apps. It answers only those exact addresses, and
   gives each only its own saved items. It never runs on its own, writes nothing and
   creates no database. */
(function () {
  var GIVE = {
    "https://desk.thewishingstream.com": {
      "keys": [
        "openbrain.accessKey",
        "aidesk-pass"
      ],
      "prefixes": [
        "aidesk."
      ],
      "idb": []
    },
    "https://twosides.thewishingstream.com": {
      "keys": [],
      "prefixes": [
        "twosides.",
        "prep."
      ],
      "idb": []
    },
    "https://oneside.thewishingstream.com": {
      "keys": [
        "openbrain.accessKey"
      ],
      "prefixes": [
        "oneside."
      ],
      "idb": []
    },
    "https://trips.thewishingstream.com": {
      "keys": [],
      "prefixes": [
        "trips."
      ],
      "idb": [
        "trips-passes"
      ]
    }
  };
  if (window.parent === window) { document.body.textContent = 'Nothing here.'; return; }
  window.addEventListener('message', function (e) {
    var cfg = GIVE[e.origin];
    if (!cfg || e.source !== window.parent || !e.data || e.data.type !== 'ob-handover-request') return;
    collect(cfg).then(function (out) { window.parent.postMessage(out, e.origin); });
  });
  Object.keys(GIVE).forEach(function (o) { try { window.parent.postMessage({ type: 'ob-handover-ready' }, o); } catch (e) {} });

  function collect(cfg) {
    var out = { type: 'ob-handover', ls: {}, idb: [] };
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (cfg.keys.indexOf(k) >= 0 || cfg.prefixes.some(function (p) { return k.indexOf(p) === 0; })) out.ls[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    if (!cfg.idb.length || !indexedDB.databases) return Promise.resolve(out);
    return indexedDB.databases().then(function (list) {
      var have = list.map(function (d) { return d.name; });
      return cfg.idb.filter(function (n) { return have.indexOf(n) >= 0; }).reduce(function (p, n) {
        return p.then(function () { return dump(n).then(function (d) { if (d) out.idb.push(d); }); });
      }, Promise.resolve());
    }).then(function () { return out; }, function () { return out; });
  }
  function dump(name) {
    return new Promise(function (res) {
      var r = indexedDB.open(name);
      r.onupgradeneeded = function () { r.transaction.abort(); };  // it did not exist: create nothing
      r.onerror = function () { res(null); };
      r.onsuccess = function () {
        var x = r.result, names = Array.prototype.slice.call(x.objectStoreNames);
        var d = { name: name, version: x.version, stores: [] };
        if (!names.length) { x.close(); return res(d); }
        var tx = x.transaction(names, 'readonly');
        names.forEach(function (sn) {
          var os = tx.objectStore(sn);
          var s = { name: sn, keyPath: os.keyPath, autoIncrement: os.autoIncrement, indexes: [], records: [] };
          Array.prototype.forEach.call(os.indexNames, function (ix) {
            var i = os.index(ix); s.indexes.push({ name: i.name, keyPath: i.keyPath, unique: i.unique, multiEntry: i.multiEntry });
          });
          os.openCursor().onsuccess = function (ev) {
            var c = ev.target.result; if (!c) return;
            s.records.push({ key: c.primaryKey, value: c.value }); c.continue();
          };
          d.stores.push(s);
        });
        tx.oncomplete = function () { x.close(); res(d); };
        tx.onerror = function () { x.close(); res(null); };
      };
    });
  }
})();
</script>
</body>
</html>
