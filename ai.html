<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16140F">
<title>AI Desk</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#16140F; --panel:#1E1A12; --panel-raised:#262019;
    --ruled:rgba(232,223,200,0.07); --hairline:rgba(232,223,200,0.13);
    --ink:#E9DFC7; --ink-dim:#A79A7D; --ink-faint:#766B54;
    --brass:#C9A227; --moss:#7C9A6E; --rust:#B15B45; --blue:#6C93A8; --plum:#9A79A0;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Source Serif 4','Iowan Old Style',Georgia,serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
  a{color:var(--brass)}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  /* ---- sidebar ---- */
  nav{background:var(--panel);border-right:1px solid var(--hairline);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-family:var(--font-display);font-size:22px;font-weight:600;padding:0 8px 2px}
  .brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);padding:0 8px 16px;letter-spacing:.04em}
  .search{width:100%;background:var(--paper);border:1px solid var(--hairline);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--font-mono);font-size:13px;margin-bottom:14px}
  .search:focus{outline:2px solid var(--brass);outline-offset:1px}
  .sec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-dim);font-size:15px}
  .sec:hover{background:var(--panel-raised);color:var(--ink)}
  .sec.on{background:var(--panel-raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--sec-colour,var(--brass))}
  .sec .dot{width:8px;height:8px;border-radius:50%;background:var(--sec-colour,var(--brass));flex:none}
  .sec .n{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
  .navfoot{margin-top:18px;padding:12px 8px 0;border-top:1px solid var(--ruled);font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
  .navfoot button{background:none;border:1px solid var(--hairline);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink-dim);font-family:var(--font-mono);font-size:11px;margin-top:6px}
  /* ---- main ---- */
  main{display:grid;grid-template-columns:minmax(220px,320px) 1fr;min-width:0}
  .list{border-right:1px solid var(--hairline);padding:20px 14px;overflow:auto;height:100vh;position:sticky;top:0}
  .list h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 6px 4px}
  .list .blurb{color:var(--ink-faint);font-size:13px;margin:0 6px 14px}
  .item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:4px}
  .item:hover{background:var(--panel)}
  .item.on{background:var(--panel);border-color:var(--hairline)}
  .item .t{font-size:15px;line-height:1.3}
  .item .m{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:3px}
  .detail{padding:28px 36px 60px;min-width:0;max-width:880px}
  .crumb{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec-colour,var(--brass))}
  .detail h1{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.15;margin:6px 0 4px}
  .meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .chip{background:var(--panel);border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-dim)}
  .chip:hover{color:var(--ink);border-color:var(--brass)}
  .body h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:26px 0 6px;padding-top:6px;border-top:1px solid var(--ruled);scroll-margin-top:16px}
  .body h3{font-size:17px;margin:18px 0 4px}
  .body ul{padding-left:22px;margin:6px 0}
  .body li{margin:3px 0}
  .body p{margin:8px 0}
  .body blockquote{margin:12px 0;padding:12px 16px;background:var(--panel);border-left:3px solid var(--brass);border-radius:6px;position:relative}
  .body blockquote .copy{position:absolute;top:8px;right:8px;background:var(--panel-raised);border:1px solid var(--hairline);border-radius:6px;font-family:var(--font-mono);font-size:11px;padding:3px 8px;cursor:pointer;color:var(--ink-dim)}
  .body code{font-family:var(--font-mono);font-size:.9em;background:var(--panel);padding:1px 5px;border-radius:4px}
  .tbl{overflow-x:auto;margin:12px 0}
  .body table{border-collapse:collapse;font-size:14px;min-width:520px}
  .body th,.body td{border-bottom:1px solid var(--hairline);padding:7px 10px;text-align:left;vertical-align:top}
  .body th{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim)}
  .empty{color:var(--ink-faint);padding:40px 0}
  .backbtn{display:none}
  /* ---- unlock ---- */
  .unlock{max-width:420px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--hairline);border-radius:14px}
  .unlock h1{font-family:var(--font-display);margin:0 0 8px}
  .unlock p{color:var(--ink-dim);font-size:14px}
  .unlock input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--hairline);background:var(--paper);color:var(--ink);font-family:var(--font-mono)}
  .unlock button{margin-top:12px;padding:9px 16px;border-radius:8px;border:0;background:var(--brass);color:#16140F;font-weight:600;cursor:pointer}
  .err{color:var(--rust);font-size:14px;min-height:1.4em}
  /* ---- phone ---- */
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start}
    .navlist{scrollbar-width:none}
    .navlist::-webkit-scrollbar{display:none}
    main{align-content:start}
    nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline);padding:14px 16px}
    .navlist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .sec{white-space:nowrap;width:auto;padding:7px 10px}
    .sec .n{display:none}
    .navfoot{display:none}
    main{grid-template-columns:1fr}
    .list{height:auto;position:static;border-right:0;padding:14px 16px}
    .detail{padding:18px 16px 60px}
    main.reading .list{display:none}
    main:not(.reading) .detail{display:none}
    .backbtn{display:inline-block;background:none;border:1px solid var(--hairline);border-radius:6px;padding:4px 10px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);margin-bottom:10px;cursor:pointer}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// AI Desk: a meeting-friendly view of the Open Brain notes tagged "AI Dashboard".
// The page holds no content. It reads the notes live from the Open Brain MCP
// server with the same access key as the catalog (same origin, same
// localStorage entry), so updating a note updates the dashboard. Never put the
// key or any note content in this file.
const MCP_URL = "https://uftlxeahciewiitclkbu.supabase.co/functions/v1/open-brain-mcp";
const KEY_STORAGE = 'openbrain.accessKey';
const DASH_TAG = 'AI Dashboard';

// Sections in display order. `tag` is the second Open Brain tag on each note.
const SECTIONS = [
  { tag: 'AI weekly update',          name: 'This week',             colour: 'var(--brass)', blurb: 'The latest research, newest first.' },
  { tag: 'AI Forum',                  name: 'AI Forum',              colour: 'var(--moss)',  blurb: 'Round-table agenda and notes. Use the chips to jump between items.' },
  { tag: 'Copilot and automation',    name: 'Copilot & automation',  colour: 'var(--blue)',  blurb: 'What Copilot can do for us, and what it can’t yet.' },
  { tag: 'Prompt library',            name: 'Prompt library',        colour: 'var(--plum)',  blurb: 'Prompts worth sharing. Tap Copy on any prompt.' },
  { tag: 'AI tools and data location',name: 'Tools & data location', colour: 'var(--rust)',  blurb: 'What the no-US rule allows.' },
  { tag: 'AI build options',          name: 'Build options',         colour: 'var(--moss)',  blurb: 'Building our own agents within the rules.' },
  { tag: 'AI vendor watch',           name: 'Vendor watch',          colour: 'var(--blue)',  blurb: 'What our suppliers are shipping.' },
];

let accessKey = '';
try { accessKey = localStorage.getItem(KEY_STORAGE) || ''; } catch (_) {}
let notes = [];
let loadedAt = null;
let state = { section: SECTIONS[0].tag, noteId: null, query: '' };
try { const s = JSON.parse(sessionStorage.getItem('aidesk.view') || 'null'); if (s && s.section) state = { ...state, ...s, query: '' }; } catch (_) {}

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- server ---------- */
async function callTool(name, args) {
  let res;
  try {
    res = await fetch(MCP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream', 'x-brain-key': accessKey },
      body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method: 'tools/call', params: { name, arguments: args } }),
    });
  } catch (e) { throw new Error('Could not reach Open Brain. Check the connection.'); }
  const raw = await res.text();
  let payload;
  if ((res.headers.get('Content-Type') || '').includes('text/event-stream')) {
    const line = raw.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).reverse().find(l => l.startsWith('{'));
    payload = line ? JSON.parse(line) : {};
  } else payload = raw.trim() ? JSON.parse(raw) : {};
  // An invalid key comes back as HTTP 200 with JSON-RPC error -32001.
  if (!res.ok || payload.error) {
    const msg = (payload.error && payload.error.message) || ('HTTP ' + res.status);
    if (res.status === 401 || res.status === 403 || (payload.error && (payload.error.code === -32001 || /unauthor/i.test(msg)))) {
      const e = new Error('That key was rejected.'); e.auth = true; throw e;
    }
    throw new Error(msg);
  }
  const block = ((payload.result && payload.result.content) || []).find(b => b.type === 'text');
  return block ? block.text : '';
}

async function load() {
  const text = await callTool('list_thoughts', { topic: DASH_TAG, limit: 300, format: 'json' });
  let arr = [];
  try { arr = JSON.parse(text); } catch (_) { arr = []; }
  notes = (Array.isArray(arr) ? arr : []).map(r => {
    const m = r.metadata || {};
    const topics = Array.isArray(m.topics) ? m.topics : [];
    const content = r.content || '';
    const firstHeading = (content.match(/^#\s+(.+)$/m) || [])[1];
    return {
      id: r.id, content, topics,
      title: m.title || firstHeading || content.slice(0, 70),
      date: m.updated_date || m.published_date || (r.created_at || '').slice(0, 10),
      created: r.created_at || '',
      section: (SECTIONS.find(s => topics.includes(s.tag)) || {}).tag || null,
    };
  }).sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created));
  loadedAt = new Date();
}

/* ---------- markdown (small, escape-first) ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(·])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48) + (url.length > 60 ? '…' : '') + '</a>');
  return s;
}
const slug = (s) => 'h-' + String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function md(src, dropTitle) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = [], list = null, quote = [], table = [], headings = [];
  const flushList = () => { if (list) { out.push('<ul>' + list.map(li => '<li>' + inline(li) + '</li>').join('') + '</ul>'); list = null; } };
  const flushQuote = () => { if (quote.length) { const txt = quote.join('\n'); out.push('<blockquote data-copy="' + esc(txt) + '"><button class="copy">Copy</button>' + quote.map(inline).join('<br>') + '</blockquote>'); quote = []; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    const [head, ...body] = rows;
    out.push('<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
      body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
    table = [];
  };
  const flushAll = () => { flushList(); flushQuote(); flushTable(); };
  let titleDropped = !dropTitle;
  for (const line of lines) {
    const t = line.trim();
    if (!titleDropped && /^#\s+/.test(t)) { titleDropped = true; continue; }
    if (t.startsWith('|')) { flushList(); flushQuote(); table.push(t); continue; }
    if (t.startsWith('>')) { flushList(); flushTable(); quote.push(t.replace(/^>\s?/, '')); continue; }
    const li = t.match(/^[-*•]\s+(.*)$/);
    if (li) { flushQuote(); flushTable(); (list = list || []).push(li[1]); continue; }
    flushAll();
    if (!t) continue;
    const h = t.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const level = Math.max(2, h[1].length);
      if (level === 2) headings.push(h[2]);
      out.push('<h' + level + ' id="' + slug(h[2]) + '">' + inline(h[2]) + '</h' + level + '>');
    } else if (/^[A-Z0-9][A-Z0-9 ,'&()\-–—]{3,}$/.test(t) && t.length < 80) {
      // Notes written with SHOUTED headings (e.g. "2. WHAT'S RULED IN AND OUT")
      headings.push(t); out.push('<h2 id="' + slug(t) + '">' + inline(t.charAt(0) + t.slice(1).toLowerCase()) + '</h2>');
    } else out.push('<p>' + inline(t) + '</p>');
  }
  flushAll();
  return { html: out.join('\n'), headings };
}

/* ---------- views ---------- */
function saveView() { try { sessionStorage.setItem('aidesk.view', JSON.stringify({ section: state.section, noteId: state.noteId })); } catch (_) {} }

function visibleNotes() {
  const q = state.query.trim().toLowerCase();
  if (q) return notes.filter(n => (n.title + '\n' + n.content).toLowerCase().includes(q));
  return notes.filter(n => n.section === state.section);
}

function render() {
  const sec = SECTIONS.find(s => s.tag === state.section) || SECTIONS[0];
  const list = visibleNotes();
  if (!state.query && (!state.noteId || !list.some(n => n.id === state.noteId))) state.noteId = list[0] ? list[0].id : null;
  const current = notes.find(n => n.id === state.noteId) || null;
  const curSec = current ? (SECTIONS.find(s => s.tag === current.section) || sec) : sec;
  const counts = Object.fromEntries(SECTIONS.map(s => [s.tag, notes.filter(n => n.section === s.tag).length]));

  let detail = '<div class="empty">Nothing here yet.</div>';
  if (current) {
    const { html, headings } = md(current.content, true);
    detail = '<button class="backbtn" data-back>← ' + esc(state.query ? 'Results' : curSec.name) + '</button>' +
      '<div class="crumb" style="--sec-colour:' + curSec.colour + '">' + esc(curSec.name) + '</div>' +
      '<h1>' + esc(current.title) + '</h1>' +
      '<div class="meta">' + esc(current.date || '') + '</div>' +
      (headings.length > 2 ? '<div class="chips">' + headings.map(h => '<button class="chip" data-jump="' + slug(h) + '">' + esc(h.replace(/^\d+\.\s*/, '')) + '</button>').join('') + '</div>' : '') +
      '<div class="body">' + html + '</div>';
  }

  $('#app').innerHTML =
    '<div class="shell">' +
      '<nav><div class="brand">AI Desk</div><div class="brand-sub">FROM OPEN BRAIN · LIVE</div>' +
        '<input class="search" id="q" type="search" placeholder="Search everything" value="' + esc(state.query) + '" autocomplete="off">' +
        '<div class="navlist">' + SECTIONS.map(s =>
          '<button class="sec' + (!state.query && s.tag === state.section ? ' on' : '') + '" data-sec="' + esc(s.tag) + '" style="--sec-colour:' + s.colour + '"><span class="dot"></span>' + esc(s.name) + '<span class="n">' + counts[s.tag] + '</span></button>').join('') +
        '</div>' +
        '<div class="navfoot">Loaded ' + (loadedAt ? loadedAt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '–') + ' · ' + notes.length + ' notes<br><button data-refresh>Refresh</button> <button data-lock>Lock</button></div>' +
      '</nav>' +
      '<main class="' + (state.reading ? 'reading' : '') + '">' +
        '<section class="list"><h2>' + esc(state.query ? 'Search' : sec.name) + '</h2><p class="blurb">' + esc(state.query ? list.length + ' match' + (list.length === 1 ? '' : 'es') + ' for “' + state.query + '”' : sec.blurb) + '</p>' +
          (list.length ? list.map(n => '<button class="item' + (n.id === state.noteId ? ' on' : '') + '" data-note="' + n.id + '"><div class="t">' + esc(n.title) + '</div><div class="m">' + esc(n.date || '') + (state.query && n.section ? ' · ' + esc((SECTIONS.find(s => s.tag === n.section) || {}).name || '') : '') + '</div></button>').join('') : '<div class="empty">No notes.</div>') +
        '</section>' +
        '<article class="detail">' + detail + '</article>' +
      '</main>' +
    '</div>';
  saveView();
}

function showUnlock(msg) {
  $('#app').innerHTML = '<div class="unlock"><h1>AI Desk</h1><p>Enter your Open Brain access key. It’s kept in this browser only, shared with the catalog on this site.</p>' +
    '<input id="key" type="password" autocomplete="off" placeholder="Access key"><div class="err">' + esc(msg || '') + '</div><button id="go">Unlock</button></div>';
  const go = async () => {
    accessKey = $('#key').value.trim();
    if (!accessKey) return;
    try { localStorage.setItem(KEY_STORAGE, accessKey); } catch (_) {}
    start();
  };
  $('#go').onclick = go;
  $('#key').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  $('#key').focus();
}

async function start() {
  if (!accessKey) return showUnlock();
  $('#app').innerHTML = '<div class="unlock"><p>Loading from Open Brain…</p></div>';
  try { await load(); render(); }
  catch (e) {
    if (e.auth) { try { localStorage.removeItem(KEY_STORAGE); } catch (_) {} accessKey = ''; return showUnlock(e.message); }
    $('#app').innerHTML = '<div class="unlock"><h1>AI Desk</h1><div class="err">' + esc(e.message) + '</div><button onclick="start()">Try again</button></div>';
  }
}

/* ---------- events ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-sec],[data-note],[data-jump],[data-refresh],[data-lock],[data-back],.copy');
  if (!t) return;
  if (t.matches('.copy')) {
    const txt = t.parentElement.getAttribute('data-copy');
    try { await navigator.clipboard.writeText(txt); t.textContent = 'Copied'; setTimeout(() => (t.textContent = 'Copy'), 1500); } catch (_) { t.textContent = 'Select & copy'; }
    return;
  }
  if (t.dataset.sec) { state = { ...state, section: t.dataset.sec, noteId: null, query: '', reading: false }; render(); return; }
  if (t.dataset.note) { state.noteId = t.dataset.note; state.reading = true; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.hasAttribute('data-back')) { state.reading = false; render(); return; }
  if (t.hasAttribute('data-refresh')) { t.textContent = 'Loading…'; try { await load(); } catch (_) {} render(); return; }
  if (t.hasAttribute('data-lock')) { if (confirm('Remove the access key from this browser? The catalog on this site will lock too.')) { try { localStorage.removeItem(KEY_STORAGE); } catch (_) {} accessKey = ''; notes = []; showUnlock(); } }
});
let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.query = e.target.value; state.noteId = null; state.reading = false;
    const pos = e.target.selectionStart; render();
    const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
    if (state.query) { const first = visibleNotes()[0]; if (first) { state.noteId = first.id; render(); const q2 = $('#q'); q2.focus(); q2.setSelectionRange(pos, pos); } }
  }, 180);
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement && document.activeElement.id !== 'q' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); const q = $('#q'); if (q) q.focus(); }
});
start();
</script>
</body>
</html>
