/* otter:start v2.1 — Otter design language. Source: ~/.claude/skills/otter-design/otter.css
   Paste this block whole into an app's <style>. Re-sync by replacing everything
   between otter:start and otter:end. App-specific CSS goes after otter:end.
   Also needed in <head>:
   <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   App colour: <html lang="en-GB" data-hue="heather|sea|teal|moss|ochre|blossom">  */

/* ── Typewriter faces: iA Writer Quattro (words) and Mono (numbers). SIL OFL, pinned. ── */
@font-face{font-family:"iA Quattro";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Regular.woff2") format("woff2")}
@font-face{font-family:"iA Quattro";font-weight:400;font-style:italic;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Italic.woff2") format("woff2")}
@font-face{font-family:"iA Quattro";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Bold.woff2") format("woff2")}
@font-face{font-family:"iA Quattro";font-weight:700;font-style:italic;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-BoldItalic.woff2") format("woff2")}
@font-face{font-family:"iA Mono";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Regular.woff2") format("woff2")}
@font-face{font-family:"iA Mono";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Bold.woff2") format("woff2")}

:root{
  /* ── Earthy hues: one per app, used as a light touch ── */
  --heather:#7A5C8E; --sea:#3E6E8E; --teal:#3F7A7B; --moss:#5E7A4A; --ochre:#A8741C; --blossom:#B0566F;

  /* ── Signals (same in every app) ── */
  --ok:#5E7A4A; --warn:#A8741C; --fail:#A8473A;

  /* ── Type: typewriter for words, a quiet serif for feeling, mono for figures ── */
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --type:"iA Quattro",ui-monospace,"SF Mono",Menlo,monospace;
  --mono:"iA Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --t-xs:.75rem; --t-sm:.8125rem; --t-md:1rem; --t-lg:1.0625rem;
  --t-xl:1.625rem; --t-2xl:2.25rem; --t-3xl:3rem; --t-4xl:4.5rem;

  /* ── Space (4px steps) and shape ── */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:18px;
  --ease:cubic-bezier(.2,.7,.3,1);

  --accent:var(--heather);
}
[data-hue="heather"]{--accent:var(--heather)}
[data-hue="sea"]    {--accent:var(--sea)}
[data-hue="teal"]   {--accent:var(--teal)}
[data-hue="moss"]   {--accent:var(--moss)}
[data-hue="ochre"]  {--accent:var(--ochre)}
[data-hue="blossom"]{--accent:var(--blossom)}

/* ── Light: Kim Klassen's greige and charcoal. Roles live on every [data-hue] too. ── */
:root,[data-hue]{
  --ground:#EDEBE7;   /* the page */
  --paper:#F6F5F2;    /* the note, rows, panels */
  --stone:#E1DFD8;    /* fields, chips, tracks */
  --stone-2:#CAC4BE;  /* rules, faded marks */
  --taupe:#908077;    /* the ticker */
  --ink:#3D3D39; --ink-2:#6B6A64; --ink-3:#9C9A93; --ink-dim:#B9B6AE;
  --on-ink:#F6F5F2;
  --accent-tint:color-mix(in oklab,var(--accent),var(--paper) 86%);
  --accent-deep:color-mix(in oklab,var(--accent),black 18%);
  --ok-tint:color-mix(in oklab,var(--ok),var(--paper) 84%);
  --warn-tint:color-mix(in oklab,var(--warn),var(--paper) 84%);
  --fail-tint:color-mix(in oklab,var(--fail),var(--paper) 86%);
  color-scheme:light;
}
/* ── Dark: warm charcoal, not blue-black ── */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]),:root:not([data-theme="light"]) [data-hue]{
    --ground:#1C1B19; --paper:#252421; --stone:#302E2B; --stone-2:#4A4743; --taupe:#5E544D;
    --ink:#E8E5DF; --ink-2:#B3AFA7; --ink-3:#85827B; --ink-dim:#5C5954; --on-ink:#1C1B19;
    --accent-tint:color-mix(in oklab,var(--accent),var(--paper) 72%);
    --accent-deep:color-mix(in oklab,var(--accent),white 30%);
    --ok-tint:color-mix(in oklab,var(--ok),var(--paper) 70%);
    --warn-tint:color-mix(in oklab,var(--warn),var(--paper) 70%);
    --fail-tint:color-mix(in oklab,var(--fail),var(--paper) 70%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-theme="dark"] [data-hue]{
  --ground:#1C1B19; --paper:#252421; --stone:#302E2B; --stone-2:#4A4743; --taupe:#5E544D;
  --ink:#E8E5DF; --ink-2:#B3AFA7; --ink-3:#85827B; --ink-dim:#5C5954; --on-ink:#1C1B19;
  --accent-tint:color-mix(in oklab,var(--accent),var(--paper) 72%);
  --accent-deep:color-mix(in oklab,var(--accent),white 30%);
  --ok-tint:color-mix(in oklab,var(--ok),var(--paper) 70%);
  --warn-tint:color-mix(in oklab,var(--warn),var(--paper) 70%);
  --fail-tint:color-mix(in oklab,var(--fail),var(--paper) 70%);
  color-scheme:dark;
}

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--type);
  font-size:var(--t-md); line-height:1.65; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif); font-weight:500; line-height:1.1; letter-spacing:-.01em; margin:0 0 var(--s3); color:var(--ink)}
h1{font-size:var(--t-3xl)} h2{font-size:var(--t-2xl)} h3{font-size:var(--t-xl)} h4{font-size:1.3rem}
h1 em,h2 em,h3 em,h4 em{font-style:italic; font-weight:400}
p{margin:0 0 var(--s4)}
a{color:var(--accent-deep); text-decoration-thickness:1px; text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs)}
::selection{background:var(--accent-tint); color:var(--ink)}
code,kbd,pre,.o-mono{font-family:var(--mono); font-size:.92em}
.o-num{font-family:var(--mono); font-variant-numeric:tabular-nums}
hr,.o-rule{border:0; height:1px; background:var(--stone-2); margin:var(--s7) 0}

/* ── Display: the serif at size. One per screen. ── */
.o-display{font-family:var(--serif); font-weight:500; font-size:clamp(2.5rem,7vw,var(--t-4xl)); line-height:1.02; letter-spacing:-.015em}
.o-display em{font-style:italic; font-weight:400}
.o-wordmark{font-family:var(--serif); font-weight:600; font-size:var(--t-xl); line-height:1; letter-spacing:-.01em; color:var(--ink); text-decoration:none}

/* ── The one place spaced capitals are allowed: a single date-and-place line per screen ── */
.o-dateline{font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s4)}
.o-ticker{display:flex; gap:var(--s6); overflow:hidden; white-space:nowrap; padding:9px var(--s5);
  background:var(--taupe); color:#F6F5F2; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.o-ticker > :nth-child(n+3){opacity:.75}
@media (max-width:640px){.o-ticker > :nth-child(n+2){display:none}}

/* ── Labels and small print: sentence case ── */
.o-label{display:block; font-size:var(--t-sm); font-weight:700; color:var(--ink-2); margin-bottom:var(--s2)}
.o-meta{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
.o-lede{font-size:var(--t-lg); color:var(--ink-2); max-width:62ch}

/* ── Text that types itself: add .o-typing; the cursor is the app's colour ── */
.o-typing::after,.o-cursor{content:""; display:inline-block; width:2px; height:1.1em; background:var(--accent); margin-left:2px; vertical-align:-3px; animation:o-blink 1s steps(1) infinite}
@keyframes o-blink{50%{opacity:0}}

/* ── App bar: quiet, on the ground. Serif wordmark, text links, accent underline. ── */
.o-bar{display:flex; align-items:baseline; gap:var(--s5); padding:var(--s4) var(--s5); min-height:60px}
.o-bar__spacer{flex:1}
.o-bar a,.o-bar__link{font:inherit; font-size:var(--t-sm); color:var(--ink-2); text-decoration:none; background:none; border:0; padding:var(--s1) 0; cursor:pointer}
.o-bar a:hover,.o-bar__link:hover{color:var(--ink)}
.o-bar .is-current,.o-bar [aria-current]{color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:7px}

/* ── Page ── */
.o-page{max-width:1080px; margin:0 auto; padding:var(--s6) var(--s5) var(--s8)}
.o-page--read{max-width:720px}
@media (max-width:640px){.o-page{padding:var(--s5) var(--s4) var(--s8)} .o-bar{padding:var(--s3) var(--s4); gap:var(--s4)}}

/* ── Buttons: quiet. Charcoal for the one thing to do, a line for the other, text for the rest. ── */
.o-btn{display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); min-height:44px; padding:0 var(--s5);
  border:0; border-radius:var(--r-sm); background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink-3);
  font:inherit; font-size:.9375rem; line-height:1; cursor:pointer; text-decoration:none; transition:background .15s,color .15s,box-shadow .15s}
.o-btn:hover{box-shadow:inset 0 0 0 1px var(--ink); color:var(--ink)}
.o-btn:disabled,.o-btn[aria-disabled="true"]{opacity:.45; cursor:not-allowed}
.o-btn--primary{background:var(--ink); color:var(--on-ink); box-shadow:none}
.o-btn--primary:hover{background:color-mix(in oklab,var(--ink),var(--accent) 22%); color:var(--on-ink); box-shadow:none}
.o-btn--danger{background:var(--fail); color:#fff; box-shadow:none}
.o-btn--danger:hover{background:color-mix(in oklab,var(--fail),black 12%); color:#fff; box-shadow:none}
.o-btn--quiet{box-shadow:none; color:var(--accent-deep); padding:0 var(--s1); text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px}
.o-btn--quiet:hover{box-shadow:none; color:var(--accent)}
.o-btn--sm{min-height:34px; padding:0 var(--s4); font-size:var(--t-sm)}
.o-btn--block{width:100%}

/* ── Fields: a stone fill; paper and an accent ring when typing ── */
.o-field{display:block; width:100%; min-height:46px; padding:var(--s3) var(--s4); border:0; border-radius:var(--r-md);
  background:var(--stone); color:var(--ink); font:inherit; box-shadow:inset 0 0 0 1.5px transparent; transition:background .15s,box-shadow .15s}
.o-field::placeholder{color:var(--ink-3)}
.o-field:focus{outline:none; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--accent)}
textarea.o-field{min-height:140px; resize:vertical; line-height:1.6}

/* ── Chips ── */
.o-chip{display:inline-flex; align-items:center; gap:var(--s1); padding:2px var(--s2); border:0; border-radius:var(--r-xs);
  background:var(--stone); color:var(--ink-2); font:inherit; font-size:var(--t-sm); line-height:1.5}
button.o-chip{cursor:pointer}
.o-chip[aria-pressed="true"],.o-chip.is-on{background:var(--accent-tint); color:var(--accent-deep)}
.o-chip--ok{background:var(--ok-tint); color:var(--ink)} .o-chip--warn{background:var(--warn-tint); color:var(--ink)} .o-chip--fail{background:var(--fail-tint); color:var(--ink)}

/* ── Panels: paper on the ground. No borders, no shadows. ── */
.o-panel{background:var(--paper); border-radius:var(--r-lg); padding:var(--s5)}
.o-panel--tint{background:var(--accent-tint)}

/* ── Stones: rows of paper with the ground showing between ── */
.o-stones{display:flex; flex-direction:column; gap:3px; margin:0; padding:0; list-style:none}
.o-stone{display:flex; align-items:center; gap:var(--s4); padding:var(--s4) var(--s5); background:var(--paper); border-radius:var(--r-xs); color:inherit; text-decoration:none}
.o-stones > .o-stone:first-child{border-top-left-radius:var(--r-md); border-top-right-radius:var(--r-md)}
.o-stones > .o-stone:last-child{border-bottom-left-radius:var(--r-md); border-bottom-right-radius:var(--r-md)}
a.o-stone:hover,button.o-stone:hover{background:var(--accent-tint)}
button.o-stone{width:100%; border:0; font:inherit; text-align:left; cursor:pointer}
.o-stone__main{flex:1; min-width:0}
.o-stone__title{display:block; font-family:var(--serif); font-size:1.25rem; font-weight:500; line-height:1.25}
.o-stone__sub{display:block; font-size:var(--t-sm); color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ── Cards: soft pastel tiles (Craft). Tint with data-tint, default paper. ── */
.o-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--s3)}
.o-card{display:flex; flex-direction:column; gap:var(--s2); min-height:150px; padding:var(--s4); border-radius:var(--r-md);
  background:var(--paper); color:inherit; text-decoration:none; --tint:var(--paper)}
.o-card[data-tint]{background:color-mix(in oklab,var(--tint),var(--paper) 85%)}
.o-card[data-tint="heather"]{--tint:var(--heather)} .o-card[data-tint="sea"]{--tint:var(--sea)} .o-card[data-tint="teal"]{--tint:var(--teal)}
.o-card[data-tint="moss"]{--tint:var(--moss)} .o-card[data-tint="ochre"]{--tint:var(--ochre)} .o-card[data-tint="blossom"]{--tint:var(--blossom)}
.o-card__title{margin:0; font-family:var(--serif); font-size:1.25rem; font-weight:500; line-height:1.15}
.o-card__text{margin:0; font-size:var(--t-sm); color:var(--ink-2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.o-card .o-meta{margin-top:auto}
a.o-card:hover{filter:brightness(.98)}

/* ── Tabs: words with an accent underline ── */
.o-tabs{display:flex; gap:var(--s5); border-bottom:1px solid var(--stone-2)}
.o-tab{border:0; background:none; font:inherit; font-size:var(--t-sm); color:var(--ink-2); padding:var(--s2) 0; margin-bottom:-1px; cursor:pointer; border-bottom:2px solid transparent}
.o-tab:hover{color:var(--ink)}
.o-tab[aria-selected="true"],.o-tab.is-current{color:var(--ink); border-bottom-color:var(--accent)}

/* ── Stats ── */
.o-stat{display:flex; flex-direction:column; gap:var(--s1)}
.o-stat__n{font-family:var(--mono); font-weight:700; font-size:var(--t-3xl); line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.o-stat__l{font-size:var(--t-sm); color:var(--ink-2)}

/* ── One big figure (the flip clock) ── */
.o-figure{display:flex; gap:var(--s3); justify-content:center; align-items:stretch; padding:var(--s5); border-radius:var(--r-lg); background:#141413; color:#D9D7D2; min-height:280px}
.o-tile{position:relative; flex:1; max-width:240px; display:flex; align-items:center; justify-content:center; border-radius:var(--r-md); background:#232321;
  font-family:var(--mono); font-weight:700; font-size:clamp(5rem,13vw,9.5rem); line-height:1; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.o-tile::after{content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#141413}
.o-tile__label{position:absolute; left:14px; bottom:12px; font-size:var(--t-sm); letter-spacing:.1em; color:#8E8C86}
.o-tile--words{font-family:var(--serif); font-weight:400; font-size:clamp(2.2rem,5vw,3.5rem); letter-spacing:0; line-height:1.15; text-align:center; padding:var(--s5); max-width:380px; flex:1.5}
.o-tile--words::after{display:none}

/* ── Status dot ── */
.o-dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ink-3); flex:none}
.o-dot--ok{background:var(--ok)} .o-dot--warn{background:var(--warn)} .o-dot--fail{background:var(--fail)}

/* ── Notice: a tinted block, serif first line. No coloured left edge. ── */
.o-notice{background:var(--stone); border-radius:var(--r-md); padding:var(--s4) var(--s5)}
.o-notice > strong:first-child{display:block; font-family:var(--serif); font-size:1.25rem; font-weight:600; margin-bottom:var(--s1)}
.o-notice--ok{background:var(--ok-tint)} .o-notice--warn{background:var(--warn-tint)} .o-notice--fail{background:var(--fail-tint)}

/* ── Writing view: just the note. Options slide down from the top edge (desktop)
      or on tap (phone: toggle .show-bar on .o-write). ── */
.o-write{position:relative; min-height:100dvh; background:var(--paper); padding:var(--s8) 0 var(--s8)}
.o-write__zone{position:absolute; inset:0 0 auto 0; height:44px; z-index:3}
.o-write__bar{position:absolute; inset:0 0 auto 0; z-index:4; display:flex; align-items:center; gap:var(--s5); padding:var(--s3) var(--s5);
  background:var(--paper); border-bottom:1px solid var(--stone); font-size:var(--t-sm); transform:translateY(-101%); transition:transform .25s var(--ease)}
.o-write__zone:hover + .o-write__bar,.o-write__bar:hover,.o-write__bar:focus-within,.o-write.show-bar .o-write__bar{transform:none}
.o-write__bar a,.o-write__bar button{color:var(--ink-2); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; padding:var(--s1) 0}
.o-write__bar a:hover,.o-write__bar button:hover{color:var(--accent-deep)}
.o-write__bar .o-bar__spacer{flex:1}
.o-write--fixed .o-write__zone,.o-write--fixed .o-write__bar{position:fixed}
.o-note{max-width:660px; margin:0 auto; padding:0 var(--s6)}
.o-note h1{font-size:clamp(2.2rem,5vw,2.9rem); margin-bottom:var(--s5)}
.o-note h2{font-size:1.9rem; margin-top:var(--s6)} .o-note h3{font-size:1.6rem; margin-top:var(--s5)}
.o-note p,.o-note li{font-size:1.0625rem; line-height:1.75}
.o-note .is-dim{color:var(--ink-dim); transition:color .3s}
.o-note blockquote{margin:0 0 var(--s4); padding-left:var(--s4); color:var(--ink-2); font-style:italic}
.o-md{color:var(--stone-2); font-family:var(--type); font-style:normal; font-weight:400}
.o-note h1 .o-md,.o-note h2 .o-md,.o-note h3 .o-md{font-size:1rem; vertical-align:.35em}
@media (max-width:640px){.o-note{padding:0 var(--s5)} .o-write{padding-top:var(--s7)}}

/* ── Picture mood (Trips, Wishing Stream tools; never Open Brain): a real photo or
      silent looping video leads, darkening at the bottom so white words sit on it. ── */
.o-picture{position:relative; isolation:isolate; display:flex; flex-direction:column; justify-content:flex-end; min-height:70vh; overflow:hidden;
  color:#fff; background:#2B2925 var(--img,none) center/cover no-repeat}
.o-picture__media{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2}
.o-picture::before{content:""; position:absolute; inset:0; z-index:-1;
  background:linear-gradient(to bottom,rgba(40,36,32,.18) 0%,rgba(40,36,32,0) 28%,rgba(40,36,32,.72) 100%)}
.o-picture__top{position:absolute; inset:0 0 auto 0; display:flex; justify-content:space-between; align-items:baseline; padding:var(--s4) var(--s5)}
.o-picture__top .o-wordmark{color:#fff}
.o-picture__body{padding:0 var(--s6) var(--s5)}
.o-picture__body h1,.o-picture__body h2,.o-picture__body h3{color:#fff}
.o-picture__body p{opacity:.88; max-width:42ch}
.o-picture__foot{display:flex; justify-content:space-between; align-items:center; gap:var(--s4); padding:var(--s3) var(--s6) var(--s4); border-top:1px solid rgba(255,255,255,.2); font-size:var(--t-sm)}
.o-picture__icons{display:flex; gap:var(--s5)}
.o-picture__icons svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.5}
.o-caption{font-size:var(--t-sm); opacity:.9}

/* ── Gate (locked screen): calm, on the ground; serif wordmark, a typing line, field, one button ── */
.o-gate{min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:var(--s7) var(--s5)}
.o-gate__inner{width:100%; max-width:440px; margin:0 auto}
.o-gate .o-display{margin-bottom:var(--s2)}
.o-gate .o-field{margin:var(--s5) 0 var(--s3)}

/* ── Phone: primary action in a bottom bar ── */
.o-actionbar{position:sticky; bottom:0; display:flex; gap:var(--s3); padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--ground),transparent 6%); backdrop-filter:blur(8px)}
.o-actionbar .o-btn{flex:1}

/* ══ v2.1 (Review 2, 4 Nov 2026): pieces for apps with several functions ══ */

/* ── App frame with a rail: the functions down the left (all five planners).
   .o-app > .o-rail + .o-main (+ .o-side for a timeline). On the phone the rail
   hides and .o-tabbar (five items) sits at the bottom. ── */
.o-app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
.o-app--split{grid-template-columns:232px minmax(0,1fr) 300px}
.o-rail{background:var(--ground); padding:var(--s5) var(--s3); display:flex; flex-direction:column; gap:2px}
.o-rail .o-wordmark{padding:0 var(--s3) var(--s4); font-size:1.5rem}
.o-rail__group{font-size:var(--t-xs); color:var(--ink-3); padding:var(--s4) var(--s3) var(--s1)}
.o-rail__item{display:flex; align-items:center; gap:var(--s3); padding:7px var(--s3); min-height:36px; border:0; border-radius:var(--r-sm);
  background:none; font:inherit; font-size:var(--t-sm); color:var(--ink-2); text-decoration:none; text-align:left; cursor:pointer}
.o-rail__item i{font-size:20px}
.o-rail__item .o-num{margin-left:auto; font-size:var(--t-xs); color:var(--ink-3)}
.o-rail__item:hover{background:var(--stone); color:var(--ink)}
.o-rail__item.is-current,.o-rail__item[aria-current]{background:var(--paper); color:var(--ink)}
.o-rail__item.is-current i,.o-rail__item[aria-current] i{color:var(--accent)}
.o-main{background:var(--paper); padding:var(--s6) var(--s6) var(--s7); min-width:0}
.o-side{background:var(--ground); padding:var(--s5) var(--s4); min-width:0}
.o-tabbar{display:none}
@media (max-width:760px){
  .o-app,.o-app--split{grid-template-columns:1fr}
  .o-rail,.o-side--desk{display:none}
  .o-main{padding:var(--s5) var(--s4) 96px}
  .o-tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; justify-content:space-around;
    background:var(--ground); padding:var(--s2) var(--s2) calc(var(--s3) + env(safe-area-inset-bottom))}
  .o-tabbar a,.o-tabbar button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:56px; min-height:44px;
    border:0; background:none; font:inherit; font-size:var(--t-xs); color:var(--ink-3); text-decoration:none; cursor:pointer}
  .o-tabbar i{font-size:24px}
  .o-tabbar .is-current,.o-tabbar [aria-current]{color:var(--ink)}
  .o-tabbar .is-current i,.o-tabbar [aria-current] i{color:var(--accent)}
}

/* ── Capture: one field for anything, with photo and mic buttons (Todoist's
   Write · Attach · Speak). Add .is-listening while the mic is on. ── */
.o-capture{display:flex; align-items:center; gap:var(--s2); background:var(--ground); border-radius:var(--r-md); padding:var(--s2) var(--s2) var(--s2) var(--s4); min-height:52px}
.o-capture input,.o-capture textarea{flex:1; min-width:0; border:0; background:none; font:inherit; color:var(--ink); padding:var(--s2) 0; resize:none}
.o-capture input:focus,.o-capture textarea:focus{outline:none}
.o-capture:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.o-capture__btn{display:grid; place-items:center; width:40px; height:40px; border:0; border-radius:var(--r-sm); background:none; color:var(--ink-2); cursor:pointer; font-size:22px}
.o-capture__btn:hover{background:var(--stone); color:var(--ink)}
.o-capture.is-listening{box-shadow:inset 0 0 0 1.5px var(--accent)}
.o-capture.is-listening .o-capture__mic{background:var(--accent); color:var(--on-ink)}

/* ── Task row: round tick, the words, quiet meta, a time in mono on the right (Sunsama). ── */
.o-tasks{list-style:none; margin:0; padding:0}
.o-task{display:flex; align-items:flex-start; gap:var(--s3); padding:var(--s3) 0; min-height:44px}
.o-task + .o-task{box-shadow:0 -1px 0 var(--stone)}
.o-task__tick{flex:none; width:20px; height:20px; margin-top:2px; border:0; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--ink-3);
  background:none; color:transparent; display:grid; place-items:center; font-size:13px; cursor:pointer}
.o-task__tick:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.o-task.is-done .o-task__tick{background:var(--accent); box-shadow:none; color:var(--on-ink)}
.o-task__main{flex:1; min-width:0}
.o-task__title{display:block}
.o-task.is-done .o-task__title{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-dim)}
.o-task__meta{display:block; margin-top:2px; font-size:var(--t-xs); color:var(--ink-3)}
.o-task__time{flex:none; padding-top:3px; font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
.o-task__time.is-due{color:var(--accent-deep)}

/* ── Day timeline: hours down the side. Events from calendar feeds in stone; planned
   blocks in a soft tint (data-tint); "now" in the accent. Position blocks with
   top/height from (hour - first hour) × --hour. ── */
.o-day{position:relative; --hour:52px}
.o-day__hour{height:var(--hour); display:flex; gap:var(--s2); font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
.o-day__hour::after{content:""; flex:1; height:1px; margin-top:.6em; background:var(--stone)}
.o-day__block{position:absolute; left:44px; right:0; padding:5px var(--s2); border-radius:var(--r-sm); overflow:hidden;
  font-size:var(--t-xs); line-height:1.35; background:var(--stone); color:var(--ink); --tint:var(--stone)}
.o-day__block b{display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.o-day__block small{display:block; font-size:inherit; color:var(--ink-2)}
.o-day__block[data-tint]{background:color-mix(in oklab,var(--tint),var(--paper) 78%)}
.o-day__block[data-tint="heather"]{--tint:var(--heather)} .o-day__block[data-tint="sea"]{--tint:var(--sea)} .o-day__block[data-tint="teal"]{--tint:var(--teal)}
.o-day__block[data-tint="moss"]{--tint:var(--moss)} .o-day__block[data-tint="ochre"]{--tint:var(--ochre)} .o-day__block[data-tint="blossom"]{--tint:var(--blossom)}
.o-day__now{position:absolute; left:36px; right:0; height:2px; background:var(--accent)}
.o-day__now::before{content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent)}

/* ── Suggestion: a helper's proposal waiting for a yes. Nothing is filed until Stewart taps.
   .o-suggest > __said (with .o-meta) + __to (icon + one <span> of words) + __acts; .is-filed after. ── */
.o-suggest{background:var(--ground); border-radius:var(--r-md); padding:var(--s4)}
.o-suggest + .o-suggest{margin-top:var(--s3)}
.o-suggest__said{margin:0 0 var(--s3)}
.o-suggest__said .o-meta{display:block; margin-bottom:var(--s1)}
.o-suggest__to{display:flex; align-items:flex-start; gap:var(--s2); margin-bottom:var(--s3); font-size:var(--t-sm)}
.o-suggest__to i{flex:none; margin-top:1px; font-size:18px; color:var(--accent)}
.o-suggest__to > span{flex:1; min-width:0}
.o-suggest__acts{display:flex; flex-wrap:wrap; gap:var(--s2)}
.o-suggest.is-filed{opacity:.55}
.o-suggest.is-filed .o-suggest__acts{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important; animation:none!important}}
/* otter:end */


  /* AI Desk in Otter (moss), 5 Nov 2026: greige ground, paper panels, typewriter
     words, serif titles. The section colours, capitals and pills of the old
     night-purple look are gone; the moss accent marks only the current place.
     The faint code ripple stays, in quiet ink. Ids and classes are unchanged. */

  *{box-sizing:border-box}
  html{background:var(--ground)} html,body{margin:0;color:var(--ink);font-family:var(--type);font-size:16px;line-height:1.6}
  body{background:none} /* lets the code-ripple canvas sit behind the page */
  a{color:var(--accent-deep)}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  /* ---- sidebar ---- */
  nav{background:var(--paper);border-right:1px solid var(--stone-2);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-family:var(--serif);font-size:22px;font-weight:600;padding:0 8px 2px}
  .brand-sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:0 8px 16px;letter-spacing:.04em}
  .search{width:100%;background:var(--ground);border:1px solid var(--stone-2);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:13px;margin-bottom:14px}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  .sec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-2);font-size:15px}
  .sec:hover{background:var(--stone);color:var(--ink)}
  .sec.on{background:var(--stone);color:var(--ink);box-shadow:inset 3px 0 0 var(--sec-colour,var(--accent))}
  .sec .dot{width:8px;height:8px;border-radius:50%;background:var(--sec-colour,var(--accent));flex:none}
  .sec .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .navfoot{margin-top:18px;padding:12px 8px 0;border-top:1px solid var(--stone);font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .navfoot .apps{margin-top:10px}
  .navfoot .apps a{color:var(--ink-2)}
  .navfoot button{background:none;border:1px solid var(--stone-2);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink-2);font-family:var(--mono);font-size:11px;margin-top:6px}
  /* ---- main ---- */
  main{display:grid;grid-template-columns:minmax(220px,320px) 1fr;min-width:0}
  .list{border-right:1px solid var(--stone-2);padding:20px 14px;overflow:auto;height:100vh;position:sticky;top:0}
  .list h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 6px 4px}
  .list .blurb{color:var(--ink-3);font-size:13px;margin:0 6px 14px}
  .item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:4px}
  .item:hover{background:var(--paper)}
  .item.on{background:var(--paper);border-color:var(--stone-2)}
  .item .t{font-size:15px;line-height:1.3}
  .item .m{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px}
  .detail{padding:28px 36px 60px;min-width:0;max-width:880px}
  .detail.wide{max-width:1240px}
  .detail.wide .body{max-width:808px}
  .detail.wide .body.has-table{max-width:none}
  .detail.wide .body.has-table > :not(.rg){max-width:808px}
  .crumb{font-family:var(--mono);font-size:11px;color:var(--sec-colour,var(--accent))}
  .detail h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;margin:6px 0 4px}
  .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .chip{background:var(--paper);border:1px solid var(--stone-2);border-radius:var(--r-sm);padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
  .chip:hover{color:var(--ink);border-color:var(--accent)}
  .body h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:26px 0 6px;padding-top:6px;border-top:1px solid var(--stone);scroll-margin-top:16px}
  .body h3{font-size:17px;margin:18px 0 4px}
  .body ul{padding-left:22px;margin:6px 0}
  .body li{margin:3px 0}
  .body p{margin:8px 0}
  .body blockquote{margin:12px 0;padding:12px 16px;background:var(--paper);border-left:3px solid var(--accent);border-radius:6px;position:relative}
  .body blockquote .copy{position:absolute;top:8px;right:8px;background:var(--stone);border:1px solid var(--stone-2);border-radius:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;cursor:pointer;color:var(--ink-2)}
  .body code{font-family:var(--mono);font-size:.9em;background:var(--paper);padding:1px 5px;border-radius:4px}
  .tbl{overflow-x:auto;margin:12px 0}
  .body table{border-collapse:collapse;font-size:14px;min-width:520px}
  .body th,.body td{border-bottom:1px solid var(--stone-2);padding:7px 10px;text-align:left;vertical-align:top}
  .body th{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .empty{color:var(--ink-3);padding:40px 0}
  /* ---- system health ---- */
  .hdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--st);flex:none;margin-right:7px;vertical-align:1px}
  .hdot.paused{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
  .item.paused{opacity:.55}
  .cloud{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--sea);border:1px solid var(--sea);border-radius:var(--r-sm);padding:0 6px;margin-left:6px;vertical-align:1px}
  .hbar{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:0 6px 12px}
  .hbar button{background:none;border:1px solid var(--stone-2);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--ink-2);font-family:var(--mono);font-size:11px;margin-top:6px}
  .key{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;margin:12px 0}
  .key .hdot{margin-top:6px}
  .item .t{overflow-wrap:anywhere}
  .htbl table{min-width:0;width:100%}
  .htbl th{white-space:nowrap;width:1%}
  .backbtn{display:none}
  .navgroup{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding:14px 10px 4px;border-top:1px solid var(--stone);margin-top:10px}
  /* ---- model scores ---- */
  .sc-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
  .sc-bar button{background:var(--paper);border:1px solid var(--stone-2);border-radius:var(--r-sm);padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
  .sc-bar button.on{color:var(--ground);background:var(--accent);border-color:var(--accent)}
  .sc-bar label{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center;margin-left:auto;cursor:pointer}
  .sc .tbl{margin:0 0 8px}
  .sc table{border-collapse:separate;border-spacing:2px;font-size:13px;min-width:0}
  .sc th,.sc td{border:0;padding:6px 5px;text-align:center;white-space:nowrap}
  .sc th{font-family:var(--mono);font-size:10px;color:var(--ink-2);cursor:pointer;vertical-align:bottom;white-space:normal;min-width:48px;line-height:1.25}
  .sc th.on{color:var(--accent)}
  .sc th.m,.sc td.m{text-align:left;position:sticky;left:0;background:var(--ground);z-index:1;min-width:132px}
  .sc td.m .lab{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .sc td.v{font-family:var(--mono);border-radius:5px;background:color-mix(in srgb,var(--moss) var(--h),transparent)}
  .sc td.v.best{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
  .sc td.v.na{color:var(--ink-3);background:none}
  .sc tr.ours td.m{box-shadow:inset 3px 0 0 var(--ok)}
  .route{display:inline-block;font-family:var(--mono);font-size:10px;border-radius:var(--r-sm);padding:0 6px;margin-top:2px;border:1px solid currentColor}
  .route.inuse{color:var(--ok)} .route.possible{color:var(--accent)} .route.selfhost{color:var(--sea)} .route.eu{color:var(--heather)}
  .bars{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:5px 10px;align-items:center;font-size:14px;margin:6px 0 10px}
  .bars .track{height:16px;background:var(--paper);border-radius:4px;overflow:hidden}
  .bars .fill{height:100%;background:var(--moss);border-radius:4px}
  .bars .ours .fill{background:var(--ok)}
  .bars .val{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;min-width:42px}
  .bars .nm.ours{color:var(--ok)}
  .sc-key{font-size:13px;color:var(--ink-3);margin:0 0 6px}
  .body pre{background:var(--paper);padding:10px 12px;border-radius:6px;overflow-x:auto;font-size:12px}
  /* ---- page tools (Download PDF) and editable tables ---- */
  .tools{float:right;display:flex;gap:6px;margin:2px 0 8px 12px}
  .tools button,.rg-bar button,.rg-bar label,.rgform button{background:var(--paper);border:1px solid var(--stone-2);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink-2);font-family:var(--mono);font-size:12px}
  .tools button:hover,.rg-bar button:hover,.rg-bar label:hover,.rgform button:hover{color:var(--ink);border-color:var(--accent)}
  .rg-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
  .rg-bar .note{font-size:13px;color:var(--ink-3);margin-left:4px}
  .rg-view{display:inline-flex;border:1px solid var(--stone-2);border-radius:var(--r-sm);overflow:hidden;margin-right:6px}
  .rg-view button{background:none;border:0;border-radius:0;padding:4px 12px;font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer}
  .rg-view button.on{background:var(--accent);color:var(--ground)}
  /* Table view: the box is at most a screen tall, so its header row stays put
     and its sideways scrollbar is always in sight; a second one sits on top. */
  .rg .tbl{margin:0 0 12px;max-height:78vh;overflow:auto;border:1px solid var(--stone-2);border-radius:8px}
  .rg thead th{position:sticky;top:0;background:var(--paper);z-index:2}
  .rg thead th:first-child{z-index:3;background:var(--paper)}
  .rg-top{overflow-x:auto;overflow-y:hidden;height:14px;margin:0 0 4px}
  .rg-top div{height:1px}
  /* Card view: one project per card, every field labelled. */
  .rg-cards{display:grid;gap:12px;margin:0 0 14px}
  .rg-card{background:var(--paper);border:1px solid var(--stone-2);border-radius:10px;padding:14px 18px}
  .rg-card.edit{cursor:pointer}
  .rg-card.edit:hover{border-color:var(--accent)}
  .rg-card h3{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25;margin:0 0 10px}
  .rg-card dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 22px;margin:0}
  .rg-card dl > div.long{grid-column:1/-1}

          if (k <= 0) continue;
          const e = k * k * fade * (0.25 + 1.1 * n), push = e * 6 / (d || 1);
          ctx.globalAlpha = Math.min(1, e * C.peak);
          ctx.fillText(Math.random() < e * 0.4 ? GLYPHS[Math.random() * GLYPHS.length | 0] : s[j], px - cw / 2 + dx * push, i * lh + 3 + dy * push);
        }
      }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  function ripple(e){
    if (still.matches || e.button > 0 || e.target.closest?.("input,textarea,select,[contenteditable]")) return;
    const r = C.mode === "page" ? { left: 0, top: 0 } : host.getBoundingClientRect();
    waves.push(wave(e.clientX - r.left, e.clientY - r.top, Math.hypot(W, H) * (C.mode === "page" ? 0.55 : 0.8), 0));
    if (waves.length > 48) waves.splice(0, waves.length - 48);
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function attach(){
    host = C.mode === "page" ? document.body : document.querySelector(C.mode);
    if (!host) return false;
    if (!cv.isConnected) host.prepend(cv);
    layout();
    (C.mode === "page" ? document : host).addEventListener("pointerdown", ripple, { passive: true });
    return true;
  }

  function start(){
    if (C.mode === "page") {
      attach();
      // An unlock screen may swap the whole body out; put the canvas back when it does.
      new MutationObserver(() => { if (!cv.isConnected) document.body.prepend(cv); }).observe(document.body, { childList: true });
    } else if (!attach()) {
      const mo = new MutationObserver(() => { if (attach()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    let t; const again = () => { clearTimeout(t); t = setTimeout(() => host && layout(), 150); };
    addEventListener("resize", again);
    new ResizeObserver(again).observe(C.mode === "page" ? document.documentElement : document.body);
    // Re-colour when the light/dark theme changes.
    new MutationObserver(() => host && paintBase()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => host && paintBase());
    if (document.fonts) document.fonts.ready.then(() => host && layout());
  }
  document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", start) : start();
})();
</script>

  // <owner>

  // </owner>
];

// Model scores (7 Oct 2026): a note tagged "AI model scores" carries its data

const SCORE_TAG = 'AI model scores';
const SCORE_COLS = [
  { k: 'overall',  label: 'Overall',        tip: 'Artificial Analysis Intelligence Index, 0–100' },
  { k: 'work',     label: 'Office work',    tip: 'GDPval-AA: real professional tasks, 0–100' },
  { k: 'hle',      label: 'Hard questions', tip: 'Humanity’s Last Exam, %' },
  { k: 'coding',   label: 'Agentic coding', tip: 'Terminal-Bench, %' },
  { k: 'banking',  label: 'Banking agent',  tip: 'τ³-Banking, %' },
  { k: 'longdocs', label: 'Long docs',      tip: 'AA-LCR long-context reasoning, %' },
  { k: 'accuracy', label: 'Accuracy',       tip: 'AA-Omniscience: right minus wrong, −100 to 100' },
  { k: 'science',  label: 'Science',        tip: 'GPQA Diamond, %' },

];

let scoreView = { mode: 'grid', sort: 'overall', metric: 'overall', usable: false };

const HEALTH = '__health';
// <owner>
// System health (added 5 Oct 2026): not notes, but the current state of the
// health check, read from the system-health function with the same key. One
// dot per check; the nav dot takes the worst colour. See the system-health
// skill for what each status means.
const HEALTH_URL = MCP_URL.replace('open-brain-mcp', 'system-health');
const STATUS = {

  waiting: { label: 'Waiting for the Mac', colour: 'var(--ink-3)' },
  unknown: { label: 'Not checked', colour: 'var(--ink-3)' },
  late:    { label: 'Ran late: Mac was off', colour: 'var(--ok)' },
  ok:      { label: 'Working', colour: 'var(--ok)' },
  paused:  { label: 'Paused', colour: 'var(--ink-3)' },
};
const RANK = { fail: 6, warn: 5, waiting: 4, unknown: 3, late: 2, ok: 1, paused: 0 };
let health = null, healthErr = '';

let accessKey = '';
try { accessKey = localStorage.getItem(KEY_STORAGE) || ''; } catch (_) {}
// </owner>
let notes = [];
let loadedAt = null;

try { const s = JSON.parse(sessionStorage.getItem('aidesk.view') || 'null'); if (s && s.section) state = { ...state, ...s, query: '' }; } catch (_) {}

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// One raw note row (as list_thoughts json returns it) to what the views use.
function toNote(r) {
  const m = r.metadata || {};
  const topics = Array.isArray(m.topics) ? m.topics : [];
  const content = r.content || '';
  const firstHeading = (content.match(/^#\s+(.+)$/m) || [])[1];
  return {
    id: r.id, content, topics,

    created: r.created_at || '',
    section: (SECTIONS.find(s => topics.includes(s.tag)) || {}).tag || null,
  };
}
// Newest first, except the model scores note, which leads its section.
const noteOrder = (a, b) => (b.topics.includes(SCORE_TAG) - a.topics.includes(SCORE_TAG)) || (b.date + b.created).localeCompare(a.date + a.created);

// <owner>
/* ---------- server ---------- */
async function callTool(name, args) {
  let res;
  try {
    res = await fetch(MCP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream', 'x-brain-key': accessKey },
      body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method: 'tools/call', params: { name, arguments: args } }),
    });
  } catch (e) { throw new Error('Could not reach Open Brain. Check the connection.'); }
  const raw = await res.text();
  let payload;
  if ((res.headers.get('Content-Type') || '').includes('text/event-stream')) {
    const line = raw.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).reverse().find(l => l.startsWith('{'));
    payload = line ? JSON.parse(line) : {};
  } else payload = raw.trim() ? JSON.parse(raw) : {};
  // An invalid key comes back as HTTP 200 with JSON-RPC error -32001.
  if (!res.ok || payload.error) {
    const msg = (payload.error && payload.error.message) || ('HTTP ' + res.status);
    if (res.status === 401 || res.status === 403 || (payload.error && (payload.error.code === -32001 || /unauthor/i.test(msg)))) {
      const e = new Error('That key was rejected.'); e.auth = true; throw e;
    }
    throw new Error(msg);
  }
  const block = ((payload.result && payload.result.content) || []).find(b => b.type === 'text');
  return block ? block.text : '';
}

// Never throws: a broken health check must not stop the notes loading.
async function loadHealth(runFirst) {
  try {
    if (runFirst) {
      const r = await fetch(HEALTH_URL + '/run', { method: 'POST', headers: { 'x-brain-key': accessKey } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
    }
    const res = await fetch(HEALTH_URL, { headers: { 'x-brain-key': accessKey } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    health = await res.json(); healthErr = '';
  } catch (e) { healthErr = 'Could not load the health check (' + e.message + ').'; }
}

async function load() {
  const healthLoaded = loadHealth(false);
  const text = await callTool('list_thoughts', { topic: DASH_TAG, limit: 300, format: 'json', include_shelved: true });
  await healthLoaded;
  let arr = [];
  try { arr = JSON.parse(text); } catch (_) { arr = []; }
  notes = (Array.isArray(arr) ? arr : []).map(toNote).sort(noteOrder);
  loadedAt = new Date();
}
// </owner>

/* ---------- markdown (small, escape-first) ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(·])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48) + (url.length > 60 ? '…' : '') + '</a>');
  return s;
}
const slug = (s) => 'h-' + String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function md(src, dropTitle) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = [], list = null, quote = [], table = [], headings = [];
  const flushList = () => { if (list) { out.push('<ul>' + list.map(li => '<li>' + inline(li) + '</li>').join('') + '</ul>'); list = null; } };
  const flushQuote = () => { if (quote.length) { const txt = quote.join('\n'); out.push('<blockquote data-copy="' + esc(txt) + '"><button class="copy">Copy</button>' + quote.map(inline).join('<br>') + '</blockquote>'); quote = []; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    const [head, ...body] = rows;
    out.push('<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
      body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
    table = [];
  };
  const flushAll = () => { flushList(); flushQuote(); flushTable(); };
  let titleDropped = !dropTitle, fence = null;
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('```')) { flushAll(); if (fence) { out.push('<pre>' + esc(fence.join('\n')) + '</pre>'); fence = null; } else fence = []; continue; }
    if (fence) { fence.push(line); continue; }
    if (!titleDropped && /^#\s+/.test(t)) { titleDropped = true; continue; }
    if (t.startsWith('|')) { flushList(); flushQuote(); table.push(t); continue; }
    if (t.startsWith('>')) { flushList(); flushTable(); quote.push(t.replace(/^>\s?/, '')); continue; }
    const li = t.match(/^[-*•]\s+(.*)$/);
    if (li) { flushQuote(); flushTable(); (list = list || []).push(li[1]); continue; }
    flushAll();
    if (!t) continue;
    const h = t.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const level = Math.max(2, h[1].length);
      if (level === 2) headings.push(h[2]);
      out.push('<h' + level + ' id="' + slug(h[2]) + '">' + inline(h[2]) + '</h' + level + '>');
    } else if (/^[A-Z0-9][A-Z0-9 ,'&()\-–—]{3,}$/.test(t) && t.length < 80) {
      // Notes written with SHOUTED headings (e.g. "2. WHAT'S RULED IN AND OUT")
      headings.push(t); out.push('<h2 id="' + slug(t) + '">' + inline(t.charAt(0) + t.slice(1).toLowerCase()) + '</h2>');
    } else out.push('<p>' + inline(t) + '</p>');
  }
  flushAll();
  if (fence) out.push('<pre>' + esc(fence.join('\n')) + '</pre>');
  return { html: out.join('\n'), headings };
}

/* ---------- model scores ---------- */
// Splits the ```scores block out of a note: { rows, rest } (rows null if none).
function extractScores(content) {
  const m = content.match(/```scores\s*\n([\s\S]*?)\n```/);
  if (!m) return { rows: null, rest: content };
  let rows = null;
  try { rows = JSON.parse(m[1]); } catch (_) {}
  return { rows: Array.isArray(rows) ? rows : null, rest: content.replace(m[0], '') };
}

function scoresHtml(all) {
  const rows = scoreView.usable ? all.filter(r => r.route && r.route !== 'none') : all.slice();
  const col = (k) => SCORE_COLS.find(c => c.k === k);
  const range = {};
  for (const c of SCORE_COLS) {
    const vs = all.map(r => r[c.k]).filter(v => typeof v === 'number');
    range[c.k] = vs.length ? [Math.min(...vs), Math.max(...vs)] : [0, 1];
  }
  // 0 = worst in the column, 1 = best (price inverted).
  const rel = (c, v) => { const [lo, hi] = range[c.k]; const t = hi === lo ? 1 : (v - lo) / (hi - lo); return c.low ? 1 - t : t; };
  const fmt = (c, v) => typeof v !== 'number' ? '–' : c.k === 'price' ? '$' + (v < 1 ? v.toFixed(2) : v.toFixed(v % 1 ? 2 : 0)) : String(v);
  const byKey = (k) => (a, b) => {
    const c = col(k), av = a[k], bv = b[k];
    if (typeof av !== 'number') return 1; if (typeof bv !== 'number') return -1;
    return c.low ? av - bv : bv - av;
  };
  const routeTag = (r) => ROUTES[r.route] ? '<span class="route ' + esc(r.route) + '">' + esc(ROUTES[r.route]) + '</span>' : '';
  const name = (r) => esc(r.model) + '<span class="lab">' + esc(r.lab) + (r.setting ? ' · ' + esc(r.setting) : '') + '</span>' + routeTag(r);

  let view;
  if (scoreView.mode === 'grid') {
    rows.sort(byKey(scoreView.sort));
    view = '<p class="sc-key">Deeper green is better within each column; the gold outline marks the leader. Tap a column to rank by it.</p>' +
      '<div class="tbl"><table><thead><tr><th class="m">Model</th>' +
      SCORE_COLS.map(c => '<th title="' + esc(c.tip) + '" data-ssort="' + c.k + '"' + (c.k === scoreView.sort ? ' class="on"' : '') + '>' + esc(c.label) + (c.k === scoreView.sort ? ' ▾' : '') + '</th>').join('') +
      '</tr></thead><tbody>' +
      rows.map(r => '<tr' + (r.route === 'inuse' ? ' class="ours"' : '') + '><td class="m">' + name(r) + '</td>' +
        SCORE_COLS.map(c => {
          const v = r[c.k];
          if (typeof v !== 'number') return '<td class="v na" title="Not tested yet">–</td>';
          const t = rel(c, v);
          const best = all.every(o => typeof o[c.k] !== 'number' || rel(c, o[c.k]) <= t);
          return '<td class="v' + (best ? ' best' : '') + '" style="--h:' + Math.round(8 + t * 62) + '%" title="' + esc(c.tip) + '">' + fmt(c, v) + '</td>';
        }).join('') + '</tr>').join('') +
      '</tbody></table></div>';
  } else {
    const c = col(scoreView.metric);
    const ranked = rows.filter(r => typeof r[c.k] === 'number').sort(byKey(c.k));
    const missing = rows.length - ranked.length;
    view = '<div class="sc-bar">' + SCORE_COLS.map(o => '<button data-smetric="' + o.k + '"' + (o.k === c.k ? ' class="on"' : '') + '>' + esc(o.label) + '</button>').join('') + '</div>' +
      '<p class="sc-key">' + esc(c.tip) + (missing ? ' · ' + missing + ' not tested yet' : '') + '</p>' +
      '<div class="bars">' + ranked.map(r => {
        const ours = r.route === 'inuse' ? ' ours' : '';
        return '<div class="nm' + ours + '">' + esc(r.model) + '</div><div class="track' + ours + '"><div class="fill" style="width:' + Math.max(3, Math.round(rel(c, r[c.k]) * 100)) + '%"></div></div><div class="val">' + fmt(c, r[c.k]) + '</div>';
      }).join('') + '</div>';
  }
  return '<div class="sc"><div class="sc-bar">' +
    '<button data-smode="grid"' + (scoreView.mode === 'grid' ? ' class="on"' : '') + '>Grid</button>' +
    '<button data-smode="bars"' + (scoreView.mode === 'bars' ? ' class="on"' : '') + '>Ranked bars</button>' +
    '<label><input type="checkbox" data-susable' + (scoreView.usable ? ' checked' : '') + '> Only models we could use</label></div>' +
    view + '</div>';
}

/* ---------- tables ---------- */
// Tables (14 Oct 2026): a note can carry a ```table JSON block,
// {"columns":[{"k","label","long"?}],"rows":[{k: text}]}, drawn as a table
// above the note's text. On the owner's desk rows are added and edited in the
// page and saved back to the note; the table also goes out and comes back in
// as CSV (for Excel), and out as PDF like any page.
const TABLE_RE = /```table\s*\n([\s\S]*?)\n```/;
function extractTable(content) {
  const m = content.match(TABLE_RE);
  if (!m) return { table: null, rest: content };
  let t = null;
  try { t = JSON.parse(m[1]); } catch (_) {}
  if (!t || !Array.isArray(t.columns) || !Array.isArray(t.rows)) return { table: null, rest: content };
  // The table is drawn where the block sits, so text before it reads as an intro.
  return { table: t, rest: content.replace(m[0], ''), before: content.slice(0, m.index), after: content.slice(m.index + m[0].length) };
}

let EDITABLE = false;
EDITABLE = true; // owner
let tableEdit = null; // { noteId, index }: the row open in the form; index -1 is a new row
// Cards or table, remembered per browser. Cards read better on screen; the
// table is for comparing across projects.
let tableView = 'cards';
try { if (localStorage.getItem('aidesk.tableView') === 'table') tableView = 'table'; } catch (_) {}

function tableHtml(note, t) {
  const cols = t.columns;
  const cell = (c, r) => {
    const v = String(r[c.k] ?? '').trim();
    return '<td class="' + (c.long ? 'long' : '') + (v ? '' : ' empty-cell') + '">' + (v ? inline(v).replace(/\n/g, '<br>') : '–') + '</td>';
  };
  const edit = (i) => EDITABLE ? ' edit" data-trow="' + i : '';
  let h = '<div class="rg">';
  h += '<div class="rg-bar"><span class="rg-view"><button data-tview="cards"' + (tableView === 'cards' ? ' class="on"' : '') + '>Cards</button><button data-tview="table"' + (tableView === 'table' ? ' class="on"' : '') + '>Table</button></span></div>';
  h += '<div class="rg-bar"><button data-tadd>Add a row</button><button data-tcsv>Download CSV</button><label>Upload CSV<input type="file" accept=".csv,text/csv" data-tupload hidden></label><span class="note">' + t.rows.length + ' rows · tap a row to edit it</span></div>'; // owner
  if (tableEdit && tableEdit.noteId === note.id) h += rowForm(t); // owner
  if (tableView === 'cards') {
    const [head, ...rest] = cols;

const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

// One row per line, so the note stays readable in the catalog. A backtick in a
// cell is written as ` so it can't close the ``` fence.
function tableBlock(t) {
  const j = (v) => JSON.stringify(v).replace(/`/g, '\\u0060');
  return '```table\n{"columns":[\n' + t.columns.map(j).join(',\n') + '\n],"rows":[\n' + t.rows.map(j).join(',\n') + '\n]}\n```';
}

// Writes the table back into its note. Throws on failure, leaving the note as it was.
async function saveTable(note, t) {
  const block = tableBlock(t);
  const m = note.content.match(TABLE_RE);
  const content = m ? note.content.replace(m[0], () => block) : block + '\n\n' + note.content;
  const date = todayISO();
  await callTool('update_thought', { id: note.id, content, updated_date: date });
  note.content = content; note.date = date;
}

function tableCsv(t) {
  const q = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [t.columns.map(c => q(c.label)), ...t.rows.map(r => t.columns.map(c => q(r[c.k])))].map(l => l.join(',')).join('\r\n');
}

function parseCsv(text) {
  text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const rows = []; let row = [], f = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) { if (ch !== '"') f += ch; else if (text[i + 1] === '"') { f += '"'; i++; } else quoted = false; }
    else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

const fileName = (s) => String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100) || 'AI Desk';

function downloadCsv(note, t) {
  const a = document.createElement('a');
  // The byte-order mark makes Excel read the file as UTF-8 (accents, dashes).
  a.href = URL.createObjectURL(new Blob(['﻿' + tableCsv(t)], { type: 'text/csv;charset=utf-8' }));
  a.download = fileName(note.title) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// Upload replaces every row with the file's rows. Columns are matched by
// heading (or key), so a CSV downloaded here, edited in Excel and uploaded
// comes straight back; columns the table doesn't have are reported and skipped.
async function uploadCsv(file) {
  const note = currentNote(); if (!note) return;
  const { table: t } = extractTable(note.content); if (!t) return;
  const [head, ...body] = parseCsv(await file.text());
  if (!head) { alert('That file is empty.'); return; }
  const norm = (s) => String(s).trim().toLowerCase();
  const map = head.map(h => (t.columns.find(c => norm(c.label) === norm(h) || norm(c.k) === norm(h)) || {}).k || null);
  if (!map.some(Boolean)) { alert('None of the file’s column headings match this table. Download the CSV first and edit that.'); return; }
  const skipped = head.filter((h, i) => !map[i] && h.trim());
  const rows = body.map(r => { const o = {}; map.forEach((k, i) => { if (k) o[k] = (r[i] || '').trim(); }); return o; });
  if (!confirm('Replace the ' + t.rows.length + ' rows in “' + note.title + '” with the ' + rows.length + ' rows in this file?' + (skipped.length ? '\n\nThese columns aren’t in the table and will be skipped: ' + skipped.join(', ') : ''))) return;
  t.rows = rows;
  try { await saveTable(note, t); tableEdit = null; render(); }
  catch (e) { alert('Could not save: ' + e.message); }
}

// The scrollbar above a wide table mirrors the table's own, so it can be
// scrolled sideways from the top. Hidden when the table fits.
function setupTableScroll() {
  for (const top of document.querySelectorAll('.rg-top')) {
    const box = top.nextElementSibling;
    top.firstChild.style.width = box.scrollWidth + 'px';
    top.style.display = box.scrollWidth > box.clientWidth + 1 ? '' : 'none';
    // Copying an equal value fires no event, so the two can't loop.
    const mirror = (from, to) => () => { if (to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft; };
    top.onscroll = mirror(top, box); box.onscroll = mirror(box, top);

}

  if (t.dataset.check) { state.noteId = t.dataset.check; state.reading = true; render(); window.scrollTo(0, 0); return; } // owner
  if (t.hasAttribute('data-healthrun')) { t.textContent = 'Checking…'; t.disabled = true; await loadHealth(true); render(); return; } // owner
  if (t.dataset.tview) { tableView = t.dataset.tview; try { localStorage.setItem('aidesk.tableView', tableView); } catch (_) {} render(); return; }
  if (t.hasAttribute('data-top')) { window.scrollTo({ top: 0, behavior: 'smooth' }); const d = $('.detail'); if (d) d.scrollTop = 0; return; }
  if (t.dataset.ssort) { scoreView.sort = t.dataset.ssort; render(); return; }
  if (t.dataset.smode) { scoreView.mode = t.dataset.smode; render(); return; }
  if (t.dataset.smetric) { scoreView.metric = t.dataset.smetric; render(); return; }
  if (t.hasAttribute('data-susable')) { scoreView.usable = t.checked; render(); return; }
  if (t.hasAttribute('data-forget')) { try { localStorage.removeItem('aidesk-pass'); } catch (_) {} location.reload(); return; }
  if (t.matches('.copy')) {
    const txt = t.parentElement.getAttribute('data-copy');
    try { await navigator.clipboard.writeText(txt); t.textContent = 'Copied'; setTimeout(() => (t.textContent = 'Copy'), 1500); } catch (_) { t.textContent = 'Select & copy'; }
    return;
  }
  if (t.dataset.sec) { state = { ...state, section: t.dataset.sec, noteId: null, query: '', reading: false }; render(); return; }
  if (t.dataset.note) { state.noteId = t.dataset.note; state.reading = true; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.hasAttribute('data-back')) { state.reading = false; render(); return; }
  if (t.hasAttribute('data-refresh')) { t.textContent = 'Loading…'; try { await load(); } catch (_) {} render(); return; } // owner
  if (t.hasAttribute('data-lock')) { if (confirm('Remove the access key from AI Desk in this browser? The catalog keeps its own copy.')) { try { localStorage.removeItem(KEY_STORAGE); localStorage.setItem('ob.keyStop', '1'); } catch (_) {} accessKey = ''; notes = []; showUnlock(); } } // owner
});
// <owner>
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-tform]');
  if (!f) return;
  e.preventDefault();
  const n = currentNote(), tb = n && extractTable(n.content).table;
  if (!tb || !tableEdit) return;
  const row = {};
  for (const c of tb.columns) row[c.k] = (f.elements[c.k] ? f.elements[c.k].value : '').trim();
  if (!Object.values(row).some(Boolean)) { $('#terr').textContent = 'Fill in at least one field.'; return; }
  if (tableEdit.index >= 0 && tb.rows[tableEdit.index]) tb.rows[tableEdit.index] = { ...tb.rows[tableEdit.index], ...row };
  else tb.rows.push(row);
  const btn = f.querySelector('.save'); btn.disabled = true; btn.textContent = 'Saving…';
  try { await saveTable(n, tb); tableEdit = null; render(); }
  catch (err) { btn.disabled = false; btn.textContent = 'Save to Open Brain'; $('#terr').textContent = 'Could not save: ' + err.message; }
});
document.addEventListener('change', (e) => {
  if (!e.target.matches('[data-tupload]') || !e.target.files[0]) return;
  uploadCsv(e.target.files[0]); e.target.value = '';
});
// </owner>
let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.query = e.target.value; state.noteId = null; state.reading = false;
    const pos = e.target.selectionStart; render();
    const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
    if (state.query) { const first = visibleNotes()[0]; if (first) { state.noteId = first.id; render(); const q2 = $('#q'); q2.focus(); q2.setSelectionRange(pos, pos); } }
  }, 180);
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement && document.activeElement.id !== 'q' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); const q = $('#q'); if (q) q.focus(); }
});
start();
</script>
</body>
</html>
