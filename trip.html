/* ── Typewriter faces: iA Writer Quattro (words) and Mono (numbers). SIL OFL, pinned. ── */
@font-face{font-family:"iA Quattro";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Regular.woff2") format("woff2")}
@font-face{font-family:"iA Quattro";font-weight:400;font-style:italic;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Italic.woff2") format("woff2")}
@font-face{font-family:"iA Quattro";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-Bold.woff2") format("woff2")}
@font-face{font-family:"iA Quattro";font-weight:700;font-style:italic;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Quattro/Webfonts/iAWriterQuattroS-BoldItalic.woff2") format("woff2")}
@font-face{font-family:"iA Mono";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Regular.woff2") format("woff2")}
@font-face{font-family:"iA Mono";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/iaolo/iA-Fonts@c6588670c71e9ac628acc27b72cde4bf12726b7f/iA%20Writer%20Mono/Webfonts/iAWriterMonoS-Bold.woff2") format("woff2")}

:root{
  /* ── Earthy hues: one per app, used as a light touch ── */
  --heather:#7A5C8E; --sea:#3E6E8E; --teal:#3F7A7B; --moss:#5E7A4A; --ochre:#A8741C; --blossom:#B0566F;

  /* ── Signals (same in every app) ── */
  --ok:#5E7A4A; --warn:#A8741C; --fail:#A8473A;

  /* ── Type: typewriter for words, a quiet serif for feeling, mono for figures ── */
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --type:"iA Quattro",ui-monospace,"SF Mono",Menlo,monospace;
  --mono:"iA Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --t-xs:.75rem; --t-sm:.8125rem; --t-md:1rem; --t-lg:1.0625rem;
  --t-xl:1.625rem; --t-2xl:2.25rem; --t-3xl:3rem; --t-4xl:4.5rem;

  /* ── Space (4px steps) and shape ── */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:18px;
  --ease:cubic-bezier(.2,.7,.3,1);

  --accent:var(--heather);
}
[data-hue="heather"]{--accent:var(--heather)}
[data-hue="sea"]    {--accent:var(--sea)}
[data-hue="teal"]   {--accent:var(--teal)}
[data-hue="moss"]   {--accent:var(--moss)}
[data-hue="ochre"]  {--accent:var(--ochre)}
[data-hue="blossom"]{--accent:var(--blossom)}

/* ── Light: Kim Klassen's greige and charcoal. Roles live on every [data-hue] too. ── */
:root,[data-hue]{
  --ground:#EDEBE7;   /* the page */
  --paper:#F6F5F2;    /* the note, rows, panels */
  --stone:#E1DFD8;    /* fields, chips, tracks */
  --stone-2:#CAC4BE;  /* rules, faded marks */
  --taupe:#908077;    /* the ticker */
  --ink:#3D3D39; --ink-2:#6B6A64; --ink-3:#9C9A93; --ink-dim:#B9B6AE;
  --on-ink:#F6F5F2;
  --accent-tint:color-mix(in oklab,var(--accent),var(--paper) 86%);
  --accent-deep:color-mix(in oklab,var(--accent),black 18%);
  --ok-tint:color-mix(in oklab,var(--ok),var(--paper) 84%);
  --warn-tint:color-mix(in oklab,var(--warn),var(--paper) 84%);
  --fail-tint:color-mix(in oklab,var(--fail),var(--paper) 86%);
  color-scheme:light;
}
/* ── Dark: warm charcoal, not blue-black ── */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]),:root:not([data-theme="light"]) [data-hue]{
    --ground:#1C1B19; --paper:#252421; --stone:#302E2B; --stone-2:#4A4743; --taupe:#5E544D;
    --ink:#E8E5DF; --ink-2:#B3AFA7; --ink-3:#85827B; --ink-dim:#5C5954; --on-ink:#1C1B19;
    --accent-tint:color-mix(in oklab,var(--accent),var(--paper) 72%);
    --accent-deep:color-mix(in oklab,var(--accent),white 30%);
    --ok-tint:color-mix(in oklab,var(--ok),var(--paper) 70%);
    --warn-tint:color-mix(in oklab,var(--warn),var(--paper) 70%);
    --fail-tint:color-mix(in oklab,var(--fail),var(--paper) 70%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-theme="dark"] [data-hue]{
  --ground:#1C1B19; --paper:#252421; --stone:#302E2B; --stone-2:#4A4743; --taupe:#5E544D;
  --ink:#E8E5DF; --ink-2:#B3AFA7; --ink-3:#85827B; --ink-dim:#5C5954; --on-ink:#1C1B19;
  --accent-tint:color-mix(in oklab,var(--accent),var(--paper) 72%);
  --accent-deep:color-mix(in oklab,var(--accent),white 30%);
  --ok-tint:color-mix(in oklab,var(--ok),var(--paper) 70%);
  --warn-tint:color-mix(in oklab,var(--warn),var(--paper) 70%);
  --fail-tint:color-mix(in oklab,var(--fail),var(--paper) 70%);
  color-scheme:dark;
}

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--type);
  font-size:var(--t-md); line-height:1.65; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif); font-weight:500; line-height:1.1; letter-spacing:-.01em; margin:0 0 var(--s3); color:var(--ink)}
h1{font-size:var(--t-3xl)} h2{font-size:var(--t-2xl)} h3{font-size:var(--t-xl)} h4{font-size:1.3rem}
h1 em,h2 em,h3 em,h4 em{font-style:italic; font-weight:400}
p{margin:0 0 var(--s4)}
a{color:var(--accent-deep); text-decoration-thickness:1px; text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs)}
::selection{background:var(--accent-tint); color:var(--ink)}
code,kbd,pre,.o-mono{font-family:var(--mono); font-size:.92em}
.o-num{font-family:var(--mono); font-variant-numeric:tabular-nums}
hr,.o-rule{border:0; height:1px; background:var(--stone-2); margin:var(--s7) 0}

/* ── Display: the serif at size. One per screen. ── */
.o-display{font-family:var(--serif); font-weight:500; font-size:clamp(2.5rem,7vw,var(--t-4xl)); line-height:1.02; letter-spacing:-.015em}
.o-display em{font-style:italic; font-weight:400}
.o-wordmark{font-family:var(--serif); font-weight:600; font-size:var(--t-xl); line-height:1; letter-spacing:-.01em; color:var(--ink); text-decoration:none}

/* ── The one place spaced capitals are allowed: a single date-and-place line per screen ── */
.o-dateline{font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s4)}
.o-ticker{display:flex; gap:var(--s6); overflow:hidden; white-space:nowrap; padding:9px var(--s5);
  background:var(--taupe); color:#F6F5F2; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.o-ticker > :nth-child(n+3){opacity:.75}
@media (max-width:640px){.o-ticker > :nth-child(n+2){display:none}}

/* ── Labels and small print: sentence case ── */
.o-label{display:block; font-size:var(--t-sm); font-weight:700; color:var(--ink-2); margin-bottom:var(--s2)}
.o-meta{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
.o-lede{font-size:var(--t-lg); color:var(--ink-2); max-width:62ch}

/* ── Text that types itself: add .o-typing; the cursor is the app's colour ── */
.o-typing::after,.o-cursor{content:""; display:inline-block; width:2px; height:1.1em; background:var(--accent); margin-left:2px; vertical-align:-3px; animation:o-blink 1s steps(1) infinite}
@keyframes o-blink{50%{opacity:0}}

/* ── App bar: quiet, on the ground. Serif wordmark, text links, accent underline. ── */
.o-bar{display:flex; align-items:baseline; gap:var(--s5); padding:var(--s4) var(--s5); min-height:60px}
.o-bar__spacer{flex:1}
.o-bar a,.o-bar__link{font:inherit; font-size:var(--t-sm); color:var(--ink-2); text-decoration:none; background:none; border:0; padding:var(--s1) 0; cursor:pointer}
.o-bar a:hover,.o-bar__link:hover{color:var(--ink)}
.o-bar .is-current,.o-bar [aria-current]{color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:7px}

/* ── Page ── */
.o-page{max-width:1080px; margin:0 auto; padding:var(--s6) var(--s5) var(--s8)}
.o-page--read{max-width:720px}
@media (max-width:640px){.o-page{padding:var(--s5) var(--s4) var(--s8)} .o-bar{padding:var(--s3) var(--s4); gap:var(--s4)}}

/* ── Buttons: quiet. Charcoal for the one thing to do, a line for the other, text for the rest. ── */
.o-btn{display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); min-height:44px; padding:0 var(--s5);
  border:0; border-radius:var(--r-sm); background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink-3);
  font:inherit; font-size:.9375rem; line-height:1; cursor:pointer; text-decoration:none; transition:background .15s,color .15s,box-shadow .15s}
.o-btn:hover{box-shadow:inset 0 0 0 1px var(--ink); color:var(--ink)}
.o-btn:disabled,.o-btn[aria-disabled="true"]{opacity:.45; cursor:not-allowed}
.o-btn--primary{background:var(--ink); color:var(--on-ink); box-shadow:none}
.o-btn--primary:hover{background:color-mix(in oklab,var(--ink),var(--accent) 22%); color:var(--on-ink); box-shadow:none}
.o-btn--danger{background:var(--fail); color:#fff; box-shadow:none}
.o-btn--danger:hover{background:color-mix(in oklab,var(--fail),black 12%); color:#fff; box-shadow:none}
.o-btn--quiet{box-shadow:none; color:var(--accent-deep); padding:0 var(--s1); text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px}
.o-btn--quiet:hover{box-shadow:none; color:var(--accent)}
.o-btn--sm{min-height:34px; padding:0 var(--s4); font-size:var(--t-sm)}
.o-btn--block{width:100%}

/* ── Fields: a stone fill; paper and an accent ring when typing ── */
.o-field{display:block; width:100%; min-height:46px; padding:var(--s3) var(--s4); border:0; border-radius:var(--r-md);
  background:var(--stone); color:var(--ink); font:inherit; box-shadow:inset 0 0 0 1.5px transparent; transition:background .15s,box-shadow .15s}
.o-field::placeholder{color:var(--ink-3)}
.o-field:focus{outline:none; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--accent)}
textarea.o-field{min-height:140px; resize:vertical; line-height:1.6}

/* ── Chips ── */
.o-chip{display:inline-flex; align-items:center; gap:var(--s1); padding:2px var(--s2); border:0; border-radius:var(--r-xs);
  background:var(--stone); color:var(--ink-2); font:inherit; font-size:var(--t-sm); line-height:1.5}
button.o-chip{cursor:pointer}
.o-chip[aria-pressed="true"],.o-chip.is-on{background:var(--accent-tint); color:var(--accent-deep)}
.o-chip--ok{background:var(--ok-tint); color:var(--ink)} .o-chip--warn{background:var(--warn-tint); color:var(--ink)} .o-chip--fail{background:var(--fail-tint); color:var(--ink)}

/* ── Panels: paper on the ground. No borders, no shadows. ── */
.o-panel{background:var(--paper); border-radius:var(--r-lg); padding:var(--s5)}
.o-panel--tint{background:var(--accent-tint)}

/* ── Stones: rows of paper with the ground showing between ── */
.o-stones{display:flex; flex-direction:column; gap:3px; margin:0; padding:0; list-style:none}
.o-stone{display:flex; align-items:center; gap:var(--s4); padding:var(--s4) var(--s5); background:var(--paper); border-radius:var(--r-xs); color:inherit; text-decoration:none}
.o-stones > .o-stone:first-child{border-top-left-radius:var(--r-md); border-top-right-radius:var(--r-md)}
.o-stones > .o-stone:last-child{border-bottom-left-radius:var(--r-md); border-bottom-right-radius:var(--r-md)}
a.o-stone:hover,button.o-stone:hover{background:var(--accent-tint)}
button.o-stone{width:100%; border:0; font:inherit; text-align:left; cursor:pointer}
.o-stone__main{flex:1; min-width:0}
.o-stone__title{display:block; font-family:var(--serif); font-size:1.25rem; font-weight:500; line-height:1.25}
.o-stone__sub{display:block; font-size:var(--t-sm); color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ── Cards: soft pastel tiles (Craft). Tint with data-tint, default paper. ── */
.o-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--s3)}
.o-card{display:flex; flex-direction:column; gap:var(--s2); min-height:150px; padding:var(--s4); border-radius:var(--r-md);
  background:var(--paper); color:inherit; text-decoration:none; --tint:var(--paper)}
.o-card[data-tint]{background:color-mix(in oklab,var(--tint),var(--paper) 85%)}
.o-card[data-tint="heather"]{--tint:var(--heather)} .o-card[data-tint="sea"]{--tint:var(--sea)} .o-card[data-tint="teal"]{--tint:var(--teal)}
.o-card[data-tint="moss"]{--tint:var(--moss)} .o-card[data-tint="ochre"]{--tint:var(--ochre)} .o-card[data-tint="blossom"]{--tint:var(--blossom)}
.o-card__title{margin:0; font-family:var(--serif); font-size:1.25rem; font-weight:500; line-height:1.15}
.o-card__text{margin:0; font-size:var(--t-sm); color:var(--ink-2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.o-card .o-meta{margin-top:auto}
a.o-card:hover{filter:brightness(.98)}

/* ── Tabs: words with an accent underline ── */
.o-tabs{display:flex; gap:var(--s5); border-bottom:1px solid var(--stone-2)}
.o-tab{border:0; background:none; font:inherit; font-size:var(--t-sm); color:var(--ink-2); padding:var(--s2) 0; margin-bottom:-1px; cursor:pointer; border-bottom:2px solid transparent}
.o-tab:hover{color:var(--ink)}
.o-tab[aria-selected="true"],.o-tab.is-current{color:var(--ink); border-bottom-color:var(--accent)}

/* ── Stats ── */
.o-stat{display:flex; flex-direction:column; gap:var(--s1)}
.o-stat__n{font-family:var(--mono); font-weight:700; font-size:var(--t-3xl); line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.o-stat__l{font-size:var(--t-sm); color:var(--ink-2)}

/* ── One big figure (the flip clock) ── */
.o-figure{display:flex; gap:var(--s3); justify-content:center; align-items:stretch; padding:var(--s5); border-radius:var(--r-lg); background:#141413; color:#D9D7D2; min-height:280px}
.o-tile{position:relative; flex:1; max-width:240px; display:flex; align-items:center; justify-content:center; border-radius:var(--r-md); background:#232321;
  font-family:var(--mono); font-weight:700; font-size:clamp(5rem,13vw,9.5rem); line-height:1; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.o-tile::after{content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#141413}
.o-tile__label{position:absolute; left:14px; bottom:12px; font-size:var(--t-sm); letter-spacing:.1em; color:#8E8C86}
.o-tile--words{font-family:var(--serif); font-weight:400; font-size:clamp(2.2rem,5vw,3.5rem); letter-spacing:0; line-height:1.15; text-align:center; padding:var(--s5); max-width:380px; flex:1.5}
.o-tile--words::after{display:none}

/* ── Status dot ── */
.o-dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ink-3); flex:none}
.o-dot--ok{background:var(--ok)} .o-dot--warn{background:var(--warn)} .o-dot--fail{background:var(--fail)}

/* ── Notice: a tinted block, serif first line. No coloured left edge. ── */
.o-notice{background:var(--stone); border-radius:var(--r-md); padding:var(--s4) var(--s5)}
.o-notice > strong:first-child{display:block; font-family:var(--serif); font-size:1.25rem; font-weight:600; margin-bottom:var(--s1)}
.o-notice--ok{background:var(--ok-tint)} .o-notice--warn{background:var(--warn-tint)} .o-notice--fail{background:var(--fail-tint)}

/* ── Writing view: just the note. Options slide down from the top edge (desktop)
      or on tap (phone: toggle .show-bar on .o-write). ── */
.o-write{position:relative; min-height:100dvh; background:var(--paper); padding:var(--s8) 0 var(--s8)}
.o-write__zone{position:absolute; inset:0 0 auto 0; height:44px; z-index:3}
.o-write__bar{position:absolute; inset:0 0 auto 0; z-index:4; display:flex; align-items:center; gap:var(--s5); padding:var(--s3) var(--s5);
  background:var(--paper); border-bottom:1px solid var(--stone); font-size:var(--t-sm); transform:translateY(-101%); transition:transform .25s var(--ease)}
.o-write__zone:hover + .o-write__bar,.o-write__bar:hover,.o-write__bar:focus-within,.o-write.show-bar .o-write__bar{transform:none}
.o-write__bar a,.o-write__bar button{color:var(--ink-2); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; padding:var(--s1) 0}
.o-write__bar a:hover,.o-write__bar button:hover{color:var(--accent-deep)}
.o-write__bar .o-bar__spacer{flex:1}
.o-write--fixed .o-write__zone,.o-write--fixed .o-write__bar{position:fixed}
.o-note{max-width:660px; margin:0 auto; padding:0 var(--s6)}
.o-note h1{font-size:clamp(2.2rem,5vw,2.9rem); margin-bottom:var(--s5)}
.o-note h2{font-size:1.9rem; margin-top:var(--s6)} .o-note h3{font-size:1.6rem; margin-top:var(--s5)}
.o-note p,.o-note li{font-size:1.0625rem; line-height:1.75}
.o-note .is-dim{color:var(--ink-dim); transition:color .3s}
.o-note blockquote{margin:0 0 var(--s4); padding-left:var(--s4); color:var(--ink-2); font-style:italic}
.o-md{color:var(--stone-2); font-family:var(--type); font-style:normal; font-weight:400}
.o-note h1 .o-md,.o-note h2 .o-md,.o-note h3 .o-md{font-size:1rem; vertical-align:.35em}
@media (max-width:640px){.o-note{padding:0 var(--s5)} .o-write{padding-top:var(--s7)}}

/* ── Picture mood (Trips, Wishing Stream tools; never Open Brain): a real photo or
      silent looping video leads, darkening at the bottom so white words sit on it. ── */
.o-picture{position:relative; isolation:isolate; display:flex; flex-direction:column; justify-content:flex-end; min-height:70vh; overflow:hidden;
  color:#fff; background:#2B2925 var(--img,none) center/cover no-repeat}
.o-picture__media{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2}
.o-picture::before{content:""; position:absolute; inset:0; z-index:-1;
  background:linear-gradient(to bottom,rgba(40,36,32,.18) 0%,rgba(40,36,32,0) 28%,rgba(40,36,32,.72) 100%)}
.o-picture__top{position:absolute; inset:0 0 auto 0; display:flex; justify-content:space-between; align-items:baseline; padding:var(--s4) var(--s5)}
.o-picture__top .o-wordmark{color:#fff}
.o-picture__body{padding:0 var(--s6) var(--s5)}
.o-picture__body h1,.o-picture__body h2,.o-picture__body h3{color:#fff}
.o-picture__body p{opacity:.88; max-width:42ch}
.o-picture__foot{display:flex; justify-content:space-between; align-items:center; gap:var(--s4); padding:var(--s3) var(--s6) var(--s4); border-top:1px solid rgba(255,255,255,.2); font-size:var(--t-sm)}
.o-picture__icons{display:flex; gap:var(--s5)}
.o-picture__icons svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.5}
.o-caption{font-size:var(--t-sm); opacity:.9}

/* ── Gate (locked screen): calm, on the ground; serif wordmark, a typing line, field, one button ── */
.o-gate{min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:var(--s7) var(--s5)}
.o-gate__inner{width:100%; max-width:440px; margin:0 auto}
.o-gate .o-display{margin-bottom:var(--s2)}
.o-gate .o-field{margin:var(--s5) 0 var(--s3)}

/* ── Phone: primary action in a bottom bar ── */
.o-actionbar{position:sticky; bottom:0; display:flex; gap:var(--s3); padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--ground),transparent 6%); backdrop-filter:blur(8px)}
.o-actionbar .o-btn{flex:1}

/* ══ v2.1 (Review 2, 4 Nov 2026): pieces for apps with several functions ══ */

/* ── App frame with a rail: the functions down the left (all five planners).
   .o-app > .o-rail + .o-main (+ .o-side for a timeline). On the phone the rail
   hides and .o-tabbar (five items) sits at the bottom. ── */
.o-app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
.o-app--split{grid-template-columns:232px minmax(0,1fr) 300px}
.o-rail{background:var(--ground); padding:var(--s5) var(--s3); display:flex; flex-direction:column; gap:2px}
.o-rail .o-wordmark{padding:0 var(--s3) var(--s4); font-size:1.5rem}
.o-rail__group{font-size:var(--t-xs); color:var(--ink-3); padding:var(--s4) var(--s3) var(--s1)}
.o-rail__item{display:flex; align-items:center; gap:var(--s3); padding:7px var(--s3); min-height:36px; border:0; border-radius:var(--r-sm);
  background:none; font:inherit; font-size:var(--t-sm); color:var(--ink-2); text-decoration:none; text-align:left; cursor:pointer}
.o-rail__item i{font-size:20px}
.o-rail__item .o-num{margin-left:auto; font-size:var(--t-xs); color:var(--ink-3)}
.o-rail__item:hover{background:var(--stone); color:var(--ink)}
.o-rail__item.is-current,.o-rail__item[aria-current]{background:var(--paper); color:var(--ink)}
.o-rail__item.is-current i,.o-rail__item[aria-current] i{color:var(--accent)}
.o-main{background:var(--paper); padding:var(--s6) var(--s6) var(--s7); min-width:0}
.o-side{background:var(--ground); padding:var(--s5) var(--s4); min-width:0}
.o-tabbar{display:none}
@media (max-width:760px){
  .o-app,.o-app--split{grid-template-columns:1fr}
  .o-rail,.o-side--desk{display:none}
  .o-main{padding:var(--s5) var(--s4) 96px}
  .o-tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; justify-content:space-around;
    background:var(--ground); padding:var(--s2) var(--s2) calc(var(--s3) + env(safe-area-inset-bottom))}
  .o-tabbar a,.o-tabbar button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:56px; min-height:44px;
    border:0; background:none; font:inherit; font-size:var(--t-xs); color:var(--ink-3); text-decoration:none; cursor:pointer}
  .o-tabbar i{font-size:24px}
  .o-tabbar .is-current,.o-tabbar [aria-current]{color:var(--ink)}
  .o-tabbar .is-current i,.o-tabbar [aria-current] i{color:var(--accent)}
}

/* ── Capture: one field for anything, with photo and mic buttons (Todoist's
   Write · Attach · Speak). Add .is-listening while the mic is on. ── */
.o-capture{display:flex; align-items:center; gap:var(--s2); background:var(--ground); border-radius:var(--r-md); padding:var(--s2) var(--s2) var(--s2) var(--s4); min-height:52px}
.o-capture input,.o-capture textarea{flex:1; min-width:0; border:0; background:none; font:inherit; color:var(--ink); padding:var(--s2) 0; resize:none}
.o-capture input:focus,.o-capture textarea:focus{outline:none}
.o-capture:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.o-capture__btn{display:grid; place-items:center; width:40px; height:40px; border:0; border-radius:var(--r-sm); background:none; color:var(--ink-2); cursor:pointer; font-size:22px}
.o-capture__btn:hover{background:var(--stone); color:var(--ink)}
.o-capture.is-listening{box-shadow:inset 0 0 0 1.5px var(--accent)}
.o-capture.is-listening .o-capture__mic{background:var(--accent); color:var(--on-ink)}

/* ── Task row: round tick, the words, quiet meta, a time in mono on the right (Sunsama). ── */
.o-tasks{list-style:none; margin:0; padding:0}
.o-task{display:flex; align-items:flex-start; gap:var(--s3); padding:var(--s3) 0; min-height:44px}
.o-task + .o-task{box-shadow:0 -1px 0 var(--stone)}
.o-task__tick{flex:none; width:20px; height:20px; margin-top:2px; border:0; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--ink-3);
  background:none; color:transparent; display:grid; place-items:center; font-size:13px; cursor:pointer}
.o-task__tick:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.o-task.is-done .o-task__tick{background:var(--accent); box-shadow:none; color:var(--on-ink)}
.o-task__main{flex:1; min-width:0}
.o-task__title{display:block}
.o-task.is-done .o-task__title{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-dim)}
.o-task__meta{display:block; margin-top:2px; font-size:var(--t-xs); color:var(--ink-3)}
.o-task__time{flex:none; padding-top:3px; font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
.o-task__time.is-due{color:var(--accent-deep)}

/* ── Day timeline: hours down the side. Events from calendar feeds in stone; planned
   blocks in a soft tint (data-tint); "now" in the accent. Position blocks with
   top/height from (hour - first hour) × --hour. ── */
.o-day{position:relative; --hour:52px}
.o-day__hour{height:var(--hour); display:flex; gap:var(--s2); font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
.o-day__hour::after{content:""; flex:1; height:1px; margin-top:.6em; background:var(--stone)}
.o-day__block{position:absolute; left:44px; right:0; padding:5px var(--s2); border-radius:var(--r-sm); overflow:hidden;
  font-size:var(--t-xs); line-height:1.35; background:var(--stone); color:var(--ink); --tint:var(--stone)}
.o-day__block b{display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.o-day__block small{display:block; font-size:inherit; color:var(--ink-2)}
.o-day__block[data-tint]{background:color-mix(in oklab,var(--tint),var(--paper) 78%)}
.o-day__block[data-tint="heather"]{--tint:var(--heather)} .o-day__block[data-tint="sea"]{--tint:var(--sea)} .o-day__block[data-tint="teal"]{--tint:var(--teal)}
.o-day__block[data-tint="moss"]{--tint:var(--moss)} .o-day__block[data-tint="ochre"]{--tint:var(--ochre)} .o-day__block[data-tint="blossom"]{--tint:var(--blossom)}
.o-day__now{position:absolute; left:36px; right:0; height:2px; background:var(--accent)}
.o-day__now::before{content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent)}

/* ── Suggestion: a helper's proposal waiting for a yes. Nothing is filed until Stewart taps.
   .o-suggest > __said (with .o-meta) + __to (icon + one <span> of words) + __acts; .is-filed after. ── */
.o-suggest{background:var(--ground); border-radius:var(--r-md); padding:var(--s4)}
.o-suggest + .o-suggest{margin-top:var(--s3)}
.o-suggest__said{margin:0 0 var(--s3)}
.o-suggest__said .o-meta{display:block; margin-bottom:var(--s1)}
.o-suggest__to{display:flex; align-items:flex-start; gap:var(--s2); margin-bottom:var(--s3); font-size:var(--t-sm)}
.o-suggest__to i{flex:none; margin-top:1px; font-size:18px; color:var(--accent)}
.o-suggest__to > span{flex:1; min-width:0}
.o-suggest__acts{display:flex; flex-wrap:wrap; gap:var(--s2)}
.o-suggest.is-filed{opacity:.55}
.o-suggest.is-filed .o-suggest__acts{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important; animation:none!important}}
/* otter:end */


  /* Trips in Otter (ochre), 5 Nov 2026: greige ground, paper cards, typewriter
     words, serif titles, mono times. Ochre marks today, links and the chosen
     tab. The boarding-pass viewer stays white on purpose, so gate scanners
     read the codes. Ids and classes are unchanged. */
  :root, [data-hue] {
    --bg: var(--ground); --surface: var(--paper); --surface-2: var(--stone); --line: var(--stone-2);
    --accent-ink: var(--on-ink); --accent-soft: var(--accent-tint);
    --ok-soft: var(--ok-tint);
    --wait: var(--warn); --wait-soft: var(--warn-tint);
    --due: var(--fail); --due-soft: var(--fail-tint);
    --info: var(--sea); --info-soft: color-mix(in oklab, var(--sea), var(--paper) 86%);
    --shadow: none; --radius: var(--r-lg);
    --f: var(--type); --f-num: var(--mono); --f-mono: var(--mono);
  }


  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 var(--f);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  a { color: var(--accent-deep); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- lock ---------- */
  #lock {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  }
  .lockbox { width: 100%; max-width: 360px; text-align: center; }
  .lockbox .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; display: block; }
  .lockbox h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
  .lockbox p { color: var(--ink-2); margin: 0 0 22px; }
  .lockbox input[type=password], .lockbox input[type=text] {
    width: 100%; padding: 14px 16px; font: 17px var(--f); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .lockbox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lockbox label.rem { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 14px 0 18px; color: var(--ink-2); font-size: 15px; }
  .primary {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); font-size: 17px;
  }
  .primary:disabled { opacity: .6; }
  #lockErr { min-height: 22px; margin-top: 12px; color: var(--due); font-size: 15px; }

  /* ---------- header ---------- */
  header.top {
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    max-width: 720px; margin: 0 auto;
  }
  .toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1.trip { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  .tripsub { color: var(--ink-2); margin: 3px 0 0; font-size: 15px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 5px 10px; border-radius: var(--r-xs); font-size: 13px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .chip.ready .dot { background: var(--ok); }
  .countdown {
    margin-top: 14px; padding: 12px 14px; border-radius: 14px;
    background: var(--accent-soft); color: var(--ink); font-size: 15px;
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  }
  .countdown strong { font: 600 22px var(--f-num); color: var(--accent); white-space: nowrap; }
  select.tripsel { margin-top: 10px; font: 15px var(--f); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

  main { max-width: 720px; margin: 0 auto; padding: 4px 16px 24px; }
  section.view > h2 {
    font-size: 13px; 
    color: var(--ink-3); margin: 22px 4px 10px; font-weight: 700;
  }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
    scroll-margin-top: 16px;
  }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
  .pad { padding: 14px 16px; }
  .eyebrow { font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .ctitle { font-size: 19px; font-weight: 650; margin: 2px 0 2px; letter-spacing: -.01em; }
  .muted { color: var(--ink-2); }
  .small { font-size: 14px; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .more {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; border-top: 1px solid var(--line); color: var(--accent);
    font-size: 15px; font-weight: 600;
  }
  .more::after { content: "›"; font-size: 20px; transform: rotate(90deg); transition: transform .15s; }
  details[open] > .more::after { transform: rotate(-90deg); }
  .facts { margin: 0; padding: 4px 16px 12px; }
  .facts div { display: grid; grid-template-columns: 38% 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .facts div:last-child { border-bottom: 0; }
  .facts dt { color: var(--ink-3); }
  .facts dd { margin: 0; }
  .note { margin: 0 16px 14px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 14px; color: var(--ink-2); }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
    padding: 8px 13px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    text-decoration: none; cursor: pointer;
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  .ref {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font: 600 17px var(--f-mono); 
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
  }
  .ref small { font: 500 11px var(--f); color: var(--ink-3); }
  .refs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  .pill { display: inline-block; padding: 2px 8px; border-radius: var(--r-xs); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .p-booked { background: var(--ok-soft); color: var(--ok); }
  .p-pending, .p-try { background: var(--wait-soft); color: var(--wait); }
  .p-todo { background: var(--due-soft); color: var(--due); }
  .p-open { background: var(--info-soft); color: var(--info); }
  .p-info { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }

  /* flight / sailing / car */
  .leg { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; margin-top: 10px; }
  .leg .t { font: 650 32px/1 var(--f-num); letter-spacing: -.02em; }
  .leg .p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .leg .mid { color: var(--ink-3); padding-bottom: 20px; text-align: center; }
  .leg .mid svg { width: 22px; height: 22px; }
  .leg .r { text-align: right; }
  .seats { margin-top: 10px; font-size: 14px; color: var(--ink-2); }

  /* stays */
  .nights { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .inout { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .inout div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .inout b { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .deadline { font-size: 14px; margin-top: 10px; }
  .deadline.soon { color: var(--wait); font-weight: 600; }
  .deadline.past { color: var(--ink-3); }

  /* places */
  .item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item.noclk { grid-template-columns: 1fr; }
  .item .clk { font: 600 15px var(--f-num); color: var(--ink-2); padding-top: 1px; }
  .item .it { font-weight: 600; }
  .item .dt { font-size: 14px; color: var(--ink-2); margin-top: 3px; }
  .item .lk { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 14px; font-weight: 600; }
  .item .lk a { text-decoration: none; }
  .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  /* days */
  .day { display: grid; grid-template-columns: 56px 1fr; }
  .dbadge { text-align: center; padding: 14px 0; border-right: 1px solid var(--line); background: var(--surface-2); }
  .dbadge .dw { font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .dbadge .dn { font: 650 26px/1.1 var(--f-num); }
  .card.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.today .dbadge { background: var(--accent); color: var(--accent-ink); }
  .card.today .dbadge .dw { color: var(--accent-ink); opacity: .85; }
  .card.done { opacity: .6; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 5px 0; font-size: 15px; }
  .steps li .st { font: 600 14px var(--f-num); color: var(--ink-3); padding-top: 1px; }
  .steps li a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .steps li.drive span:last-child { color: var(--ink-2); }
  .night { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .night svg { width: 16px; height: 16px; flex: none; }
  .night a { color: var(--ink); font-weight: 600; text-decoration: none; }

  .todo { list-style: none; margin: 0; padding: 4px 0; }
  .todo li { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 15px; display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
  .todo li { cursor: pointer; }
  .todo li:first-child { border-top: 0; }
  .todo li::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--wait); border-radius: 4px; margin-top: 3px; }
  .todo li.ticked { color: var(--ink-3); text-decoration: line-through; }
  .todo li.ticked::before { background: var(--ok); border-color: var(--ok); }
  .todobox { margin-top: 16px; }
  .todobox > .more { border-top: 0; color: var(--ink); }
  .todobox[open] > .more { border-bottom: 1px solid var(--line); }
  .todobox .more .pill { margin-left: 6px; vertical-align: 1px; }
  .todo a { font-weight: 600; font-size: 14px; display: inline-block; margin-top: 3px; }

  .costs .facts div { grid-template-columns: 1fr auto; }
  .costs .facts div:last-child { font-weight: 700; }
  .foot { text-align: center; color: var(--ink-3); font-size: 13px; margin: 20px 0 8px; }
  .foot button { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px; cursor: pointer; }
  .empty { color: var(--ink-3); padding: 16px; text-align: center; }

  /* ---------- tab bar ---------- */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  nav.tabs button {
    background: none; border: 0; padding: 6px 0 4px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); cursor: pointer;
  }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9;
  }
  .toast.on { opacity: 1; }
  .hint { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .hint button { float: right; background: none; border: 0; color: var(--ink-3); font-size: 18px; line-height: 1; cursor: pointer; }
  /* ---------- passes ---------- */
  .passes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 14px; }
  .pad .passes { padding: 12px 0 0; }
  .pthumb {
    width: 64px; height: 64px; border-radius: 10px; overflow: hidden; padding: 0;
    border: 1px solid var(--line); background: #fff; cursor: pointer; position: relative;
  }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pthumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .padd {
    height: 40px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    border: 1.5px dashed var(--line); background: none; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
  }
  .padd svg { width: 16px; height: 16px; }
  .passgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 14px 16px; }
  .passgrid .pthumb { width: 100%; height: auto; aspect-ratio: 1; }
  .passgrid .pthumb span { font-size: 11px; padding: 2px 5px; }

  #viewer {
    position: fixed; inset: 0; z-index: 20; background: #fff; color: #111;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .vbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; }
  .vbar span { text-align: center; font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbar button, .vfoot button { background: none; border: 0; font-size: 16px; font-weight: 600; color: var(--ochre); padding: 8px 6px; cursor: pointer; }
  .vbar .vdel { color: var(--fail); font-size: 14px; }
  .vimg { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
  .vimg img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: -webkit-optimize-contrast; }
  .vfoot { display: flex; justify-content: center; align-items: center; gap: 24px; padding: 4px; }
  .vfoot button { font-size: 30px; line-height: 1; padding: 4px 16px; }
  .vfoot button:disabled { opacity: .25; }
  .vtip { text-align: center; font-size: 13px; color: #666; margin: 0 0 10px; }

  /* ---------- Otter ---------- */
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
  #lock { place-items: end start; padding: var(--s7) var(--s4) 18vh; max-width: 720px; margin: 0 auto; }
  .lockbox { text-align: left; max-width: 420px; }
  .lockbox .mark { margin: 0 0 var(--s5); width: 56px; height: 56px; border-radius: 14px; }
  .lockbox h1 { font-size: var(--t-3xl); font-weight: 500; letter-spacing: -.01em; margin: 0 0 var(--s2); }
  .lockbox input[type=password], .lockbox input[type=text] { background: var(--stone); border: 0; border-radius: var(--r-md); min-height: 46px; font: var(--t-md) var(--type); }
  .lockbox input:focus { outline: none; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .lockbox label.rem { justify-content: flex-start; font-size: var(--t-sm); }
  .primary { background: var(--ink); color: var(--on-ink); border-radius: var(--r-sm); font-weight: 400; font-size: .9375rem; min-height: 46px; }
  .primary:hover:not(:disabled) { background: color-mix(in oklab, var(--ink), var(--accent) 22%); }
  h1.trip { font-family: var(--serif); font-weight: 500; font-size: var(--t-2xl); line-height: 1.05; letter-spacing: -.01em; }
  .tripsub { font-size: var(--t-sm); }
  .chip { background: var(--paper); border: 0; font-weight: 400; font-size: var(--t-sm); border-radius: var(--r-xs); padding: var(--s1) var(--s2); }
  .countdown { background: var(--accent-tint); border-radius: var(--r-md); font-size: var(--t-sm); }
  .countdown strong { font: 700 var(--t-xl) var(--mono); color: var(--accent-deep); }
  select.tripsel { font: var(--t-sm) var(--type); border: 0; background: var(--stone); border-radius: var(--r-sm); min-height: 40px; padding: 0 var(--s3); }
  section.view > h2 { font-family: var(--serif); font-size: 1.6rem; font-weight: 500; color: var(--ink); margin: var(--s6) 0 var(--s3); }
  .card { border: 0; margin-bottom: var(--s2); }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .eyebrow { font-size: var(--t-sm); font-weight: 400; color: var(--ink-3); }
  .ctitle { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; line-height: 1.2; letter-spacing: 0; }
  .small { font-size: var(--t-sm); }
  .more { border-top: 1px solid var(--stone); color: var(--accent-deep); font-weight: 400; font-size: var(--t-sm); min-height: 44px; }
  .facts div { border-bottom: 1px solid var(--stone); font-size: var(--t-sm); }
  .note { background: var(--stone); border-radius: var(--r-sm); font-size: var(--t-sm); }
  .btn { border: 0; box-shadow: inset 0 0 0 1px var(--ink-3); background: none; border-radius: var(--r-sm); font-weight: 400; font-size: var(--t-sm); min-height: 44px; }
  .btn:hover { box-shadow: inset 0 0 0 1px var(--ink); }
  .btn.acc { background: var(--accent-tint); color: var(--accent-deep); box-shadow: none; }
  .ref { font: 700 1.0625rem var(--mono); background: var(--stone); border: 0; border-radius: var(--r-sm); }
  .ref small { font: 400 var(--t-xs) var(--type); }
  .pill { font-weight: 400; font-size: var(--t-xs); color: var(--ink) !important; }
  .p-info { border: 0; background: var(--stone); color: var(--ink-2) !important; }
  .leg .t { font: 700 2rem/1 var(--mono); letter-spacing: -.03em; }
  .inout div { border-radius: var(--r-sm); }
  .inout b { font-weight: 700; font-size: var(--t-xs); }
  .item { border-top: 1px solid var(--stone); }
  .item .clk { font: 400 var(--t-sm) var(--mono); }
  .item .it { font-weight: 700; }
  .item .lk { font-weight: 400; }
  .dbadge { border-right: 0; background: var(--stone); }
  .dbadge .dw { font-weight: 400; font-size: var(--t-xs); }
  .dbadge .dn { font: 700 1.6rem/1.1 var(--mono); }
  .card.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .card.today .dbadge { background: var(--accent-tint); color: var(--accent-deep); }
  .card.today .dbadge .dw { color: var(--accent-deep); opacity: 1; }
  .steps li .st { font: 400 var(--t-sm) var(--mono); }
  .steps li a { border-bottom: 1px solid var(--stone-2); }
  .night { border-top: 1px solid var(--stone); }
  .night a { font-weight: 700; }
  .todo li { border-top: 1px solid var(--stone); }
  .todo li::before { border: 1.5px solid var(--ink-3); border-radius: 50%; width: 16px; height: 16px; }
  .todo li.ticked::before { background: var(--accent); border-color: var(--accent); }

  .obadd button { font: inherit; font-size: 14px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--ink); color: var(--paper, #fff); cursor: pointer; }
  .obnote { margin: 4px 16px 12px; font-size: 12px; color: var(--ink-3); }
  .foot button { color: var(--accent-deep); font-weight: 400; font-size: var(--t-sm); min-height: 44px; }
  nav.tabs { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; border-top: 0; box-shadow: 0 -1px 0 var(--stone); }
  nav.tabs button { font-size: var(--t-xs); font-weight: 400; color: var(--ink-2); min-height: 52px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent-deep); }
  .toast { background: var(--ink); color: var(--on-ink); border-radius: var(--r-sm); font-weight: 400; font-size: var(--t-sm); }
  .hint { background: var(--paper); border: 0; border-radius: var(--r-md); font-size: var(--t-sm); }
  .pthumb { border: 0; border-radius: var(--r-sm); }
  .padd { border: 0; box-shadow: inset 0 0 0 1px var(--ink-3); border-radius: var(--r-sm); font-weight: 400; font-size: var(--t-sm); min-height: 44px; }

  @media (min-width: 760px) { body { font-size: 17px; } }

    ship: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2 5h14l2-5H3zM6 15V9h12v6M12 9V4"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v2H3zM7 16v2M17 16v2"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/></svg>',
    bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V7M3 14h18v5M21 14v-2.5a3 3 0 0 0-3-3h-7V14"/></svg>'
  };
  const linkIcon = (href) => href.startsWith("tel:") ? I.call : href.startsWith("mailto:") ? I.mail : href.includes("/maps/") ? I.map : I.link;
  const btn = (label, href, cls) => '<a class="btn ' + (cls || "") + '" href="' + esc(href) + '"' + (href.startsWith("http") ? ' target="_blank" rel="noopener"' : "") + ">" + linkIcon(href) + esc(label) + "</a>";
  const refChip = (label, value) => '<span class="ref" data-copy="' + esc(value) + '" role="button" tabindex="0" title="Tap to copy"><small>' + esc(label) + "</small>" + esc(value) + "</span>";
  const facts = (rows) => rows && rows.length ? '<dl class="facts">' + rows.map(r => "<div><dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd></div>").join("") + "</dl>" : "";
  const pillText = { booked: "Booked", pending: "Requested", todo: "To do", try: "Full: try on the day", open: "Drop in", info: "Note" };

  let trip = null, all = [];

  // ---------- passes: QR codes and boarding passes kept on this device ----------
  // Images live in IndexedDB on this phone only; they never go to the site or
  // the repo. Each is filed under a booking key such as "travel:fl-out".
  const passDb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("trips-passes", 1);
      r.onupgradeneeded = () => {
        const s = r.result.createObjectStore("passes", { keyPath: "id", autoIncrement: true });
        s.createIndex("trip", "trip");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("passes", mode);
        const out = fn(t.objectStore("passes"));
        t.oncomplete = () => res(out && out.result);
        t.onerror = () => rej(t.error);
      });
    };
    return {
      forTrip: (tripId) => tx("readonly", s => s.index("trip").getAll(tripId)),
      add: (rec) => tx("readwrite", s => s.add(rec)),
      put: (rec) => tx("readwrite", s => s.put(rec)),
      del: (id) => tx("readwrite", s => s.delete(id))
    };
  })();

  let passes = [];          // this trip's passes, loaded after unlock
  const urls = new Map();   // pass id -> object URL
  const urlFor = (p) => { if (!urls.has(p.id)) urls.set(p.id, URL.createObjectURL(p.blob)); return urls.get(p.id); };

  const passSlot = (key, label) => '<div class="passes" data-pk="' + esc(key) + '" data-pl="' + esc(label) + '"></div>';

  async function loadPasses() {
    try { passes = (await passDb.forTrip(trip.id)) || []; } catch (_) { passes = []; }
    passes.sort((a, b) => a.added - b.added);
    fillPasses();
  }

  // On a booking's own card the thumb shows just whose it is (after " · ");
  // in the "Your passes" grid it shows the whole label.
  const thumb = (p, full) => {
    const short = p.label.includes(" · ") ? p.label.split(" · ").pop() : "";
    const cap = full ? p.label : short;
    return '<button type="button" class="pthumb" data-pass="' + p.id + '" aria-label="Open ' + esc(p.label) + '"><img src="' + urlFor(p) + '" alt="">' + (cap ? "<span>" + esc(cap) + "</span>" : "") + "</button>";
  };

  function fillPasses() {
    document.querySelectorAll(".passes[data-pk]").forEach(el => {
      const mine = passes.filter(p => p.key === el.dataset.pk);
      el.innerHTML = mine.map(p => thumb(p, false)).join("") +
        '<button type="button" class="padd" data-add="' + esc(el.dataset.pk) + '" data-label="' + esc(el.dataset.pl) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 18v3h-3"/></svg>' +
        (mine.length ? "Add another" : "Add pass or QR") + "</button>";
    });
    const box = $("allPasses");
    if (box) {
      box.hidden = !passes.length;
      const grid = box.querySelector(".passgrid");
      if (grid) grid.innerHTML = passes.map(p => thumb(p, true)).join("");
      const cnt = $("passCount");
      if (cnt) cnt.textContent = String(passes.length);
    }
  }

  // Big photos are shrunk so the phone's storage isn't eaten, but kept large
  // enough (2000 px) that a QR code or barcode still scans. Screenshots are
  // usually under that and stay untouched.
  async function prepare(file) {
    if (file.size < 1.5e6) return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.size < 4e6) return file;
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.92));
    } catch (_) { return file; }
  }

  let adding = null;
  $("passFile").addEventListener("change", async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (!files.length || !adding) return;
    const { key, label } = adding;
    const already = passes.filter(p => p.key === key).length;
    let n = 0;
    const first = (s) => String(s).split(" ")[0];
    for (const f of files) {
      const blob = await prepare(f);
      const idx = already + n + 1;
      // Family passes: suggest the trip's people in order so each one is
      // labelled with who it belongs to. Cancel keeps the suggestion.
      const who = trip.people && trip.people[idx - 1] ? first(trip.people[idx - 1]) : String(idx);
      const suggested = (already + files.length > 1 || (trip.people || []).length > 1) ? label + " · " + who : label;
      const typed = window.prompt("Whose pass is this? (" + (n + 1) + " of " + files.length + ")", suggested);
      const rec = { trip: trip.id, key, label: (typed && typed.trim()) || suggested, blob, added: Date.now() + n };
      try { rec.id = await passDb.add(rec); passes.push(rec); n++; }
      catch (_) { toast("Couldn't save that on this phone"); }
    }
    if (n) {
      toast(n === 1 ? "Pass saved on this phone" : n + " passes saved on this phone");
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    }
    fillPasses();
  });

  // Full-screen viewer, white background, screen kept awake while open.
  let vList = [], vAt = 0, wake = null;
  function openViewer(id) {
    const p = passes.find(x => x.id === id);
    if (!p) return;
    vList = passes.filter(x => x.key === p.key);
    if (vList.length < 2) vList = passes.slice();   // single pass: step through them all
    vAt = vList.indexOf(p);
    drawViewer();
    $("viewer").hidden = false;
    document.body.style.overflow = "hidden";
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {});
  }
  function drawViewer() {
    const p = vList[vAt];
    $("vImg").src = urlFor(p);
    $("vLabel").textContent = p.label;
    $("vCount").textContent = vList.length > 1 ? (vAt + 1) + " of " + vList.length : "";
    $("vPrev").disabled = vAt === 0;
    $("vNext").disabled = vAt === vList.length - 1;
    $("vPrev").hidden = $("vNext").hidden = vList.length < 2;
  }
  function closeViewer() {
    $("viewer").hidden = true;
    document.body.style.overflow = "";
    if (wake) { wake.release().catch(() => {}); wake = null; }
  }
  $("vClose").addEventListener("click", closeViewer);
  $("vPrev").addEventListener("click", () => { if (vAt > 0) { vAt--; drawViewer(); } });
  $("vNext").addEventListener("click", () => { if (vAt < vList.length - 1) { vAt++; drawViewer(); } });
  $("vDel").addEventListener("click", async () => {
    const p = vList[vAt];
    if (!confirm("Delete “" + p.label + "” from this phone?")) return;
    try { await passDb.del(p.id); } catch (_) {}
    passes = passes.filter(x => x.id !== p.id);
    if (urls.has(p.id)) { URL.revokeObjectURL(urls.get(p.id)); urls.delete(p.id); }
    closeViewer(); fillPasses(); toast("Deleted");
  });
  // Tap the title to rename a pass (e.g. put whose it is).
  $("vLabel").addEventListener("click", async () => {
    const p = vList[vAt];
    const typed = window.prompt("Rename this pass", p.label);
    if (!typed || !typed.trim() || typed.trim() === p.label) return;
    p.label = typed.trim();
    try { await passDb.put(p); } catch (_) {}
    drawViewer(); fillPasses();
  });
  // Swipe left/right between passes.
  let sx = null;
  $("viewer").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  $("viewer").addEventListener("touchend", e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (dx < -50) $("vNext").click(); else if (dx > 50) $("vPrev").click();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("viewer").hidden) closeViewer(); });

  // ---------- views ----------
  // ---------- Open Brain tasks for this trip ----------
  function obKey() { return store.get(OB_KEY) || ""; }
  const projectOf = () => trip.name;
  const isTripTask = (x) => {
    const p = String(x.project || "").trim().toLowerCase();
    return !!p && (p === String(trip.name || "").trim().toLowerCase() || p === String(trip.id || "").trim().toLowerCase());
  };

  function obHtml(ob) {
    if (!ob) return "";
    if (ob.error) return '<p class="obnote">Open Brain tasks could not be read: ' + esc(ob.error) + "</p>";
    const open = ob.list.filter(x => x.status !== "done"), done = ob.list.filter(x => x.status === "done").slice(0, 10);
    return '<ul class="todo obtodo">' + open.concat(done).map(x =>
      '<li class="' + (x.status === "done" ? "ticked" : "") + '" data-obtask="' + esc(x.id) + '" data-status="' + esc(x.status) + '"><span>' + esc(x.title) +
      (x.due_date && x.status !== "done" ? ' <span class="obdue">' + esc(fmt(x.due_date)) + "</span>" : "") + "</span></li>").join("") + "</ul>" +
      '<form class="obadd"><input name="t" maxlength="200" placeholder="Add a task for this trip" aria-label="Add a task for this trip" enterkeyhint="done"><button type="submit">Add</button></form>' +
      '<p class="obnote">From Open Brain: tasks with the project “' + esc(projectOf()) + "”. Only shown on your own devices.</p>";
  }

  async function obCall(name, args) {
    const res = await fetch(MCP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream", "x-brain-key": obKey() },
      body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "tools/call", params: { name, arguments: args } }),
    });
    const raw = await res.text();
    let payload = {};
    try {
      if ((res.headers.get("Content-Type") || "").includes("text/event-stream")) {
        const line = raw.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).reverse().find(l => l.startsWith("{"));
        payload = line ? JSON.parse(line) : {};
      } else payload = raw.trim() ? JSON.parse(raw) : {};
    } catch (_) { throw new Error("an unreadable answer (HTTP " + res.status + ")"); }
    // An invalid key comes back as HTTP 200 with a JSON-RPC error.
    if (!res.ok || payload.error) throw new Error((payload.error && payload.error.message) || "HTTP " + res.status);
    const block = ((payload.result || {}).content || []).find(b => b.type === "text");
    if ((payload.result || {}).isError) throw new Error(block ? block.text : "refused");
    return block ? block.text : "";
  }

  async function loadObTasks() {
    if (!obKey() || !trip || !navigator.onLine) return;
    const tripId = trip.id;
    try {
      const raw = JSON.parse(await obCall("list_tasks", { format: "json", limit: 200, include_deferred: true, status: ["inbox", "next", "waiting", "done"] }));
      if (!trip || trip.id !== tripId) return;
      const list = (Array.isArray(raw) ? raw : []).filter(isTripTask)
        .map(x => ({ id: x.id, title: x.title, status: x.status, due_date: x.due_date || null, completed_at: x.completed_at || "" }))
        .sort((a, b) => (a.status === "done") - (b.status === "done") || String(a.due_date || "9").localeCompare(String(b.due_date || "9")) || String(b.completed_at).localeCompare(String(a.completed_at)));
      obTasks = { tripId, list };
    } catch (err) {
      if (!trip || trip.id !== tripId) return;
      obTasks = { tripId, error: err.message };
    }
    renderDays();
    fillPasses();
  }

  function renderDays() {
    const t = todayIso();
    const stays = Object.fromEntries(trip.stays.map(s => [s.id, s]));
    let h = "";
    const ob = obTasks && obTasks.tripId === trip.id ? obTasks : null;
    const obOpen = ob && ob.list ? ob.list.filter(x => x.status !== "done").length : 0;
    if ((trip.todo && trip.todo.length) || ob) {
      const ticked = ticks();
      const left = (trip.todo || []).filter(x => !ticked.has(x.text)).length + obOpen;
      h += '<details class="card todobox"' + (store.get(LS_TODO_OPEN) === "1" ? " open" : "") + '><summary class="more"><span>Still to sort <span class="pill ' + (left ? "p-pending" : "p-booked") + '">' + (left ? left + " left" : "All done") + "</span></span></summary>" +
        '<ul class="todo">' +
        (trip.todo || []).map(x => '<li class="' + (ticked.has(x.text) ? "ticked" : "") + '" data-tick="' + esc(x.text) + '"><span>' + esc(x.text) + (x.link ? '<br><a href="' + esc(x.link) + '"' + (x.link.startsWith("http") ? ' target="_blank" rel="noopener"' : "") + ">Open</a>" : "") + "</span></li>").join("") +
        "</ul>" + obHtml(ob) + "</details>";
    }
    // Closed by default on every open: the front screen stays about the days.
    h += '<details class="card todobox" id="allPasses" hidden><summary class="more"><span>Your passes <span class="pill p-info" id="passCount"></span></span></summary><div class="passgrid"></div></details>';
    h += "<h2>Day by day</h2>";
    trip.days.forEach(day => {
      const x = d(day.date);
      const cls = day.date === t ? " today" : (day.date < t ? " done" : "");
      const stay = day.stay && stays[day.stay];
      h += '<div class="card' + cls + '" id="day-' + day.date + '"><div class="day">' +
        '<div class="dbadge"><div class="dw">' + DAYS[x.getDay()] + '</div><div class="dn">' + x.getDate() + '</div><div class="dw">' + MONTHS[x.getMonth()] + "</div></div>" +
        '<div class="pad"><div class="ctitle">' + esc(day.title) + (day.date === t ? ' <span class="pill p-booked">Today</span>' : "") + "</div>" +
        '<ul class="steps">' + day.steps.map(s => {
          const drive = !s[2];
          const text = s[2] ? '<a href="#" data-go="' + esc(s[2]) + '">' + esc(s[1]) + "</a>" : esc(s[1]);
          return '<li class="' + (drive ? "drive" : "") + '"><span class="st">' + esc(s[0] || (drive ? "🚗" : "")) + "</span><span>" + text + "</span></li>";
        }).join("") + "</ul>" +
        (stay ? '<div class="night">' + I.bed + '<span>Night: <a href="#" data-go="stay:' + esc(stay.id) + '">' + esc(stay.name) + "</a>" + (stay.breakfast ? " · breakfast" : "") + "</span></div>" : "") +
        "</div></div></div>";
    });
    if (trip.costs) {
      h += '<h2>Costs</h2><div class="card costs">' + facts(trip.costs) + "</div>";
    }
    $("v-days").innerHTML = h;
    const box = $("v-days").querySelector(".todobox");
    if (box) box.addEventListener("toggle", () => store.set(LS_TODO_OPEN, box.open ? "1" : "0"));
  }

  function renderTravel() {

  function renderHeader() {
    $("tripName").textContent = trip.name;
    $("tripSub").textContent = trip.sub;
    document.title = trip.name;
    const t = todayIso();
    const cd = $("countdown");
    if (t < trip.start) {
      const n = daysBetween(t, trip.start);
      const first = trip.travel.filter(x => x.date === trip.start).sort((a, b) => a.dep.localeCompare(b.dep))[0];
      cd.innerHTML = "<span>" + (first ? "First up: " + esc(first.number || first.title) + " at " + esc(first.dep) + ", " + esc(fmt(first.date)) : "Starts " + esc(fmt(trip.start))) + "</span><strong>" + n + (n === 1 ? " day" : " days") + "</strong>";
    } else if (t <= trip.end) {
      const n = daysBetween(trip.start, t) + 1, total = daysBetween(trip.start, trip.end) + 1;
      const day = trip.days.find(x => x.date === t);
      cd.innerHTML = "<span>" + (day ? esc(day.title) : "On the trip") + "</span><strong>Day " + n + "/" + total + "</strong>";
    } else {
      cd.innerHTML = "<span>Trip finished " + esc(fmt(trip.end)) + "</span><strong>✓</strong>";
    }
    $("foot").innerHTML = "Bookings as of " + esc(fmt(trip.updated)) + '<br><button type="button" id="forget">Lock and forget on this device</button>';
    $("forget").addEventListener("click", () => {
      if (!confirm("Remove the saved passphrase from this device? You'll need it to open the trip again.")) return;
      store.del(LS_PASS); location.reload();
    });
  }

  function renderAll() {
    renderHeader(); renderDays(); renderTravel(); renderStays(); renderPlaces();
    fillPasses();
  }

  // ---------- tabs and jumping between them ----------
  function showTab(v) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === v)));
    document.querySelectorAll("section.view").forEach(s => { s.hidden = s.id !== "v-" + v; });
    store.set(LS_TAB, v);
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.v); window.scrollTo(0, 0); }));

  function go(target) {
    const [kind, id] = target.split(":");
    const tab = kind === "travel" ? "travel" : kind === "stay" ? "stays" : "places";
    showTab(tab);
    const el = $(kind + "-" + id);
    if (!el) return;
    const det = el.querySelector("details"); if (det) det.open = true;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  let toastT;
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); };

  // Adding a task to this trip in Open Brain (owner only; see loadObTasks).
  document.addEventListener("submit", (e) => {
    const f = e.target.closest(".obadd");
    if (!f) return;
    e.preventDefault();
    const input = f.querySelector("input"), title = input.value.trim();
    if (!title) return;
    input.disabled = true;
    obCall("create_task", { title, project: projectOf(), status: "next", source: "trips" })
      .then(() => { toast("Added to Open Brain"); return loadObTasks(); },
            (err) => { input.disabled = false; toast("Could not add it: " + err.message); });
  });
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const c = e.target.closest("[data-copy]");
    if (c) {
      const v = c.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("Copied " + v), () => toast(v));
      return;
    }
    const ot = e.target.closest("[data-obtask]");
    if (ot) {
      if (ot.classList.contains("busy")) return;
      const reopen = ot.dataset.status === "done";
      ot.classList.add("busy");
      ot.classList.toggle("ticked", !reopen);
      (reopen ? obCall("update_task", { id: ot.dataset.obtask, status: "next" }) : obCall("complete_task", { id: ot.dataset.obtask }))
        .then(() => loadObTasks(), (err) => { ot.classList.remove("busy"); ot.classList.toggle("ticked", reopen); toast("Could not change that: " + err.message); });
      return;
    }
    const tk = e.target.closest("[data-tick]");
    if (tk && !e.target.closest("a")) {
      const s = ticks(), k = tk.dataset.tick;
      s.has(k) ? s.delete(k) : s.add(k);
      saveTicks(s);
      renderDays();
      fillPasses();
      return;
    }
    const add = e.target.closest("[data-add]");
    if (add) { adding = { key: add.dataset.add, label: add.dataset.label }; $("passFile").click(); return; }
    const pt = e.target.closest("[data-pass]");
    if (pt) { openViewer(Number(pt.dataset.pass)); return; }
    const p = e.target.closest("[data-pin]");
    if (p) { p.innerHTML = "<small>PIN</small>" + esc(p.dataset.pin); p.removeAttribute("data-pin"); p.dataset.copy = p.textContent.replace("PIN", ""); }
  });

  // ---------- offline status ----------
  async function offlineStatus() {
    const chip = $("offline"), txt = $("offlineTxt");
    if (!("serviceWorker" in navigator) || !window.caches) { txt.textContent = "Online only"; return; }
    try {
      await navigator.serviceWorker.ready;
      const hit = await caches.match("./trip.html");
      if (hit) { chip.classList.add("ready"); txt.textContent = navigator.onLine ? "Saved offline" : "Offline"; }
      else { txt.textContent = "Saving…"; setTimeout(offlineStatus, 2500); }
    } catch (_) { txt.textContent = "Online only"; }
  }
  window.addEventListener("online", offlineStatus);
  window.addEventListener("offline", offlineStatus);

  function installHint() {
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (standalone || !ios || store.get(LS_HINT)) return;
    $("installHint").hidden = false;
    $("hintX").addEventListener("click", () => { $("installHint").hidden = true; store.set(LS_HINT, "1"); });
  }

  // ---------- unlock ----------
  async function open(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: bytes(blob.salt), iterations: blob.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(blob.iv) }, key, bytes(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function pickTrip() {
    const t = todayIso();
    const saved = store.get(LS_TRIP);
    return all.find(x => x.id === saved)
      || all.find(x => x.end >= t)
      || all[all.length - 1];
  }

  function show(data) {
    all = (data.trips || [data]).slice().sort((a, b) => a.start.localeCompare(b.start));
    trip = pickTrip();
    $("lock").hidden = true;
    $("app").hidden = false;
    const sel = $("tripSel");
    if (all.length > 1) {
      sel.hidden = false;
      sel.innerHTML = all.map(x => '<option value="' + esc(x.id) + '"' + (x === trip ? " selected" : "") + ">" + esc(x.name) + " · " + esc(fmt(x.start)) + "</option>").join("");
      sel.addEventListener("change", () => { trip = all.find(x => x.id === sel.value); store.set(LS_TRIP, trip.id); renderAll(); loadPasses(); loadObTasks(); });
    }
    renderAll();
    loadPasses();
    loadObTasks();
    const tab = store.get(LS_TAB);
    showTab(["days", "travel", "stays", "places"].includes(tab) ? tab : "days");
    const today = $("day-" + todayIso());
    if (today && (tab || "days") === "days") setTimeout(() => today.scrollIntoView({ block: "center" }), 50);
    offlineStatus();
    installHint();
  }

  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = $("pass").value.trim().toLowerCase().replace(/\s+/g, " ");
    if (!pass) return;
    $("unlockBtn").disabled = true; $("lockErr").textContent = "Opening…";
    try {
      const data = await open(pass);
      if ($("remember").checked) store.set(LS_PASS, pass);
      $("lockErr").textContent = "";
      show(data);
    } catch (_) {
      $("lockErr").textContent = "That passphrase didn't open it. Check the spaces between words.";
      $("unlockBtn").disabled = false;
    }
  });

  const saved = store.get(LS_PASS);
  if (saved) open(saved).then(show).catch(() => store.del(LS_PASS));
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
</script>
</body>
