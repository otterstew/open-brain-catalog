<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trips</title>
<meta name="description" content="Travel, stays and plans for each trip, saved on the phone for offline use.">
<link rel="manifest" href="./trip.webmanifest">
<meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trips">
<link rel="apple-touch-icon" href="./trip-192.png">
<link rel="icon" type="image/png" href="./trip-192.png">
<style>
  :root {
    --bg: #F3EFE6;
    --surface: #FFFDF8;
    --surface-2: #F8F4EB;
    --line: #E3DCCD;
    --ink: #1F2A2E;
    --ink-2: #56625F;
    --ink-3: #87918D;
    --accent: #1F6B63;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEBE6;
    --ok: #2E7D4F;     --ok-soft: #DDF0E3;
    --wait: #9A6400;   --wait-soft: #FBEBC8;
    --due: #B03A2E;    --due-soft: #F8DEDA;
    --info: #3F5F86;   --info-soft: #E0E8F2;
    --shadow: 0 1px 2px rgba(31,42,46,.06), 0 4px 14px rgba(31,42,46,.05);
    --radius: 16px;
    --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --f-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif;
    --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181B; --surface: #1A2226; --surface-2: #20292E; --line: #2C373C;
      --ink: #E8ECEA; --ink-2: #A9B4B0; --ink-3: #7B8783;
      --accent: #5FB8A9; --accent-ink: #0E1A18; --accent-soft: #1E3833;
      --ok: #7BCB97; --ok-soft: #1D3325; --wait: #E6B45C; --wait-soft: #3A2E17;
      --due: #F08A7E; --due-soft: #3E211E; --info: #8FB0DA; --info-soft: #1F2A3A;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181B; --surface: #1A2226; --surface-2: #20292E; --line: #2C373C;
    --ink: #E8ECEA; --ink-2: #A9B4B0; --ink-3: #7B8783;
    --accent: #5FB8A9; --accent-ink: #0E1A18; --accent-soft: #1E3833;
    --ok: #7BCB97; --ok-soft: #1D3325; --wait: #E6B45C; --wait-soft: #3A2E17;
    --due: #F08A7E; --due-soft: #3E211E; --info: #8FB0DA; --info-soft: #1F2A3A;
    --shadow: none; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--f);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- lock ---------- */
  #lock {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  }
  .lockbox { width: 100%; max-width: 360px; text-align: center; }
  .lockbox .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; display: block; }
  .lockbox h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
  .lockbox p { color: var(--ink-2); margin: 0 0 22px; }
  .lockbox input[type=password], .lockbox input[type=text] {
    width: 100%; padding: 14px 16px; font: 17px var(--f); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .lockbox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lockbox label.rem { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 14px 0 18px; color: var(--ink-2); font-size: 15px; }
  .primary {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); font-size: 17px;
  }
  .primary:disabled { opacity: .6; }
  #lockErr { min-height: 22px; margin-top: 12px; color: var(--due); font-size: 15px; }

  /* ---------- header ---------- */
  header.top {
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    max-width: 720px; margin: 0 auto;
  }
  .toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1.trip { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  .tripsub { color: var(--ink-2); margin: 3px 0 0; font-size: 15px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .chip.ready .dot { background: var(--ok); }
  .countdown {
    margin-top: 14px; padding: 12px 14px; border-radius: 14px;
    background: var(--accent-soft); color: var(--ink); font-size: 15px;
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  }
  .countdown strong { font: 600 22px var(--f-num); color: var(--accent); white-space: nowrap; }
  select.tripsel { margin-top: 10px; font: 15px var(--f); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

  main { max-width: 720px; margin: 0 auto; padding: 4px 16px 24px; }
  section.view > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3); margin: 22px 4px 10px; font-weight: 700;
  }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden;
    scroll-margin-top: 16px;
  }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
  .pad { padding: 14px 16px; }
  .eyebrow { font-size: 13px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
  .ctitle { font-size: 19px; font-weight: 650; margin: 2px 0 2px; letter-spacing: -.01em; }
  .muted { color: var(--ink-2); }
  .small { font-size: 14px; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .more {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; border-top: 1px solid var(--line); color: var(--accent);
    font-size: 15px; font-weight: 600;
  }
  .more::after { content: "›"; font-size: 20px; transform: rotate(90deg); transition: transform .15s; }
  details[open] > .more::after { transform: rotate(-90deg); }
  .facts { margin: 0; padding: 4px 16px 12px; }
  .facts div { display: grid; grid-template-columns: 38% 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .facts div:last-child { border-bottom: 0; }
  .facts dt { color: var(--ink-3); }
  .facts dd { margin: 0; }
  .note { margin: 0 16px 14px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 14px; color: var(--ink-2); }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
    padding: 8px 13px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    text-decoration: none; cursor: pointer;
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  .ref {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font: 600 17px var(--f-mono); letter-spacing: .04em;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
  }
  .ref small { font: 500 11px var(--f); letter-spacing: .02em; color: var(--ink-3); text-transform: uppercase; }
  .refs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .p-booked { background: var(--ok-soft); color: var(--ok); }
  .p-pending, .p-try { background: var(--wait-soft); color: var(--wait); }
  .p-todo { background: var(--due-soft); color: var(--due); }
  .p-open { background: var(--info-soft); color: var(--info); }
  .p-info { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }

  /* flight / sailing / car */
  .leg { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; margin-top: 10px; }
  .leg .t { font: 650 32px/1 var(--f-num); letter-spacing: -.02em; }
  .leg .p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .leg .mid { color: var(--ink-3); padding-bottom: 20px; text-align: center; }
  .leg .mid svg { width: 22px; height: 22px; }
  .leg .r { text-align: right; }
  .seats { margin-top: 10px; font-size: 14px; color: var(--ink-2); }

  /* stays */
  .nights { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .inout { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .inout div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .inout b { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .deadline { font-size: 14px; margin-top: 10px; }
  .deadline.soon { color: var(--wait); font-weight: 600; }
  .deadline.past { color: var(--ink-3); }

  /* places */
  .item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item.noclk { grid-template-columns: 1fr; }
  .item .clk { font: 600 15px var(--f-num); color: var(--ink-2); padding-top: 1px; }
  .item .it { font-weight: 600; }
  .item .dt { font-size: 14px; color: var(--ink-2); margin-top: 3px; }
  .item .lk { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 14px; font-weight: 600; }
  .item .lk a { text-decoration: none; }
  .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  /* days */
  .day { display: grid; grid-template-columns: 56px 1fr; }
  .dbadge { text-align: center; padding: 14px 0; border-right: 1px solid var(--line); background: var(--surface-2); }
  .dbadge .dw { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .dbadge .dn { font: 650 26px/1.1 var(--f-num); }
  .card.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.today .dbadge { background: var(--accent); color: var(--accent-ink); }
  .card.today .dbadge .dw { color: var(--accent-ink); opacity: .85; }
  .card.done { opacity: .6; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 5px 0; font-size: 15px; }
  .steps li .st { font: 600 14px var(--f-num); color: var(--ink-3); padding-top: 1px; }
  .steps li a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .steps li.drive span:last-child { color: var(--ink-2); }
  .night { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .night svg { width: 16px; height: 16px; flex: none; }
  .night a { color: var(--ink); font-weight: 600; text-decoration: none; }

  .todo { list-style: none; margin: 0; padding: 4px 0; }
  .todo li { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 15px; display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
  .todo li { cursor: pointer; }
  .todo li:first-child { border-top: 0; }
  .todo li::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--wait); border-radius: 4px; margin-top: 3px; }
  .todo li.ticked { color: var(--ink-3); text-decoration: line-through; }
  .todo li.ticked::before { background: var(--ok); border-color: var(--ok); }
  .todobox { margin-top: 16px; }
  .todobox > .more { border-top: 0; color: var(--ink); }
  .todobox[open] > .more { border-bottom: 1px solid var(--line); }
  .todobox .more .pill { margin-left: 6px; vertical-align: 1px; }
  .todo a { font-weight: 600; font-size: 14px; display: inline-block; margin-top: 3px; }

  .costs .facts div { grid-template-columns: 1fr auto; }
  .costs .facts div:last-child { font-weight: 700; }
  .foot { text-align: center; color: var(--ink-3); font-size: 13px; margin: 20px 0 8px; }
  .foot button { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px; cursor: pointer; }
  .empty { color: var(--ink-3); padding: 16px; text-align: center; }

  /* ---------- tab bar ---------- */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  nav.tabs button {
    background: none; border: 0; padding: 6px 0 4px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); cursor: pointer;
  }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9;
  }
  .toast.on { opacity: 1; }
  .hint { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .hint button { float: right; background: none; border: 0; color: var(--ink-3); font-size: 18px; line-height: 1; cursor: pointer; }
  /* ---------- passes ---------- */
  .passes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 14px; }
  .pad .passes { padding: 12px 0 0; }
  .pthumb {
    width: 64px; height: 64px; border-radius: 10px; overflow: hidden; padding: 0;
    border: 1px solid var(--line); background: #fff; cursor: pointer; position: relative;
  }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pthumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .padd {
    height: 40px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    border: 1.5px dashed var(--line); background: none; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
  }
  .padd svg { width: 16px; height: 16px; }
  .passgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 14px 16px; }
  .passgrid .pthumb { width: 100%; height: auto; aspect-ratio: 1; }
  .passgrid .pthumb span { font-size: 11px; padding: 2px 5px; }

  #viewer {
    position: fixed; inset: 0; z-index: 20; background: #fff; color: #111;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .vbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; }
  .vbar span { text-align: center; font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbar button, .vfoot button { background: none; border: 0; font-size: 16px; font-weight: 600; color: #1F6B63; padding: 8px 6px; cursor: pointer; }
  .vbar .vdel { color: #B03A2E; font-size: 14px; }
  .vimg { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
  .vimg img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: -webkit-optimize-contrast; }
  .vfoot { display: flex; justify-content: center; align-items: center; gap: 24px; padding: 4px; }
  .vfoot button { font-size: 30px; line-height: 1; padding: 4px 16px; }
  .vfoot button:disabled { opacity: .25; }
  .vtip { text-align: center; font-size: 13px; color: #666; margin: 0 0 10px; }
  @media (min-width: 760px) { body { font-size: 17px; } }
</style>
</head>
<body>

<form id="lock" autocomplete="off">
  <div class="lockbox">
    <img class="mark" src="./trip-192.png" alt="">
    <h1>Trips</h1>
    <p>Enter the passphrase to open your bookings. After that they're saved on this phone and work without signal.</p>
    <input id="pass" type="password" placeholder="Passphrase" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Passphrase">
    <label class="rem"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="primary" id="unlockBtn" type="submit">Open</button>
    <div id="lockErr" role="status"></div>
  </div>
</form>

<div id="app" hidden>
  <header class="top">
    <div class="toprow">
      <div>
        <h1 class="trip" id="tripName"></h1>
        <p class="tripsub" id="tripSub"></p>
      </div>
      <span class="chip" id="offline"><span class="dot"></span><span id="offlineTxt">Saving…</span></span>
    </div>
    <select class="tripsel" id="tripSel" hidden aria-label="Trip"></select>
    <div class="countdown" id="countdown"></div>
    <div class="hint" id="installHint" hidden><button type="button" id="hintX" aria-label="Dismiss">×</button>To keep this as an app: tap <b>Share</b> then <b>Add to Home Screen</b>.</div>
  </header>

  <main>
    <section class="view" id="v-days"></section>
    <section class="view" id="v-travel" hidden></section>
    <section class="view" id="v-stays" hidden></section>
    <section class="view" id="v-places" hidden></section>
    <div class="foot" id="foot"></div>
  </main>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-v="days" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Days</button>
    <button type="button" role="tab" data-v="travel" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5 3 11l1.5-1.5 7.5 1 4-4.5c1-1.1 2.8-1.6 3.5-.9.7.7.2 2.5-.9 3.5l-4.5 4 1 7.5L13.5 22 11 14.5"/></svg>Travel</button>
    <button type="button" role="tab" data-v="stays" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V7M3 14h18v5M21 14v-2.5a3 3 0 0 0-3-3h-7V14"/><circle cx="7" cy="11" r="1.8"/></svg>Stays</button>
    <button type="button" role="tab" data-v="places" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Places</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="passFile" accept="image/*" multiple hidden>
  <div id="viewer" role="dialog" aria-modal="true" aria-label="Pass" hidden>
    <div class="vbar">
      <button type="button" id="vClose">Done</button>
      <span id="vLabel" role="button" tabindex="0" title="Tap to rename"></span>
      <button type="button" id="vDel" class="vdel">Delete</button>
    </div>
    <div class="vimg"><img id="vImg" alt=""></div>
    <div class="vfoot">
      <button type="button" id="vPrev" aria-label="Previous">‹</button>
      <span id="vCount"></span>
      <button type="button" id="vNext" aria-label="Next">›</button>
    </div>
    <p class="vtip">Turn your screen brightness up for scanners.</p>

<script>
(() => {
  "use strict";
  const LS_PASS = "trips.passphrase";
  const LS_TAB = "trips.tab";
  const LS_TRIP = "trips.current";
  const LS_HINT = "trips.hintDismissed";
  const LS_TODO_OPEN = "trips.todoOpen";
  // Ticks live on this device only, keyed by the item's text so a rebuilt
  // trip keeps them unless the wording changes.
  const ticks = () => { try { return new Set(JSON.parse(store.get("trips.ticks." + trip.id) || "[]")); } catch (_) { return new Set(); } };
  const saveTicks = (s) => store.set("trips.ticks." + trip.id, JSON.stringify([...s]));
  const $ = (id) => document.getElementById(id);
  const blob = JSON.parse($("vault").textContent);
  const bytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} }
  };

  // ---------- helpers ----------
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const d = (iso) => { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd); };
  const fmt = (iso) => { const x = d(iso); return DAYS[x.getDay()] + " " + x.getDate() + " " + MONTHS[x.getMonth()]; };
  const todayIso = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); };
  const daysBetween = (a, b) => Math.round((d(b) - d(a)) / 86400000);
  const maps = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  const tel = (p) => "tel:" + p.replace(/[^\d+]/g, "");

  const I = {
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    plane: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>',
    ship: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2 5h14l2-5H3zM6 15V9h12v6M12 9V4"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v2H3zM7 16v2M17 16v2"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/></svg>',
    bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V7M3 14h18v5M21 14v-2.5a3 3 0 0 0-3-3h-7V14"/></svg>'
  };
  const linkIcon = (href) => href.startsWith("tel:") ? I.call : href.startsWith("mailto:") ? I.mail : href.includes("/maps/") ? I.map : I.link;
  const btn = (label, href, cls) => '<a class="btn ' + (cls || "") + '" href="' + esc(href) + '"' + (href.startsWith("http") ? ' target="_blank" rel="noopener"' : "") + ">" + linkIcon(href) + esc(label) + "</a>";
  const refChip = (label, value) => '<span class="ref" data-copy="' + esc(value) + '" role="button" tabindex="0" title="Tap to copy"><small>' + esc(label) + "</small>" + esc(value) + "</span>";
  const facts = (rows) => rows && rows.length ? '<dl class="facts">' + rows.map(r => "<div><dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd></div>").join("") + "</dl>" : "";
  const pillText = { booked: "Booked", pending: "Requested", todo: "To do", try: "Full: try on the day", open: "Drop in", info: "Note" };

  let trip = null, all = [];

  // ---------- passes: QR codes and boarding passes kept on this device ----------
  // Images live in IndexedDB on this phone only; they never go to the site or
  // the repo. Each is filed under a booking key such as "travel:fl-out".
  const passDb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("trips-passes", 1);
      r.onupgradeneeded = () => {
        const s = r.result.createObjectStore("passes", { keyPath: "id", autoIncrement: true });
        s.createIndex("trip", "trip");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("passes", mode);
        const out = fn(t.objectStore("passes"));
        t.oncomplete = () => res(out && out.result);
        t.onerror = () => rej(t.error);
      });
    };
    return {
      forTrip: (tripId) => tx("readonly", s => s.index("trip").getAll(tripId)),
      add: (rec) => tx("readwrite", s => s.add(rec)),
      put: (rec) => tx("readwrite", s => s.put(rec)),
      del: (id) => tx("readwrite", s => s.delete(id))
    };
  })();

  let passes = [];          // this trip's passes, loaded after unlock
  const urls = new Map();   // pass id -> object URL
  const urlFor = (p) => { if (!urls.has(p.id)) urls.set(p.id, URL.createObjectURL(p.blob)); return urls.get(p.id); };

  const passSlot = (key, label) => '<div class="passes" data-pk="' + esc(key) + '" data-pl="' + esc(label) + '"></div>';

  async function loadPasses() {
    try { passes = (await passDb.forTrip(trip.id)) || []; } catch (_) { passes = []; }
    passes.sort((a, b) => a.added - b.added);
    fillPasses();
  }

  // On a booking's own card the thumb shows just whose it is (after " · ");
  // in the "Your passes" grid it shows the whole label.
  const thumb = (p, full) => {
    const short = p.label.includes(" · ") ? p.label.split(" · ").pop() : "";
    const cap = full ? p.label : short;
    return '<button type="button" class="pthumb" data-pass="' + p.id + '" aria-label="Open ' + esc(p.label) + '"><img src="' + urlFor(p) + '" alt="">' + (cap ? "<span>" + esc(cap) + "</span>" : "") + "</button>";
  };

  function fillPasses() {
    document.querySelectorAll(".passes[data-pk]").forEach(el => {
      const mine = passes.filter(p => p.key === el.dataset.pk);
      el.innerHTML = mine.map(p => thumb(p, false)).join("") +
        '<button type="button" class="padd" data-add="' + esc(el.dataset.pk) + '" data-label="' + esc(el.dataset.pl) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 18v3h-3"/></svg>' +
        (mine.length ? "Add another" : "Add pass or QR") + "</button>";
    });
    const box = $("allPasses");
    if (box) {
      box.hidden = !passes.length;
      const grid = box.querySelector(".passgrid");
      if (grid) grid.innerHTML = passes.map(p => thumb(p, true)).join("");
      const cnt = $("passCount");
      if (cnt) cnt.textContent = String(passes.length);
    }
  }

  // Big photos are shrunk so the phone's storage isn't eaten, but kept large
  // enough (2000 px) that a QR code or barcode still scans. Screenshots are
  // usually under that and stay untouched.
  async function prepare(file) {
    if (file.size < 1.5e6) return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.size < 4e6) return file;
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.92));
    } catch (_) { return file; }
  }

  let adding = null;
  $("passFile").addEventListener("change", async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (!files.length || !adding) return;
    const { key, label } = adding;
    const already = passes.filter(p => p.key === key).length;
    let n = 0;
    const first = (s) => String(s).split(" ")[0];
    for (const f of files) {
      const blob = await prepare(f);
      const idx = already + n + 1;
      // Family passes: suggest the trip's people in order so each one is
      // labelled with who it belongs to. Cancel keeps the suggestion.
      const who = trip.people && trip.people[idx - 1] ? first(trip.people[idx - 1]) : String(idx);
      const suggested = (already + files.length > 1 || (trip.people || []).length > 1) ? label + " · " + who : label;
      const typed = window.prompt("Whose pass is this? (" + (n + 1) + " of " + files.length + ")", suggested);
      const rec = { trip: trip.id, key, label: (typed && typed.trim()) || suggested, blob, added: Date.now() + n };
      try { rec.id = await passDb.add(rec); passes.push(rec); n++; }
      catch (_) { toast("Couldn't save that on this phone"); }
    }
    if (n) {
      toast(n === 1 ? "Pass saved on this phone" : n + " passes saved on this phone");
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    }
    fillPasses();
  });

  // Full-screen viewer, white background, screen kept awake while open.
  let vList = [], vAt = 0, wake = null;
  function openViewer(id) {
    const p = passes.find(x => x.id === id);
    if (!p) return;
    vList = passes.filter(x => x.key === p.key);
    if (vList.length < 2) vList = passes.slice();   // single pass: step through them all
    vAt = vList.indexOf(p);
    drawViewer();
    $("viewer").hidden = false;
    document.body.style.overflow = "hidden";
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {});
  }
  function drawViewer() {
    const p = vList[vAt];
    $("vImg").src = urlFor(p);
    $("vLabel").textContent = p.label;
    $("vCount").textContent = vList.length > 1 ? (vAt + 1) + " of " + vList.length : "";
    $("vPrev").disabled = vAt === 0;
    $("vNext").disabled = vAt === vList.length - 1;
    $("vPrev").hidden = $("vNext").hidden = vList.length < 2;
  }
  function closeViewer() {
    $("viewer").hidden = true;
    document.body.style.overflow = "";
    if (wake) { wake.release().catch(() => {}); wake = null; }
  }
  $("vClose").addEventListener("click", closeViewer);
  $("vPrev").addEventListener("click", () => { if (vAt > 0) { vAt--; drawViewer(); } });
  $("vNext").addEventListener("click", () => { if (vAt < vList.length - 1) { vAt++; drawViewer(); } });
  $("vDel").addEventListener("click", async () => {
    const p = vList[vAt];
    if (!confirm("Delete “" + p.label + "” from this phone?")) return;
    try { await passDb.del(p.id); } catch (_) {}
    passes = passes.filter(x => x.id !== p.id);
    if (urls.has(p.id)) { URL.revokeObjectURL(urls.get(p.id)); urls.delete(p.id); }
    closeViewer(); fillPasses(); toast("Deleted");
  });
  // Tap the title to rename a pass (e.g. put whose it is).
  $("vLabel").addEventListener("click", async () => {
    const p = vList[vAt];
    const typed = window.prompt("Rename this pass", p.label);
    if (!typed || !typed.trim() || typed.trim() === p.label) return;
    p.label = typed.trim();
    try { await passDb.put(p); } catch (_) {}
    drawViewer(); fillPasses();
  });
  // Swipe left/right between passes.
  let sx = null;
  $("viewer").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  $("viewer").addEventListener("touchend", e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (dx < -50) $("vNext").click(); else if (dx > 50) $("vPrev").click();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("viewer").hidden) closeViewer(); });

  // ---------- views ----------
  function renderDays() {
    const t = todayIso();
    const stays = Object.fromEntries(trip.stays.map(s => [s.id, s]));
    let h = "";
    if (trip.todo && trip.todo.length) {
      const ticked = ticks();
      const left = trip.todo.filter(x => !ticked.has(x.text)).length;
      h += '<details class="card todobox"' + (store.get(LS_TODO_OPEN) === "1" ? " open" : "") + '><summary class="more"><span>Still to sort <span class="pill ' + (left ? "p-pending" : "p-booked") + '">' + (left ? left + " left" : "All done") + "</span></span></summary>" +
        '<ul class="todo">' +
        trip.todo.map(x => '<li class="' + (ticked.has(x.text) ? "ticked" : "") + '" data-tick="' + esc(x.text) + '"><span>' + esc(x.text) + (x.link ? '<br><a href="' + esc(x.link) + '"' + (x.link.startsWith("http") ? ' target="_blank" rel="noopener"' : "") + ">Open</a>" : "") + "</span></li>").join("") +
        "</ul></details>";
    }
    // Closed by default on every open: the front screen stays about the days.
    h += '<details class="card todobox" id="allPasses" hidden><summary class="more"><span>Your passes <span class="pill p-info" id="passCount"></span></span></summary><div class="passgrid"></div></details>';
    h += "<h2>Day by day</h2>";
    trip.days.forEach(day => {
      const x = d(day.date);
      const cls = day.date === t ? " today" : (day.date < t ? " done" : "");
      const stay = day.stay && stays[day.stay];
      h += '<div class="card' + cls + '" id="day-' + day.date + '"><div class="day">' +
        '<div class="dbadge"><div class="dw">' + DAYS[x.getDay()] + '</div><div class="dn">' + x.getDate() + '</div><div class="dw">' + MONTHS[x.getMonth()] + "</div></div>" +
        '<div class="pad"><div class="ctitle">' + esc(day.title) + (day.date === t ? ' <span class="pill p-booked">Today</span>' : "") + "</div>" +
        '<ul class="steps">' + day.steps.map(s => {
          const drive = !s[2];
          const text = s[2] ? '<a href="#" data-go="' + esc(s[2]) + '">' + esc(s[1]) + "</a>" : esc(s[1]);
          return '<li class="' + (drive ? "drive" : "") + '"><span class="st">' + esc(s[0] || (drive ? "🚗" : "")) + "</span><span>" + text + "</span></li>";
        }).join("") + "</ul>" +
        (stay ? '<div class="night">' + I.bed + '<span>Night: <a href="#" data-go="stay:' + esc(stay.id) + '">' + esc(stay.name) + "</a>" + (stay.breakfast ? " · breakfast" : "") + "</span></div>" : "") +
        "</div></div></div>";
    });
    if (trip.costs) {
      h += '<h2>Costs</h2><div class="card costs">' + facts(trip.costs) + "</div>";
    }
    $("v-days").innerHTML = h;
    const box = $("v-days").querySelector(".todobox");
    if (box) box.addEventListener("toggle", () => store.set(LS_TODO_OPEN, box.open ? "1" : "0"));
  }

  function renderTravel() {
    let h = "";
    const groups = [["flight", "Flights"], ["sailing", "Sailings"], ["car", "Car"], ["train", "Trains"]];
    groups.forEach(([kind, label]) => {
      const items = trip.travel.filter(x => x.kind === kind);
      if (!items.length) return;
      h += "<h2>" + label + "</h2>";
      items.forEach(x => {
        const icon = kind === "sailing" ? I.ship : kind === "car" ? I.car : I.plane;
        const whenEnd = x.endDate && x.endDate !== x.date ? fmt(x.endDate) + " " : "";
        h += '<div class="card" id="travel-' + esc(x.id) + '"><div class="pad">' +
          '<div class="eyebrow">' + esc(fmt(x.date)) + " · " + esc(x.carrier) + (x.number ? " " + esc(x.number) : "") + "</div>" +
          '<div class="ctitle">' + esc(x.title) + "</div>" +
          '<div class="leg"><div><div class="t">' + esc(x.dep) + '</div><div class="p">' + esc(x.from) + "</div></div>" +
          '<div class="mid">' + icon + '</div><div class="r"><div class="t">' + esc(x.arr) + '</div><div class="p">' + esc(whenEnd + x.to) + "</div></div></div>" +
          (x.seats ? '<div class="seats">Seats: ' + esc(x.seats) + "</div>" : "") +
          (x.vehicle ? '<div class="seats">' + esc(x.vehicle) + "</div>" : "") +
          '<div class="refs">' + refChip(x.refLabel || "Ref", x.ref) + (x.ref2 ? refChip(x.ref2Label || "Ref", x.ref2) : "") + "</div>" +
          passSlot("travel:" + x.id, kind === "flight" ? (x.number || x.title) + " boarding pass" : kind === "car" ? "Car hire voucher" : (x.number || x.title) + " ticket") +
          "</div>" +
          '<details><summary class="more">Details</summary>' + facts(x.facts) +
          (x.notes ? '<p class="note">' + esc(x.notes) + "</p>" : "") +
          (x.links && x.links.length ? '<div class="btns">' + x.links.map(l => btn(l[0], l[1], "")).join("") + "</div>" : "") +
          "</details></div>";
      });
    });
    $("v-travel").innerHTML = h || '<p class="empty">No travel booked for this trip.</p>';
  }

  function renderStays() {
    const t = todayIso();
    let h = "<h2>Where you're staying</h2>";
    trip.stays.forEach(s => {
      const n = daysBetween(s.in, s.out);
      const left = s.cancel ? daysBetween(t, s.cancel) : null;
      const dl = s.cancel ? (left < 0 ? '<div class="deadline past">Free cancellation has ended</div>'
        : '<div class="deadline' + (left <= 7 ? " soon" : "") + '">' + esc(s.cancelText) + " · " + (left === 0 ? "today" : left + " day" + (left === 1 ? "" : "s") + " left") + "</div>") : "";
      h += '<div class="card" id="stay-' + esc(s.id) + '"><div class="pad">' +
        '<div class="nights eyebrow">' + esc(fmt(s.in)) + " → " + esc(fmt(s.out)) + " · " + n + " night" + (n === 1 ? "" : "s") + " · " + esc(s.place) + "</div>" +
        '<div class="ctitle">' + esc(s.name) + "</div>" +
        '<div class="muted small">' + esc(s.room) + "</div>" +
        '<div class="badges">' + (s.breakfast ? '<span class="pill p-booked">Breakfast included</span>' : '<span class="pill p-info">Room only</span>') + "</div>" +
        '<div class="inout"><div><b>Check in</b>' + esc(s.checkin) + "</div><div><b>Check out</b>" + esc(s.checkout) + "</div></div>" +
        '<div class="refs">' + refChip("Booking.com", s.ref) + (s.pin ? '<span class="ref" data-pin="' + esc(s.pin) + '" role="button" tabindex="0"><small>PIN</small>Show</span>' : "") + "</div>" +
        dl + "</div>" +
        '<div class="btns">' + btn("Directions", maps(s.name + ", " + s.address), "acc") + (s.phone ? btn("Call", tel(s.phone), "") : "") + "</div>" +
        passSlot("stay:" + s.id, s.name) +
        '<details><summary class="more">Details</summary>' +
        facts([["Address", s.address], ["Phone", s.phone], ["Price", s.price], ["Payment", s.pay], ["Parking", s.parking]]) +
        (s.notes ? '<p class="note">' + esc(s.notes) + "</p>" : "") +
        "</details></div>";
    });
    $("v-stays").innerHTML = h;
  }

  function renderPlaces() {
    let h = "";
    trip.places.forEach(p => {
      h += '<h2 class="phead"><span>' + esc(p.name) + "</span><span>" + esc(p.dates) + "</span></h2>" +
        '<div class="card" id="place-' + esc(p.id) + '">' +
        p.items.map(it => '<div class="item' + (it.clock ? "" : " noclk") + '">' + (it.clock ? '<div class="clk">' + esc(it.clock) + "</div>" : "") + "<div>" +
          '<div class="it">' + esc(it.title) + ' <span class="pill p-' + esc(it.status) + '">' + esc(pillText[it.status] || it.status) + "</span></div>" +
          (it.detail ? '<div class="dt">' + esc(it.detail) + "</div>" : "") +
          (it.links && it.links.length ? '<div class="lk">' + it.links.map(l => '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + " ›</a>").join("") + "</div>" : "") +
          "</div></div>").join("") +
        '<div class="passes" data-pk="place:' + esc(p.id) + '" data-pl="' + esc(p.name) + ' ticket" style="padding-top:12px;border-top:1px solid var(--line)"></div>' +
        '<div class="btns">' +
        (p.map ? btn("Map", maps(p.map), "acc") : "") +
        (p.contacts || []).map(c => btn(c[0], c[1], "")).join("") +
        "</div></div>";
    });
    $("v-places").innerHTML = h;
  }

  function renderHeader() {
    $("tripName").textContent = trip.name;
    $("tripSub").textContent = trip.sub;
    document.title = trip.name;
    const t = todayIso();
    const cd = $("countdown");
    if (t < trip.start) {
      const n = daysBetween(t, trip.start);
      const first = trip.travel.filter(x => x.date === trip.start).sort((a, b) => a.dep.localeCompare(b.dep))[0];
      cd.innerHTML = "<span>" + (first ? "First up: " + esc(first.number || first.title) + " at " + esc(first.dep) + ", " + esc(fmt(first.date)) : "Starts " + esc(fmt(trip.start))) + "</span><strong>" + n + (n === 1 ? " day" : " days") + "</strong>";
    } else if (t <= trip.end) {
      const n = daysBetween(trip.start, t) + 1, total = daysBetween(trip.start, trip.end) + 1;
      const day = trip.days.find(x => x.date === t);
      cd.innerHTML = "<span>" + (day ? esc(day.title) : "On the trip") + "</span><strong>Day " + n + "/" + total + "</strong>";
    } else {
      cd.innerHTML = "<span>Trip finished " + esc(fmt(trip.end)) + "</span><strong>✓</strong>";
    }
    $("foot").innerHTML = "Bookings as of " + esc(fmt(trip.updated)) + '<br><button type="button" id="forget">Lock and forget on this device</button>';
    $("forget").addEventListener("click", () => {
      if (!confirm("Remove the saved passphrase from this device? You'll need it to open the trip again.")) return;
      store.del(LS_PASS); location.reload();
    });
  }

  function renderAll() {
    renderHeader(); renderDays(); renderTravel(); renderStays(); renderPlaces();
    fillPasses();
  }

  // ---------- tabs and jumping between them ----------
  function showTab(v) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === v)));
    document.querySelectorAll("section.view").forEach(s => { s.hidden = s.id !== "v-" + v; });
    store.set(LS_TAB, v);
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.v); window.scrollTo(0, 0); }));

  function go(target) {
    const [kind, id] = target.split(":");
    const tab = kind === "travel" ? "travel" : kind === "stay" ? "stays" : "places";
    showTab(tab);
    const el = $(kind + "-" + id);
    if (!el) return;
    const det = el.querySelector("details"); if (det) det.open = true;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  let toastT;
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); };

  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const c = e.target.closest("[data-copy]");
    if (c) {
      const v = c.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("Copied " + v), () => toast(v));
      return;
    }
    const tk = e.target.closest("[data-tick]");
    if (tk && !e.target.closest("a")) {
      const s = ticks(), k = tk.dataset.tick;
      s.has(k) ? s.delete(k) : s.add(k);
      saveTicks(s);
      renderDays();
      fillPasses();
      return;
    }
    const add = e.target.closest("[data-add]");
    if (add) { adding = { key: add.dataset.add, label: add.dataset.label }; $("passFile").click(); return; }
    const pt = e.target.closest("[data-pass]");
    if (pt) { openViewer(Number(pt.dataset.pass)); return; }
    const p = e.target.closest("[data-pin]");
    if (p) { p.innerHTML = "<small>PIN</small>" + esc(p.dataset.pin); p.removeAttribute("data-pin"); p.dataset.copy = p.textContent.replace("PIN", ""); }
  });

  // ---------- offline status ----------
  async function offlineStatus() {
    const chip = $("offline"), txt = $("offlineTxt");
    if (!("serviceWorker" in navigator) || !window.caches) { txt.textContent = "Online only"; return; }
    try {
      await navigator.serviceWorker.ready;
      const hit = await caches.match("./trip.html");
      if (hit) { chip.classList.add("ready"); txt.textContent = navigator.onLine ? "Saved offline" : "Offline"; }
      else { txt.textContent = "Saving…"; setTimeout(offlineStatus, 2500); }
    } catch (_) { txt.textContent = "Online only"; }
  }
  window.addEventListener("online", offlineStatus);
  window.addEventListener("offline", offlineStatus);

  function installHint() {
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (standalone || !ios || store.get(LS_HINT)) return;
    $("installHint").hidden = false;
    $("hintX").addEventListener("click", () => { $("installHint").hidden = true; store.set(LS_HINT, "1"); });
  }

  // ---------- unlock ----------
  async function open(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: bytes(blob.salt), iterations: blob.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(blob.iv) }, key, bytes(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function pickTrip() {
    const t = todayIso();
    const saved = store.get(LS_TRIP);
    return all.find(x => x.id === saved)
      || all.find(x => x.end >= t)
      || all[all.length - 1];
  }

  function show(data) {
    all = (data.trips || [data]).slice().sort((a, b) => a.start.localeCompare(b.start));
    trip = pickTrip();
    $("lock").hidden = true;
    $("app").hidden = false;
    const sel = $("tripSel");
    if (all.length > 1) {
      sel.hidden = false;
      sel.innerHTML = all.map(x => '<option value="' + esc(x.id) + '"' + (x === trip ? " selected" : "") + ">" + esc(x.name) + " · " + esc(fmt(x.start)) + "</option>").join("");
      sel.addEventListener("change", () => { trip = all.find(x => x.id === sel.value); store.set(LS_TRIP, trip.id); renderAll(); loadPasses(); });
    }
    renderAll();
    loadPasses();
    const tab = store.get(LS_TAB);
    showTab(["days", "travel", "stays", "places"].includes(tab) ? tab : "days");
    const today = $("day-" + todayIso());
    if (today && (tab || "days") === "days") setTimeout(() => today.scrollIntoView({ block: "center" }), 50);
    offlineStatus();
    installHint();
  }

  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = $("pass").value.trim().toLowerCase().replace(/\s+/g, " ");
    if (!pass) return;
    $("unlockBtn").disabled = true; $("lockErr").textContent = "Opening…";
    try {
      const data = await open(pass);
      if ($("remember").checked) store.set(LS_PASS, pass);
      $("lockErr").textContent = "";
      show(data);
    } catch (_) {
      $("lockErr").textContent = "That passphrase didn't open it. Check the spaces between words.";
      $("unlockBtn").disabled = false;
    }
  });

  const saved = store.get(LS_PASS);
  if (saved) open(saved).then(show).catch(() => store.del(LS_PASS));
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
</script>
</body>
</html>
